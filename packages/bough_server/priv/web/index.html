<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>bough</title>
    <link rel="icon" href="/static/logo.svg" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header id="topbar">
      <button id="toggle-left" class="pane-toggle" title="Toggle sessions panel" aria-label="Toggle sessions panel">‹</button>
      <div class="brand">
        <img src="/static/logo.svg" alt="bough" width="22" height="24" />
        <span>bough</span>
      </div>
      <div class="ctx" id="ctx"></div>
      <div class="spacer"></div>
      <label class="review-toggle" title="Pause each plan for your approval before it runs">
        <input type="checkbox" id="review-toggle" />
        <span>plan review</span>
      </label>
      <div class="model" id="model"></div>
      <button id="toggle-right" class="pane-toggle" title="Toggle side panel" aria-label="Toggle side panel">›</button>
    </header>

    <main id="layout">
      <aside id="sidebar">
        <button id="new-session" class="primary">+ New session</button>
        <input id="session-search" class="search" type="search" placeholder="Search sessions…" aria-label="Search sessions" />
        <div class="sessions" id="sessions"></div>
      </aside>

      <section id="center">
        <div class="transcript" id="transcript"></div>
        <div id="editbar" hidden></div>
        <div id="attachments" hidden></div>
        <div id="filepicker" hidden role="listbox" aria-label="File suggestions"></div>
        <form id="composer" autocomplete="off">
          <button type="button" id="stop" class="composer-stop" title="Stop this run at its next step" hidden>■ Stop</button>
          <textarea id="prompt" rows="2" placeholder="Ask bough to do something…  (Enter to send, Shift+Enter for newline)"></textarea>
          <button type="submit" id="send" class="primary">Send</button>
        </form>
        <div id="scrim"></div>
        <aside id="drawer" aria-hidden="true" role="dialog" aria-modal="true"></aside>
      </section>

      <aside id="rightpane">
        <nav class="tabs" id="tabs">
          <button data-tab="tree" class="active">Tree</button>
          <button data-tab="changes">Changes</button>
          <button data-tab="network">Network</button>
          <button data-tab="caps">Capabilities</button>
          <button data-tab="subagents">Subagents</button>
        </nav>
        <div class="tabbody" id="tabbody"></div>
      </aside>
    </main>

    <div id="nav-scrim" aria-hidden="true"></div>
    <div id="toast"></div>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
