<svg width="240" height="260" viewBox="0 0 240 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="bough logo: a high-cut tree trunk with one branch">
  <!-- one bough, still growing off the cut trunk -->
  <g stroke="#5e8c4e" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M150 132 C 185 122, 198 92, 206 60" />
    <path d="M188 96 C 198 92, 210 92, 220 86" />
  </g>
  <!-- leaves -->
  <g fill="#6fa85b">
    <ellipse cx="208" cy="54" rx="13" ry="9" transform="rotate(-35 208 54)" />
    <ellipse cx="224" cy="82" rx="11" ry="8" transform="rotate(20 224 82)" />
    <ellipse cx="176" cy="86" rx="10" ry="7" transform="rotate(-20 176 86)" />
  </g>

  <!-- trunk: a tall sawn-off stump -->
  <path d="M70 78 L70 212 Q70 224 82 226 L138 226 Q150 224 150 212 L150 78 Z" fill="#b5894f" />
  <!-- a little bark shading on the right -->
  <path d="M150 80 L150 212 Q150 224 138 226 L126 226 L126 80 Z" fill="#a2784170" />

  <!-- the high cut: a sawn top disc with rings -->
  <ellipse cx="110" cy="78" rx="40" ry="15" fill="#c9a36a" />
  <ellipse cx="110" cy="78" rx="26" ry="9.5" stroke="#9c7842" stroke-width="3" fill="none" />
  <ellipse cx="110" cy="78" rx="12" ry="4.5" stroke="#9c7842" stroke-width="3" fill="none" />
</svg>
