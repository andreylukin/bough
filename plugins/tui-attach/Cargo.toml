[package]
name = "bough-plugin-tui-attach"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# §11 "The resident": the listener half of bough's resident/attach transport. One row on the tui
# profile binds `$BOUGH_HOME/tui.sock`; a thin `bough` client connects, the shell's published
# frames are re-rendered to it as ANSI diffs, and its terminal events are fed into the shell's
# ordinary event path. One client at a time; a new attach detaches the old. The CLIENT half lives
# in the launcher (`crates/bough/src/attach.rs`) and speaks `proto` from this crate.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-commands = { workspace = true }
bough-plugin-tui-shell = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
