# The `commands` Service Definition (§11): the human-command registry, `parse`, scoped resolution,
# `dispatch` and `commands/dispatched`. Consumers are `tui-shell`'s built-ins and, from Phase 6,
# `bough mcp call`. It holds live state (the registry), so it IS a catalog row and provides its key.

