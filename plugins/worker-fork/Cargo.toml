[package]
name = "bough-plugin-worker-fork"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The `WorkerKind::Fork` Provider (§10): a child agent on a REAL ledger fork of the parent's
# trajectory, with the parent's assembled prefix pinned byte-identically. Registers on `workers`;
# provides no key of its own. Row `worker.fork` in `bough-base`.

