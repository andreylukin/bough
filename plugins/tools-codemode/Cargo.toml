[package]
name = "bough-plugin-tools-codemode"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `conceal: seam` names `ToolsHandle::conceal`, which does not exist on this branch. The mode is
# rejected at load unless this is on, so a bundle cannot ask for it and boot green.
seam-conceal = []

[dependencies]
bough-kernel = { workspace = true }
bough-plugin-js = { workspace = true }
bough-plugin-tools = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-projection = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
inventory = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
# WP-5: the surface section is byte-stable for a fixed registry, and `SectionRequest` needs a
# real `LedgerHandle` even for a section that reads no row.
insta = { workspace = true }
# WP-5: `tests/section.rs` renders the surface from the config `bundles/bough-codemode.yml`
# actually ships, deserialised — so the fixture cannot document a surface no agent is shown.
serde_yaml = { workspace = true }
bough-plugin-ledger-memory = { workspace = true }
# WP-V5: the rest of the surface is proven against the REAL tools over their real seams, in the
# real engine — so the test crate depends on every row a fully-equipped agent mounts.
bough-plugin-js-quickjs = { workspace = true }
bough-plugin-tools-operator = { workspace = true }
bough-plugin-tool-actions = { workspace = true }
bough-plugin-tool-workers = { workspace = true }
bough-plugin-actions = { workspace = true }
bough-plugin-workers = { workspace = true }
bough-plugin-graph-ops = { workspace = true }
# The program row is folded on a string the surface spells independently; `tests/pins.rs` is the
# joint that keeps the two spellings equal.
bough-plugin-tui-focus = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }

[[test]]
name = "tests"
path = "tests/main.rs"
