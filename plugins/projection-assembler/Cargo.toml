[package]
name = "bough-plugin-projection-assembler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The deterministic projection Provider: the six fixed bands, the waterfall, and the fixed
# degradation ladder (§5). Its bundle row is `projection-assembler`.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-projection = { workspace = true }
# phase ux1 §2.10 (M25): the identity band names the tools actually registered.
bough-plugin-tools = { workspace = true }
bough-plugin-rollups = { workspace = true }      # §8: the expiry set the projector honours
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The one sanctioned exception to "consumers never depend on a provider" (P1-D1): the goldens link
# BOTH ledger providers on purpose and compare them byte for byte.
bough-plugin-ledger-sqlite = { workspace = true }
bough-plugin-ledger-memory = { workspace = true }
tempfile = { workspace = true }
