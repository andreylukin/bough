[package]
name = "bough-plugin-tui-drift"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# A Consumer of the `drift` seam (§8): the drift dashboard over drift-watch's per-agent signals,
# with §8's one-command reset reachable from it. It writes nothing: the reset goes out as a
# `PaneOutcome::Command("/reset <agent>")` through the existing `commands` seam (D-C3).

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-commands = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-drift-watch = { workspace = true }
bough-plugin-tui-shell = { workspace = true }
bough-plugin-tui-render = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[[test]]
name = "tests"
path = "tests/main.rs"
