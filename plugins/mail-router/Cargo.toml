[package]
name = "bough-plugin-mail-router"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The `mail` Service Definition AND its one Provider (P5-D6): the `Envelope` vocabulary, the pure
# ref matcher, fan-out through `Agent::deliver`, the unsorted queue and its sink slot, `link_ref`,
# and the leader-question entry point. §3, §5. Row `mail` in `bough-base`.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-rollups = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, features = ["chrono04"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
bough-plugin-ledger-memory = { workspace = true }
