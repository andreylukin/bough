[package]
name = "bough-plugin-rollups-summarizer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The `rollups` Provider (§8, §17 Phase 4): a recap-style map/reduce through `ctx.llm`, sealed
# blocks stamped with `prompt_ver` and `sealed_at`, the tier tree with configured fanout,
# supersession at generation n+1, digest rebuild, and `/seal`.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-rollups = { workspace = true }
bough-plugin-llm = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-commands = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
bough-llm = { workspace = true }
bough-plugin-ledger-memory = { workspace = true }
bough-plugin-llm-replay = { workspace = true }
