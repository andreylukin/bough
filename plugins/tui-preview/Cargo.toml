[package]
name = "bough-plugin-tui-preview"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# A Consumer of the `projection` seam (§11 "Digging", §5): the byte-exact projection preview pane.
# It owns no `ctx` key and no write path; it calls the same `ctx.projection` the wake flow calls.

