[package]
name = "bough-plugin-catch-up-on-wake"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# §13/§5: on power/wake, request ONE catch-up wake per active agent through the agents seam. `request_wake` already returns Nothing when nothing is queued, so 'over queued mail' falls out of the seam.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
bough-plugin-power = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-ledger = { workspace = true }

[dev-dependencies]
bough-plugin-power-test = { workspace = true }
bough-plugin-ledger-memory = { workspace = true }

[[test]]
name = "tests"
path = "tests/main.rs"
