[package]
name = "bough-plugin-llm-openrouter"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# §12: the OpenRouter Provider of the llm seam — bough-llm's chat-completions client behind the shared seam mapping. Claims `openrouter:*` model ids and strips the prefix to bough-llm's native `vendor/model` spelling; the key rides OPENROUTER_API_KEY, read at CALL time.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
bough-llm = { workspace = true }
bough-plugin-llm = { workspace = true }

[dev-dependencies]
bough-llm = { workspace = true, features = ["test-support"] }

[[test]]
name = "tests"
path = "tests/main.rs"
