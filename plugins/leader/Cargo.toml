[package]
name = "bough-plugin-leader"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The `leader` Service Definition and Provider: it binds the leader plugin set to ONE agent named
# by config, registers the persona section in that agent's scope, and owns unsorted adoption,
# requirement drafting, reconsolidation attribution and cross-agent timeline DATA. §2, §8.
# Row `leader` in `bough-tui-app`, inside the `leader.set` group.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-mail-router = { workspace = true }
bough-plugin-graph-ops = { workspace = true }
bough-plugin-claims = { workspace = true }
bough-plugin-projection = { workspace = true }
bough-plugin-rollups = { workspace = true }
bough-plugin-reconsolidation = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, features = ["chrono04"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
bough-plugin-ledger-memory = { workspace = true }
bough-plugin-projection-assembler = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "tests"
path = "tests/main.rs"
