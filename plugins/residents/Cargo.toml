[package]
name = "bough-plugin-residents"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# A Consumer (§5): resume every `agents` row at launch, bootstrap a first lane, and run ONE
# catch-up wake per agent over queued mail. It knows nothing about the TUI and is usable headless
# — §5's catch-up is not a terminal feature.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-agents = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
bough-plugin-ledger-memory = { workspace = true }
bough-plugin-agent-loop-scripted = { workspace = true }

[[test]]
name = "tests"
path = "tests/main.rs"
