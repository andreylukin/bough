# A CATALOG-ONLY `actions` Provider (decision D-C8): the `gh`-shaped Provider the crash-and-restart
# hardening test acts through. Named by no bundle; mounted by a test's own `--patch`. Tests never
# call the real `gh` (AGENTS.md): a recording shim goes first on PATH.

