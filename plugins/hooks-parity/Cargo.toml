[package]
name = "bough-plugin-hooks-parity"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# Drivability §5: the user's Claude Code + Codex hook settings, discovered per tool call from the
# call's OWN working directory (walk-up) plus the user layer, run on the tools seam — PreToolUse
# is a real deny/ask gate on `tools/pre-execute`, PostToolUse blocks or attaches context on
# `tools/post-execute`. Foreign settings files that fail to parse are warned about, never fatal.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
bough-plugin-tools = { workspace = true }
bough-plugin-ledger = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-util = { workspace = true }

[[test]]
name = "tests"
path = "tests/main.rs"
