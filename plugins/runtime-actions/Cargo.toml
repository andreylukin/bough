[package]
name = "bough-plugin-runtime-actions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# §9: the action vocabulary runtime code RETURNS, and the ONE executor that carries it out through the seams. NO ROW: shared so a runtime script's intent meets the write boundary in exactly one place.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-actions = { workspace = true }
bough-plugin-workers = { workspace = true }
bough-plugin-tools = { workspace = true }
bough-plugin-schedule = { workspace = true }

[dev-dependencies]
bough-plugin-ledger-memory = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
