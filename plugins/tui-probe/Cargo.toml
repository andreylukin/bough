[package]
name = "bough-plugin-tui-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# A FIXTURE in the `projection-probe` tradition: in the catalog and in NO bundle. It contributes
# two rows — `tui.probe` (a deterministic pane that panics on a configured key, for V8) and
# `tui.never` (a row declaring an injection nobody provides, so an enabled row can be made to never
# activate ON PURPOSE). Phase 8's fixture audit removes it.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-tui-shell = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
parking_lot = { workspace = true }
