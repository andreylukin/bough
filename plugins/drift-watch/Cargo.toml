[package]
name = "bough-plugin-drift-watch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# §8's drift-watch row: per-agent stability signals from the ledger, `/drift`, `/reset <agent>`
# (rebuild the digest, the identity and the about-line's STATE half from raw evidence; sealed tiers
# untouched) and `/supersede <rollup> <reason>` for a suspected-bad tier block.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-rollups = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-about-line = { workspace = true }
bough-plugin-commands = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tiktoken-rs = { workspace = true }      # thought-length in o200k tokens (§8)
tokio = { workspace = true }

[dev-dependencies]
# The behavioural twin of `ledger-sqlite`, so the reset's durable path runs against a REAL store.
bough-plugin-ledger-memory = { workspace = true }
# NOT `rollups-summarizer`: this crate's tests judge THIS row, and a fake `Summarizer` written to
# the seam's contract is what lets `/reset` and `/supersede` be tested without a model, a replay
# fixture, or a second row's bugs (the summarizer's own conformance suite lives in `rollups`).
serde_json = { workspace = true }
