[package]
name = "bough-plugin-dormancy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The `dormancy` Service Definition and its one Provider (P5-D6): the dormant fold, the
# `agent/wake-request` admission listener, reactivation + drain arming, and `/sleep` / `/wake`.
# §1, §5. Row `dormancy` in `bough-base`.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-rollups = { workspace = true }
bough-plugin-commands = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, features = ["chrono04"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
bough-plugin-ledger-memory = { workspace = true }
