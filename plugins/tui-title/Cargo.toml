[package]
name = "bough-plugin-tui-title"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# A Consumer (§11): the terminal tab's title, kept naming the focused lane. It draws no cell and
# takes no pane — it hears `tui/focus` and writes one OSC 0 sequence out of band, so a wall of
# terminal tabs reads the way the rail does.

[dependencies]
bough-kernel = { workspace = true }
bough-plugin-tui-shell = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
parking_lot = { workspace = true }
