[package]
name = "bough-plugin-tui-panel"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# §11 "The panel": the one tabbed surface over the running composition — config rows with
# per-field layer provenance, connectors (MCP servers + collector jobs), model policy. A
# CONSUMER of `Composition`, never a second formatter of the dump (Decision D9): its raw mode
# prints `bough_kernel::render` verbatim. Toggles write the `ui` patch layer (§0.5); the watch
# applies them — the panel never mutates the live tree directly.

[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-commands = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-llm = { workspace = true }
bough-plugin-model-policy = { workspace = true }
bough-plugin-mcp = { workspace = true }
bough-plugin-schedule = { workspace = true }
bough-plugin-tui-shell = { workspace = true }
bough-plugin-tui-render = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "tests"
path = "tests/main.rs"
