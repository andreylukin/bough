[package]
name = "bough-plugin-tool-leader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The leader-scoped, model-facing tools (§2): `adopt_unsorted`, `draft_requirement`,
# `propose_claim` (the SHADOWING one), `propose_structure`, `note_timeline`. Registered with
# `ToolScope::Agent(leader)`. A separate crate from `leader` for one reason: it injects `leader`
# and so reloads with the binding (P5-D10). Row `tool.leader` in `bough-tui-app`.

[dependencies]
bough-kernel = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-leader = { workspace = true }
bough-plugin-claims = { workspace = true }
bough-plugin-graph-ops = { workspace = true }
bough-plugin-tools = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
bough-plugin-ledger-memory = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-mail-router = { workspace = true }
bough-plugin-projection = { workspace = true }
bough-plugin-projection-assembler = { workspace = true }
tempfile = { workspace = true }
