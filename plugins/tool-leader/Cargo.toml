[package]
name = "bough-plugin-tool-leader"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The leader-scoped, model-facing tools (§2, amended by the claims demolition): `create_lane` and
# `merge_lanes` apply graph ops directly, and `curate` is `adopt_unsorted` + `note_timeline` in
# one journalled pass. Registered with `ToolScope::Agent(leader)`. A separate crate from `leader`
# for one reason: it injects `leader` and so reloads with the binding (P5-D10). Row `tool.leader`
# in `bough-tui-app`.

[dependencies]
bough-kernel = { workspace = true }
bough-plugin-ledger = { workspace = true }
bough-plugin-leader = { workspace = true }
bough-plugin-graph-ops = { workspace = true }
bough-plugin-agents = { workspace = true }
bough-plugin-rollups = { workspace = true }
tracing = { workspace = true }
bough-plugin-tools = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
parking_lot = { workspace = true }
bough-plugin-ledger-memory = { workspace = true }
bough-plugin-mail-router = { workspace = true }
bough-plugin-projection = { workspace = true }
bough-plugin-projection-assembler = { workspace = true }
tempfile = { workspace = true }
# V7: the collapse must hold under the SECOND consumer of the `tools` seam too, so these tests
# run a real program on real QuickJS against the specs this crate registers.
bough-plugin-tools-codemode = { workspace = true }
bough-plugin-js = { workspace = true }
bough-plugin-js-quickjs = { workspace = true }

[[test]]
name = "tests"
path = "tests/main.rs"
