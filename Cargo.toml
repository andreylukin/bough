[workspace]
resolver = "2"
members = [
  "crates/bough-llm",
  "crates/bough-util",
  "crates/bough-kernel",
  "crates/bough",
  "crates/xtask",
  "plugins/*",
  # The ONE bench crate, by name — never `bench/*`: bench/ also holds non-crate adapters
  # (harbor, pier) and whatever scratch a bench run leaves behind (a `tasks/` dir was seen),
  # and a glob member without a Cargo.toml breaks EVERY cargo command in the repo. `plugins/*`
  # stays a glob because a plugin directory is a crate by construction (§13).
  "bench/tools",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/andreylukin/bough"

# REQUIREMENTS.md §13 is the dependency policy. Add here, pin minor versions
# for pre-1.0 crates, and say in a comment which row/seam uses the crate.
[workspace.dependencies]
tokio        = { version = "1.47", features = ["full"] }
tokio-util   = { version = "0.7", features = ["rt"] }
# reqwest: 0.12 for bough-llm's streaming path; rmcp (Phase 6) wants 0.13 and is
# bridged through OAuthHttpClient. The dual-version arrangement STANDS (§13, Phase 0).
reqwest      = { version = "0.12", features = ["json", "stream", "blocking"] }
rusqlite     = { version = "0.37", features = ["bundled"] }          # ledger-sqlite
serde        = { version = "1", features = ["derive", "rc"] }   # "rc": brand_id! newtypes over Arc<str>
serde_json   = "1"
serde_yaml   = "0.9"                                                  # config tree + patch layers (kernel loader)
schemars     = "1"                                                    # plugin Config schemas, seal schemas
jsonschema   = "0.33"                                                 # compiled validators
inventory    = "0.3"                                                  # compile-time plugin catalog
thiserror    = "2"
strsim       = "0.11"                                                 # prompt-files: near-duplicate blocks (already in the graph via clap)
anyhow       = "1"
uuid         = { version = "1", features = ["v4", "v7"] }
chrono       = "0.4"
regex        = "1"
sha2         = "0.10"                                                 # composition fingerprint, idem keys
base64       = "0.22"
futures      = "0.3"
async-trait  = "0.1"
dirs         = "6"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"                                              # P3-D3: the launcher's log file when the TUI owns the terminal
notify       = "8"                                                    # patch-file / skill / ward watch
notify-debouncer-full = "0.5"
ratatui      = "0.30"                                                 # bough-tui-app
crossterm    = { version = "0.29", features = ["event-stream", "osc52", "serde"] } # "serde": tui-attach sends events over the socket
unicode-width = "0.2"
unicode-segmentation = "1"                                            # tui-render: grapheme-aware wrapping
tiktoken-rs  = "0.7"                                                  # o200k_base token estimate (§5, 0.6 headroom)
rquickjs     = { version = "0.12", features = ["futures"] }   # js-quickjs: the embedded engine
backon       = "1"                                                    # llm-retry
libc         = "0.2"
clap         = { version = "4", features = ["derive"] }               # the launcher's CLI
parking_lot  = "0.12"                                                 # kernel binding store / fiber state lock
include_dir  = "0.7"                                                  # profiles/ + bundles/ embedded in the launcher
tempfile     = "3"                                                    # dev-only: provider tests that want a real db file
ratatui-textarea = "0.9"                                              # bough-tui-app: the composer (P3-D1)
similar      = "3"                                                    # tui-render: diff rendering
syntect      = { version = "5", default-features = false, features = ["default-fancy"] }  # tui-render
two-face     = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }  # tui-render
arboard      = "3"                                                    # tui-shell: OS clipboard, best effort
insta        = "1"                                                    # dev-only: TestBackend snapshots, sparingly

bough-llm    = { path = "crates/bough-llm" }
bough-util   = { path = "crates/bough-util" }
bough-kernel = { path = "crates/bough-kernel" }
bough-plugin-hello = { path = "plugins/hello" }
bough-plugin-ledger = { path = "plugins/ledger" }                             # §3 ledger Service Definition
bough-plugin-ledger-sqlite = { path = "plugins/ledger-sqlite" }               # §3 production ledger Provider
bough-plugin-ledger-memory = { path = "plugins/ledger-memory" }               # §3 test ledger Provider
bough-plugin-projection = { path = "plugins/projection" }                     # §5 projection Service Definition
bough-plugin-projection-assembler = { path = "plugins/projection-assembler" } # §5 projection Provider
bough-plugin-projection-probe = { path = "plugins/projection-probe" }         # §17 Phase 1 fixture
bough-plugin-llm = { path = "plugins/llm" }                                   # §12 llm Service Definition
bough-plugin-llm-anthropic = { path = "plugins/llm-anthropic" }               # §12 production llm Provider
bough-plugin-llm-openai = { path = "plugins/llm-openai" }                     # §12 OpenAI llm Provider
bough-plugin-llm-openrouter = { path = "plugins/llm-openrouter" }              # §12 OpenRouter Provider (openrouter:vendor/model)
bough-plugin-llm-replay = { path = "plugins/llm-replay" }                     # §12 recorded-transcript Provider
bough-plugin-llm-retry = { path = "plugins/llm-retry" }                       # §12 agent/request-error Consumer
bough-plugin-request-recorder = { path = "plugins/request-recorder" }         # every request on disk, verbatim (llm/stream listener)
bough-plugin-agents = { path = "plugins/agents" }                             # §2 agents Service Definition
bough-plugin-agent-loop = { path = "plugins/agent-loop" }                     # §5 the wake flow Provider
bough-plugin-agent-loop-scripted = { path = "plugins/agent-loop-scripted" }   # §5 transcript loop Provider (swap gate)
bough-plugin-js = { path = "plugins/js" }                                     # codemode §2.1 js Service Definition
bough-plugin-js-quickjs = { path = "plugins/js-quickjs" }                     # codemode §2.2 embedded QuickJS Provider
bough-plugin-tools-codemode = { path = "plugins/tools-codemode" }             # codemode §2.3 the run(program) Consumer
bough-plugin-tools-operator = { path = "plugins/tools-operator" }             # codemode §2.4 view/patch/write/bg/ledger_read/inbox/schedule
bough-plugin-tools = { path = "plugins/tools" }                               # §9 tools Service Definition
bough-plugin-tools-baseline = { path = "plugins/tools-baseline" }             # §9 the six baseline tools
bough-plugin-workers = { path = "plugins/workers" }                           # §10 workers Service Definition
bough-plugin-worker-spawn = { path = "plugins/worker-spawn" }                 # §10 spawn Provider
bough-plugin-tool-workers = { path = "plugins/tool-workers" }                 # §10 tool-spawn_worker + tool-ask
bough-plugin-actions = { path = "plugins/actions" }                           # §7 actions Service Definition
bough-plugin-tool-actions = { path = "plugins/tool-actions" }                 # §7 the four primitives as tools
bough-plugin-model-policy = { path = "plugins/model-policy" }                 # §12 sol/terra prepend listener
bough-plugin-about-line = { path = "plugins/about-line" }                     # §2 the two-half about-line
bough-plugin-exec-headless = { path = "plugins/exec-headless" }               # §17 Phase 2 `bough exec`
bough-plugin-commands = { path = "plugins/commands" }                          # §11 commands Service Definition
bough-plugin-tui-shell = { path = "plugins/tui-shell" }                        # §11 tui Provider
bough-plugin-tui-render = { path = "plugins/tui-render" }                      # §11 render library (no row)
bough-plugin-tui-strip = { path = "plugins/tui-strip" }                        # §11 the agent rail pane
bough-plugin-tui-focus = { path = "plugins/tui-focus" }                        # §11 the focused trajectory pane
bough-plugin-tui-status = { path = "plugins/tui-status" }                      # §11 the status line (phase ux1)
bough-plugin-tui-search = { path = "plugins/tui-search" }                      # §11 FTS pane (swap subject)
bough-plugin-tui-attach = { path = "plugins/tui-attach" }                      # §11 the resident's attach listener
bough-plugin-prompt-files = { path = "plugins/prompt-files" }                  # §5 workspace prompt files, deduped, as a contributed section
bough-plugin-residents = { path = "plugins/residents" }                        # §5 catch-up at launch
bough-plugin-old-feed-adapter = { path = "plugins/old-feed-adapter" }          # §14 throwaway bridge
bough-plugin-tui-probe = { path = "plugins/tui-probe" }                        # §17 Phase 3 fixture
bough-plugin-rollups = { path = "plugins/rollups" }                            # §8 rollups Service Definition
bough-plugin-rollups-summarizer = { path = "plugins/rollups-summarizer" }      # §8 the recap Provider
bough-plugin-rollups-none = { path = "plugins/rollups-none" }                  # §8 stub Provider (swap subject)
bough-plugin-reconsolidation = { path = "plugins/reconsolidation" }            # §8 batched distillation
bough-plugin-drift-watch = { path = "plugins/drift-watch" }                    # §8 stability signals + /reset
bough-plugin-mail-router = { path = "plugins/mail-router" }                    # §3, §5 mail fan-out + unsorted queue
bough-plugin-dormancy = { path = "plugins/dormancy" }                          # §1 dormancy + the wake-admission listener
bough-plugin-graph-ops = { path = "plugins/graph-ops" }                        # §4 split / merge / bud / fork / undo
bough-plugin-pins = { path = "plugins/pins" }                                 # §3 /pin and /unpin, the pin stream's writers
bough-plugin-leader = { path = "plugins/leader" }                              # §2 the leader plugin set
bough-plugin-tool-leader = { path = "plugins/tool-leader" }                    # §2 the leader-scoped tools
bough-plugin-lane-scope = { path = "plugins/lane-scope" }                      # §5 per-lane persona + tools.restrict
bough-plugin-worker-fork = { path = "plugins/worker-fork" }                    # §10 WorkerKind::Fork

# ---- Phase 6 (track B): context, the write boundary, the runtime-code hosts ----
# REQUIREMENTS §13 is the dependency policy: pinned to a minor, with the row/seam that uses it.
rhai         = { version = "1.26", features = ["sync", "no_closure"] }   # wards-rhai: the PURE ward host
tokio-cron-scheduler = "0.15"                                            # schedule-cron: the schedule Provider
cron         = "0.15"                                                    # schedule: Cadence::next_after (pure)
# rmcp 3.x wants reqwest 0.13 and bough-llm holds 0.12; the dual-version arrangement STANDS and is
# bridged through OAuthHttpClient (Phase 0, §13). Wired by WP-5.
rmcp         = { version = "3.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
http         = "1.3"                                                     # mcp-rmcp: the HeaderName/HeaderValue rmcp's HTTP transport config takes

bough-plugin-schedule = { path = "plugins/schedule" }                         # §9 schedule Service Definition
bough-plugin-schedule-cron = { path = "plugins/schedule-cron" }               # §9 tokio-cron-scheduler Provider
bough-plugin-schedule-manual = { path = "plugins/schedule-manual" }           # §9 test Provider (swap subject)
bough-plugin-system-schedules = { path = "plugins/system-schedules" }         # §5/§8 the two system passes
bough-plugin-collect-core = { path = "plugins/collect-core" }                 # §6 collector library (no row)
bough-plugin-gh-cli = { path = "plugins/gh-cli" }                             # §13 the ONE place that spawns `gh`
bough-plugin-collector-github = { path = "plugins/collector-github" }         # §6 GitHub sweeps
bough-plugin-collector-linear = { path = "plugins/collector-linear" }         # §6 Linear sweeps
bough-plugin-collector-slack = { path = "plugins/collector-slack" }           # §6 Slack sweeps over mcp
bough-plugin-actions-github = { path = "plugins/actions-github" }             # §7 open_pr/push_to_pr/bot_thread_op
bough-plugin-actions-linear = { path = "plugins/actions-linear" }             # §7 linear_write
bough-plugin-actions-reconcile = { path = "plugins/actions-reconcile" }       # §7 intent-without-done reconciliation
bough-plugin-boundary-instructions = { path = "plugins/boundary-instructions" } # §7/§10 the ONE boundary block
bough-plugin-drafts = { path = "plugins/drafts" }                             # §7 drafts Definition + the two tools
bough-plugin-tui-drafts = { path = "plugins/tui-drafts" }                     # §11 the drafts pane
bough-plugin-mcp = { path = "plugins/mcp" }                                   # §6 mcp Service Definition
bough-plugin-mcp-rmcp = { path = "plugins/mcp-rmcp" }                         # §6 rmcp Provider
bough-plugin-tool-mcp = { path = "plugins/tool-mcp" }                         # §9 discovered tools + /mcp
bough-plugin-runtime-actions = { path = "plugins/runtime-actions" }           # §9 runtime-code action vocabulary
bough-plugin-wards-rhai = { path = "plugins/wards-rhai" }                     # §9 the ward host
bough-plugin-hooks-exec = { path = "plugins/hooks-exec" }                     # §9 the hook-executable host
bough-plugin-mcp-subprocess = { path = "plugins/mcp-subprocess" }             # §9 resident subprocess plugins
bough-plugin-skills = { path = "plugins/skills" }                             # §9 the skills host
bough-plugin-power = { path = "plugins/power" }                               # §13 power Service Definition
bough-plugin-sleep-listener = { path = "plugins/sleep-listener" }             # §13 macOS IOKit Provider
bough-plugin-power-test = { path = "plugins/power-test" }                     # §13 synthetic sleep/wake Provider
bough-plugin-catch-up-on-wake = { path = "plugins/catch-up-on-wake" }         # §13 one catch-up wake per agent


# ---- Phase c (track C): the digging panes, the audit's fault sites, the actions shim ----
bough-plugin-tui-preview = { path = "plugins/tui-preview" }                    # §11 the byte-exact projection preview pane
bough-plugin-tui-panel = { path = "plugins/tui-panel" }                        # §11 the tabbed panel over the running composition
bough-plugin-tui-timeline = { path = "plugins/tui-timeline" }                  # §11 the cross-agent timeline pane
bough-plugin-tui-drift = { path = "plugins/tui-drift" }                        # §8 the drift dashboard pane
bough-plugin-fault-inject = { path = "plugins/fault-inject" }                  # §17 Phase 8 failure injection (catalog only)
bough-plugin-actions-shim = { path = "plugins/actions-shim" }                  # §7 the gh-shaped actions Provider (catalog only)

# Build speed (2026-08-27). `debug = "line-tables-only"` keeps file:line in backtraces and drops
# the full DWARF that made every one of the ~50 test binaries link slowly and target/debug run to
# 100+ GB, and cuts the release link the TUI suite waits on the same way.
[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
