[workspace]
resolver = "2"
members = [
  "crates/bough-llm",
  "crates/bough-util",
  "crates/bough-kernel",
  "crates/bough",
  "plugins/*",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/andreylukin/bough"

# REQUIREMENTS.md §13 is the dependency policy. Add here, pin minor versions
# for pre-1.0 crates, and say in a comment which row/seam uses the crate.
[workspace.dependencies]
tokio        = { version = "1.47", features = ["full"] }
tokio-util   = { version = "0.7", features = ["rt"] }
# reqwest: 0.12 for bough-llm's streaming path; rmcp (Phase 6) wants 0.13 and is
# bridged through OAuthHttpClient. The dual-version arrangement STANDS (§13, Phase 0).
reqwest      = { version = "0.12", features = ["json", "stream", "blocking"] }
rusqlite     = { version = "0.37", features = ["bundled"] }          # ledger-sqlite
serde        = { version = "1", features = ["derive", "rc"] }   # "rc": brand_id! newtypes over Arc<str>
serde_json   = "1"
serde_yaml   = "0.9"                                                  # config tree + patch layers (kernel loader)
schemars     = "1"                                                    # plugin Config schemas, seal schemas
jsonschema   = "0.33"                                                 # compiled validators
inventory    = "0.3"                                                  # compile-time plugin catalog
thiserror    = "2"
anyhow       = "1"
uuid         = { version = "1", features = ["v4", "v7"] }
chrono       = "0.4"
regex        = "1"
sha2         = "0.10"                                                 # composition fingerprint, idem keys
base64       = "0.22"
futures      = "0.3"
async-trait  = "0.1"
dirs         = "6"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify       = "8"                                                    # patch-file / skill / ward watch
notify-debouncer-full = "0.5"
ratatui      = "0.30"                                                 # bough-tui-app
crossterm    = { version = "0.29", features = ["event-stream", "osc52"] }
unicode-width = "0.2"
tiktoken-rs  = "0.7"                                                  # o200k_base token estimate (§5, 0.6 headroom)
backon       = "1"                                                    # llm-retry
libc         = "0.2"
clap         = { version = "4", features = ["derive"] }               # the launcher's CLI
parking_lot  = "0.12"                                                 # kernel binding store / fiber state lock
include_dir  = "0.7"                                                  # profiles/ + bundles/ embedded in the launcher
tempfile     = "3"                                                    # dev-only: provider tests that want a real db file
ratatui-textarea = "0.9"                                              # bough-tui-app: the composer (P3-D1)
similar      = "3"                                                    # tui-render: diff rendering
syntect      = { version = "5", default-features = false, features = ["default-fancy"] }  # tui-render
two-face     = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }  # tui-render
arboard      = "3"                                                    # tui-shell: OS clipboard, best effort
insta        = "1"                                                    # dev-only: TestBackend snapshots, sparingly

bough-llm    = { path = "crates/bough-llm" }
bough-util   = { path = "crates/bough-util" }
bough-kernel = { path = "crates/bough-kernel" }
bough-plugin-hello = { path = "plugins/hello" }
bough-plugin-ledger = { path = "plugins/ledger" }                             # §3 ledger Service Definition
bough-plugin-ledger-sqlite = { path = "plugins/ledger-sqlite" }               # §3 production ledger Provider
bough-plugin-ledger-memory = { path = "plugins/ledger-memory" }               # §3 test ledger Provider
bough-plugin-projection = { path = "plugins/projection" }                     # §5 projection Service Definition
bough-plugin-projection-assembler = { path = "plugins/projection-assembler" } # §5 projection Provider
bough-plugin-projection-probe = { path = "plugins/projection-probe" }         # §17 Phase 1 fixture
bough-plugin-llm = { path = "plugins/llm" }                                   # §12 llm Service Definition
bough-plugin-llm-anthropic = { path = "plugins/llm-anthropic" }               # §12 production llm Provider
bough-plugin-llm-replay = { path = "plugins/llm-replay" }                     # §12 recorded-transcript Provider
bough-plugin-llm-retry = { path = "plugins/llm-retry" }                       # §12 agent/request-error Consumer
bough-plugin-agents = { path = "plugins/agents" }                             # §2 agents Service Definition
bough-plugin-agent-loop = { path = "plugins/agent-loop" }                     # §5 the wake flow Provider
bough-plugin-agent-loop-scripted = { path = "plugins/agent-loop-scripted" }   # §5 transcript loop Provider (swap gate)
bough-plugin-tools = { path = "plugins/tools" }                               # §9 tools Service Definition
bough-plugin-tools-baseline = { path = "plugins/tools-baseline" }             # §9 the six baseline tools
bough-plugin-workers = { path = "plugins/workers" }                           # §10 workers Service Definition
bough-plugin-worker-spawn = { path = "plugins/worker-spawn" }                 # §10 spawn Provider
bough-plugin-tool-workers = { path = "plugins/tool-workers" }                 # §10 tool-spawn_worker + tool-ask
bough-plugin-actions = { path = "plugins/actions" }                           # §7 actions Service Definition
bough-plugin-tool-actions = { path = "plugins/tool-actions" }                 # §7 the four primitives as tools
bough-plugin-model-policy = { path = "plugins/model-policy" }                 # §12 sol/terra prepend listener
bough-plugin-about-line = { path = "plugins/about-line" }                     # §2 the two-half about-line
bough-plugin-exec-headless = { path = "plugins/exec-headless" }               # §17 Phase 2 `bough exec`
bough-plugin-commands = { path = "plugins/commands" }                          # §11 commands Service Definition
bough-plugin-tui-shell = { path = "plugins/tui-shell" }                        # §11 tui Provider
bough-plugin-tui-render = { path = "plugins/tui-render" }                      # §11 render library (no row)
bough-plugin-tui-strip = { path = "plugins/tui-strip" }                        # §11 the agent rail pane
bough-plugin-tui-focus = { path = "plugins/tui-focus" }                        # §11 the focused trajectory pane
bough-plugin-tui-search = { path = "plugins/tui-search" }                      # §11 FTS pane (swap subject)
bough-plugin-residents = { path = "plugins/residents" }                        # §5 catch-up at launch
bough-plugin-old-feed-adapter = { path = "plugins/old-feed-adapter" }          # §14 throwaway bridge
bough-plugin-tui-probe = { path = "plugins/tui-probe" }                        # §17 Phase 3 fixture
