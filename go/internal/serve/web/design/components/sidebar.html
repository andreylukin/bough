<!-- @dsCard group="Navigation" name="Sidebar" subtitle="Brand, view switcher, search, grouped session rows, footer" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../bough.css">
<style>
body{display:flex}
.sidebar{height:640px}
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 21V9"/><path d="M12 9c0-3 2-5 5-5 0 3-2 5-5 5z"/><path d="M12 13c0-2.5-1.8-4.5-4.5-4.5 0 2.5 2 4.5 4.5 4.5z"/></svg>
    <span>bough</span>
  </div>
  <nav class="nav" aria-label="Views">
    <button class="nav-item nav-on" aria-current="page">Conversations</button>
    <button class="nav-item">Projects</button>
  </nav>
  <div style="padding:0 20px 18px">
    <label for="q" class="field-label">Search sessions</label>
    <input id="q" class="field" placeholder="Title, repo or branch">
  </div>
  <div class="scroll" style="display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;flex-direction:column;gap:2px">
      <div class="group-head">Today</div>
      <button class="row row-on" aria-current="true">
        <span class="row-line"><span class="row-title">Fix the flaky PTY test</span><span class="num">14:02</span></span>
        <span class="row-meta">
          <span class="status" style="display:inline-flex;align-items:center;gap:7px;color:var(--text-2)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" stroke-dasharray="40 14"/></svg><span style="font-size:12px">Running</span></span>
          <span class="mono">bough<span style="color:var(--line-strong)">/</span>main</span>
        </span>
      </button>
      <button class="row">
        <span class="row-line"><span class="row-title">Which migration order is safe?</span><span class="num">11:40</span></span>
        <span class="row-meta">
          <span class="status" style="display:inline-flex;align-items:center;gap:7px;color:var(--amber)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5l3 2"/></svg><span style="font-size:12px">Waiting for you</span></span>
          <span class="mono">api<span style="color:var(--line-strong)">/</span>db-split</span>
        </span>
      </button>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <div class="group-head">Yesterday</div>
      <button class="row">
        <span class="row-line"><span class="row-title">Wiki compile from history</span><span class="num">18:15</span></span>
        <span class="row-meta">
          <span class="status" style="display:inline-flex;align-items:center;gap:7px;color:var(--text-3)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg><span style="font-size:12px">Done</span></span>
        </span>
      </button>
      <button class="row">
        <span class="row-line"><span class="row-title">Headless SIGPIPE on closed stdout</span><span class="num">09:03</span></span>
        <span class="row-meta">
          <span class="status" style="display:inline-flex;align-items:center;gap:7px;color:var(--red)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5L21 19H3z"/><path d="M12 10v4"/><path d="M12 16.5h.01"/></svg><span style="font-size:12px">Failed</span></span>
          <span class="mono">bough<span style="color:var(--line-strong)">/</span>headless-pipe</span>
        </span>
      </button>
    </div>
  </div>
  <div class="sidebar-foot"><button class="link">Show archived</button></div>
</div>
</body>
</html>
