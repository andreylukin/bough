<!-- @dsCard group="Status" name="Status marks" subtitle="Seven states; glyph plus word, colour only where it means something" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../bough.css">
<style>
.demo{padding:24px 28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 32px;max-width:520px}
.mark{display:inline-flex;align-items:center;gap:7px}
.mark svg{width:13px;height:13px}
.mark span{font-size:12px}
.k{font-size:12px;color:var(--text-3);margin-left:auto}
.cell{display:flex;align-items:center;gap:12px}
</style>
</head>
<body>
<div class="demo">
  <div class="cell"><span class="mark" style="color:var(--amber)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5l3 2"/></svg><span>Waiting for you</span></span><span class="k mono">needs-you</span></div>
  <div class="cell"><span class="mark" style="color:var(--text-2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" stroke-dasharray="40 14"/></svg><span>Running</span></span><span class="k mono">running</span></div>
  <div class="cell"><span class="mark" style="color:var(--text-3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg><span>Done</span></span><span class="k mono">done</span></div>
  <div class="cell"><span class="mark" style="color:var(--text-3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg><span>Stopped</span></span><span class="k mono">stopped</span></div>
  <div class="cell"><span class="mark" style="color:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5L21 19H3z"/><path d="M12 10v4"/><path d="M12 16.5h.01"/></svg><span>Failed</span></span><span class="k mono">error</span></div>
  <div class="cell"><span class="mark" style="color:var(--text-2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5L21 19H3z"/><path d="M12 10v4"/><path d="M12 16.5h.01"/></svg><span>Interrupted</span></span><span class="k mono">interrupted</span></div>
  <div class="cell"><span class="mark" style="color:var(--text-3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/></svg><span>Idle</span></span><span class="k mono">idle</span></div>
</div>
</body>
</html>
