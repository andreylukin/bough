<!-- @dsCard group="Forms" name="Fields and selects" subtitle="Search field, labelled selects, the composer textarea" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../bough.css">
<style>
.demo{padding:24px 28px;display:flex;flex-direction:column;gap:24px;max-width:560px}
</style>
</head>
<body>
<div class="demo">
  <div style="width:264px">
    <label for="q" class="field-label">Search sessions</label>
    <input id="q" class="field" placeholder="Title, repo or branch">
  </div>
  <div class="controls">
    <label class="ctl"><span class="ctl-label">Model</span>
      <select><option>claude-sonnet-5 — 200k</option><option>as configured</option></select></label>
    <label class="ctl"><span class="ctl-label">Project</span>
      <select><option>Unassigned</option><option>Incident 42</option></select></label>
    <label class="ctl"><span class="ctl-label">Thinking</span>
      <select><option>default</option><option>low</option><option>high</option></select></label>
  </div>
  <label class="proj-move"><span class="visually-hidden">Move to project</span>
    <select><option>Unassigned</option><option>Incident 42</option></select></label>
</div>
</body>
</html>
