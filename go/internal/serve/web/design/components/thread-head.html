<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../bough.css">
<style>
.mark{display:inline-flex;align-items:center;gap:7px}
.mark svg{width:13px;height:13px}
.mark span{font-size:12px}
</style>
</head>
<body>
<header class="thread-head">
  <div class="head-main">
    <h1>Fix the flaky PTY test</h1>
    <span class="mono head-repo">bough<span style="color:var(--line-strong)">/</span>main</span>
    <span class="mark" style="color:var(--text-2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" stroke-dasharray="40 14"/></svg><span>Running</span></span>
  </div>
  <div class="head-side">
    <div class="controls">
      <label class="ctl"><span class="ctl-label">Model</span><select><option>claude-sonnet-5 — 200k</option></select></label>
      <label class="ctl"><span class="ctl-label">Project</span><select><option>Unassigned</option></select></label>
      <label class="ctl"><span class="ctl-label">Thinking</span><select><option>default</option></select></label>
    </div>
    <button class="btn">Rename</button>
    <button class="btn">Archive</button>
  </div>
</header>
</body>
</html>
