<!-- @dsCard group="Feedback" name="Ask, error, toast" subtitle="The live question card, an error line, the fixed toast" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../bough.css">
<style>
.demo{padding:24px 28px;display:flex;flex-direction:column;gap:24px;min-height:320px}
.mark{display:inline-flex;align-items:center;gap:7px}
.mark svg{width:16px;height:16px}
.mark span{font-size:12px}
</style>
</head>
<body>
<div class="demo">
  <div class="ask">
    <span class="mark" style="color:var(--amber)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5l3 2"/></svg><span>Waiting for you</span></span>
    <p class="ask-q">The migration touches two tables. Run it against staging first?</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary">Yes, staging first</button>
      <button class="btn btn-primary">No, straight to prod</button>
    </div>
  </div>
  <div class="err">provider: 429 rate limited, retrying in 8s</div>
</div>
<div class="toast" role="status">GET /api/sessions: 502 Bad Gateway</div>
</body>
</html>
