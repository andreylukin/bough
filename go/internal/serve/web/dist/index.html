<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bough Control Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2382cb9b' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M12 21V9'/%3E%3Cpath d='M12 9c0-3 2-5 5-5 0 3-2 5-5 5z'/%3E%3Cpath d='M12 13c0-2.5-1.8-4.5-4.5-4.5 0 2.5 2 4.5 4.5 4.5z'/%3E%3C/svg%3E">
<style>
/* Tokens, all measured: the tightest text pair is text-3 on sel at
   5.08:1 against a 4.5:1 floor. line is decorative (1.61:1, deliberately
   faint); line-strong defines controls and clears 3:1 everywhere.
   One hue one meaning — accent is interactive, amber is "waiting for
   you", red is "failed"; resting states carry no colour. Dark by
   commitment, so every colour is painted, never inherited. */
:root {
  --bg:#0f1310; --surface:#191d1a; --raised:#222723; --sel:#242b25;
  --line:#343a35; --line-strong:#646b65;
  --text-1:#e3eae4; --text-2:#b1b8b2; --text-3:#939b94;
  --accent:#82cb9b; --amber:#eabc6e; --red:#ed756e;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--text-1);font:15px/1.5 var(--sans);
     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
::selection{background:color-mix(in srgb,var(--accent) 30%,var(--surface));color:var(--text-1)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:flex;height:100%;overflow:hidden}
.app>*{min-height:0}
.scroll{overflow-y:auto;min-height:0}

/* sidebar: workspace › session › turns, like a file tree with the status at the left */
.sidebar{width:304px;flex-shrink:0;border-right:1px solid var(--line);background:var(--surface);
         display:flex;flex-direction:column}
.sidebar .scroll{flex:1 1 0%;min-height:0;padding:2px 8px 16px;position:relative;display:flex;flex-direction:column;gap:4px}
.list-none{padding:0 12px;color:var(--text-3);font-size:13px}
.row-untitled{color:var(--text-3);font-size:13px}
.session{position:relative}
/* The log's disclosure sits at the row's end: a sibling of the row, shown on hover, focus, or once open. */
.row-twist{position:absolute;right:6px;top:4px;z-index:2;width:24px;height:24px;padding:0;display:grid;place-items:center;
  background:none;border:0;border-radius:6px;color:var(--text-3);cursor:pointer;opacity:0}
.row-twist svg{transition:transform .12s}
.row-twist[aria-expanded="true"] svg{transform:rotate(90deg)}
.row-wrap:hover>.row-twist,.row-wrap:focus-within>.row-twist,.row-twist[aria-expanded="true"]{opacity:1}
.row-twist:hover{background:var(--line);color:var(--text-1)}
@media (hover:none){.row-twist{opacity:1}}
/* The log hangs off the status column on a rule, so turns never line up with titles. */
.turns{list-style:none;margin:0 0 6px 17px;padding:0 0 0 8px;border-left:1px solid #3c483f;max-height:168px;overflow-y:auto}
.turn-line{display:flex;align-items:center;gap:6px;width:100%;height:28px;padding:0 8px 0 4px;background:none;border:0;
  border-radius:6px;font:12px/18px var(--sans);color:var(--text-3);text-align:start;cursor:pointer}
.turn-line:hover{background:var(--raised);color:var(--text-1)}
.turn-line:focus-visible{outline-offset:-2px}
.turn-n{flex-shrink:0;width:16px;text-align:end;color:var(--text-3);font-size:12px}
.turn-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turn-wait{padding-inline-start:26px;font-size:12px;line-height:28px;color:var(--text-3)}
@media (max-width:720px),(pointer:coarse){.turn-line{height:44px}.row-twist{top:6px;width:32px;height:32px}}
@media (prefers-reduced-motion:reduce){.row-twist svg,.sec-fold svg{transition:none}}
/* A turn you jumped to says where it is, then lets go. */
.turn{scroll-margin-top:12px}
.turn-flash{animation:turn-flash 1.6s ease-out}
@keyframes turn-flash{from{background:color-mix(in srgb,var(--accent) 16%,transparent)}to{background:transparent}}
/* .visually-hidden is absolute: without a positioned ancestor each one sat at its
   place deep in the transcript and stretched the document past the viewport. */
.transcript{position:relative}
.turn-sending .prompt-text{opacity:.75}
.turn-sending-state{font-size:12px;line-height:16px;color:#A8B3AA}
.transcript-state{margin:auto 0;text-align:center}
/* The toolbar: sidebar, back, forward, search, and New set apart on the right. */
.side-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 10px}
.side-icon{display:grid;place-items:center;width:32px;height:32px;padding:0;background:none;border:0;border-radius:8px;
  color:var(--text-3);cursor:pointer}
.side-icon:hover,.side-icon-on{color:var(--text-1);background:var(--raised)}
.side-new{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--raised);color:var(--text-1);cursor:pointer}
.side-new:hover{border-color:var(--accent)}
.side-new:focus-visible,.ws-head:focus-visible,.sec-fold:focus-visible,.turn-line:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sidebar-closed{width:54px}
.sidebar-closed .side-collapse{margin:0}
.session-search{flex-shrink:0;padding:0 12px 8px}
.field-label{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font-size:12px;font-weight:500;color:var(--text-3);margin-bottom:6px}
.field{width:100%;font:13px var(--sans);color:var(--text-1);background:var(--raised);
       border:1px solid var(--line-strong);border-radius:7px;padding:8px 11px}
.field::placeholder{color:var(--text-3)}
/* A workspace, and the sections below: a muted name and a thin rule filling the row. */
.ws{display:flex;flex-direction:column}
.ws-head,.sec-fold{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;color:var(--text-3);font:13px var(--sans)}
.ws-head{width:100%;height:26px;gap:6px;background:none;border:0;border-radius:8px;cursor:pointer;text-align:start;font:600 12px/16px var(--sans)}
.ws-head:hover{color:var(--text-1)}
.ws-head svg{flex-shrink:0}
.ws-head svg:first-child{transition:transform .12s}
.ws-head[aria-expanded="true"] svg:first-child{transform:rotate(90deg)}
.ws-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.ws-rule{flex:1 1 auto;min-width:16px;height:1px;background:var(--line)}
.sec-fold{width:100%;height:30px;margin-top:8px;background:none;border:0;border-radius:8px;cursor:pointer;text-align:start}
.sec-fold svg{flex-shrink:0;transition:transform .12s}
.sec-fold[aria-expanded="true"] svg{transform:rotate(90deg)}
.sec-fold:hover{color:var(--text-1)}
.sec-fold[aria-expanded="true"]{color:var(--text-2)}
.sec-count{color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
.sec-count-trouble{color:var(--red)}
.sec-count-needs-you{color:var(--amber)}
.sec{margin-top:2px}
@media (max-width:720px),(pointer:coarse){.sec-fold,.ws-head{height:44px}.side-icon,.side-new{width:44px;height:44px}}
/* A session: its status mark, its title, and a trailing count only when there is one. */
.row{display:flex;align-items:center;gap:10px;width:100%;height:32px;text-align:start;padding:0 10px;
     background:none;border:0;border-radius:8px;color:inherit;font:inherit;cursor:pointer}
.row-has-log{padding-inline-end:34px}
.row-mark{display:grid;place-items:center;width:16px;flex-shrink:0}
/* After the base row, so the touch height is not overwritten by it. */
@media (max-width:720px),(pointer:coarse){.row{height:44px}}
/* Status and age on the title's line, only where there is no hover card. */
.row-meta{display:none;flex-shrink:0;margin-inline-start:auto;font-size:12px;line-height:16px;color:#b1b8b2;white-space:nowrap}
.row-meta-ask{color:#eabc6e}
.row-meta-bad{color:#ed756e}
@media (hover:none),(max-width:720px){.row-meta{display:inline}.row-jobs+.row-meta{margin-inline-start:0}}
/* A desktop row says why only when it is failing, waiting or running; done rows stay bare. */
.row-meta-live{display:inline}.row-jobs+.row-meta-live{margin-inline-start:0}
.row-id{flex-shrink:0;font-size:12px;color:var(--text-3)}
.turn-note{color:var(--text-3)}
.side-fresh{display:flex;align-items:center;gap:8px;height:28px;margin:0;padding:0 12px;font-size:12px;color:var(--text-3)}
/* Hover, selected and focus each look different: a tint, a tint with a marker, a ring. */
.row:hover{background:#232a25}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row-on,.row-on:hover{background:#2d3a31;box-shadow:inset 2px 0 0 var(--accent)}
.turn-more{color:var(--text-3)}
.turn-result{flex-shrink:0;font:600 12px/16px var(--sans);color:var(--text-1)}
.turn-result-bad{color:var(--red)}
.ov-point{font:500 12px/16px var(--sans)}
.turn-more svg{flex-shrink:0}
.row-why{padding:0 10px 4px 36px;font-size:12px;line-height:16px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark.hit{background:#354b3b;color:#d7e9dc;border-radius:2px}
.row-title{font-size:15px;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row-wrap:hover>.row-has-ack .row-jobs,.row-wrap:focus-within>.row-has-ack .row-jobs{visibility:hidden}
.head-ack{height:26px;padding:0 10px;font-size:12px;flex-shrink:0}
.link{background:none;border:0;padding:0;color:var(--text-3);font:12px var(--sans);cursor:pointer}
.link:hover{color:var(--text-1)}

/* thread chrome */
.thread{flex-grow:1;display:flex;flex-direction:column;min-width:0;position:relative}
.thread.empty{align-items:center;justify-content:center;text-align:center;color:var(--text-3)}
.thread.empty h1{font-size:20px;font-weight:600;color:var(--text-2);margin:0 0 8px}
.thread.empty p{margin:0 auto 16px;max-width:46ch}
/* One fixed height on every session: title, status and the run setting on
   row 1, the budget on row 2 starting at the same x each time. */
.thread-head{flex-shrink:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;
             grid-template-rows:32px 24px;grid-template-areas:"back main side" "strip strip strip";
             align-items:center;gap:4px 16px;padding:6px 24px;border-bottom:1px solid var(--line)}
.thread-head>.back{grid-area:back}
.thread-head>.head-main{grid-area:main}
.thread-head>.head-side{grid-area:side}
.thread-head>.runtime-strip{grid-area:strip;display:flex;flex-wrap:nowrap;min-width:0}
.thread-head .status{font:500 12px/16px var(--sans)}
.head-trouble{display:inline-flex;align-items:center;gap:7px}
/* A failing check next to a finished agent: the mark carries the red, the Tests chip the words. */
.head-check{color:var(--text-2)}
.head-main{display:flex;align-items:center;gap:14px;min-width:0}
.status{white-space:nowrap;flex-shrink:0}
.head-main h1{min-width:0}
.back{display:none;align-self:center;flex-shrink:0;width:32px;height:32px;margin-inline-start:-8px;
      align-items:center;justify-content:center;background:none;border:0;border-radius:6px;
      color:var(--text-2);cursor:pointer}
.back:hover{background:var(--raised);color:var(--text-1)}
.head-main h1{margin:0;font-size:16px;font-weight:600;line-height:22px;letter-spacing:-.01em;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44ch}
.head-repo{font-size:13px;color:var(--text-3);white-space:nowrap}
.head-side{display:flex;align-items:center;gap:8px;min-width:0}
.head-actions{display:flex;gap:12px}
/* Model stays in the header because it changes mid-session; project,
   rename and archive are rarer and wait in a popover under More. */
.head-more{position:relative;display:flex}
.head-pop{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:40;width:280px;padding:4px;
          display:flex;flex-direction:column;background:var(--raised);border:1px solid var(--line-strong);border-radius:10px;
          box-shadow:0 1px 2px rgb(0 0 0/.4),0 12px 32px rgb(0 0 0/.45)}
.head-pop .controls{padding:4px 6px}
.thread-head .head-pop .sel-btn{background:var(--surface);border-color:var(--line-strong)}
.head-pop .ctl{width:100%;justify-content:space-between}
.head-pop-item{display:flex;align-items:center;height:36px;padding:0 10px;text-align:start;font:13px var(--sans);
               color:var(--text-2);background:none;border:0;border-radius:6px;cursor:pointer}
.head-pop .ctl-label{padding-inline-start:4px}
.head-pop{overflow-y:auto}
.head-pop-item:hover{background:var(--sel);color:var(--text-1)}
/* Model, effort, cache and Context move into settings only on a phone. */
.head-clock{font-size:12px;color:var(--text-2)}
.sel-save{font-size:12px;color:var(--text-3);white-space:nowrap;margin-inline-start:6px}
.sel-save-failed{background:none;border:0;padding:0;color:var(--red);cursor:pointer}
@media (max-width:720px),(pointer:coarse){.head-pop-item{height:44px}}
.more{display:inline-flex;flex-shrink:0;width:32px;height:32px;align-items:center;justify-content:center;
      background:none;border:1px solid var(--line-strong);border-radius:6px;color:var(--text-2);cursor:pointer}
.more:hover{color:var(--text-1)}
.more[aria-expanded="true"]{background:var(--sel);color:var(--text-1)}

/* model + thinking selectors */
.controls{display:flex;gap:10px}
.ctl{display:flex;align-items:center;gap:7px}
.ctl-label{font-size:12px;color:var(--text-3)}
.ctl .sel{max-width:28ch}

/* Dropdowns. Never the OS menu: the @ picker's popover, anchored under
   a button that reads as a field, the current value checked. */
.sel{position:relative;display:inline-flex;min-width:0}
.sel-btn{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%;height:32px;
         padding:0 8px 0 10px;font:13px var(--sans);color:var(--text-2);background:var(--raised);
         border:1px solid var(--line-strong);border-radius:6px;cursor:pointer}
.sel-btn:hover,.sel-open .sel-btn{color:var(--text-1)}
.sel-open .sel-btn{border-color:var(--accent)}
.sel-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-placeholder{color:var(--text-3)}
.sel-chevron{flex-shrink:0;color:var(--text-3);transition:transform 120ms}
.sel-open .sel-chevron{transform:rotate(180deg)}
.sel-pop{position:absolute;top:calc(100% + 6px);z-index:40;min-width:max(100%,220px);width:max-content;
         max-width:min(380px,calc(100vw - 32px));display:flex;flex-direction:column;overflow:hidden;
         background:var(--raised);border:1px solid var(--line-strong);border-radius:10px;
         box-shadow:0 1px 2px rgb(0 0 0/.4),0 10px 28px rgb(0 0 0/.45)}
/* A searchable list keeps one width while it filters, instead of
   shrinking to whatever matches. */
.sel-pop:has(.sel-search){width:min(360px,calc(100vw - 32px))}
.sel-start{inset-inline-start:0}
.sel-end{inset-inline-end:0}
.sel-search{flex:none;height:40px;font:13px var(--sans);color:var(--text-1);background:var(--surface);border:none;
            border-bottom:1px solid var(--line);padding:10px 12px;width:100%}
.sel-search::placeholder{color:var(--text-3)}
.sel-search:focus{outline:none}
.sel-search:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sel-list{flex:1 1 auto;min-height:0;max-height:min(320px,50vh);overflow-y:auto;padding:4px}
@media (max-width:600px){.sel-pop,.sel-pop:has(.sel-search){width:calc(100vw - 16px);max-width:none}}
.sel-group{padding:8px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--text-3)}
.sel-item{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 10px;text-align:start;
          font:13px var(--sans);color:var(--text-2);background:none;border:0;border-radius:6px;cursor:pointer}
.sel-on{background:var(--sel);color:var(--text-1);box-shadow:inset 2px 0 0 var(--accent)}
/* The header's controls are a toolbar, not a form: quiet at rest. */
@media (min-width:721px){
  .head-side .sel-btn,.head-side .btn{background:transparent;border-color:transparent}
  .head-side .sel-btn:hover,.head-side .btn:hover,.head-side .sel-open .sel-btn{background:var(--raised);border-color:var(--line-strong)}
}
/* A long prompt folds to four lines. */
.prompt-clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
/* An attached file is source: keep its indentation, scroll sideways. */
.prompt-att-file{white-space:pre;overflow-wrap:normal;overflow-x:auto;color:var(--text-2)}
.prompt-more{align-self:flex-start;font-size:12px}
.sel-item[aria-selected="true"]{color:var(--text-1)}
.sel-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-detail{margin-inline-start:auto;font-size:12px;color:var(--text-3)}
.sel-label+.sel-check{margin-inline-start:auto}
.sel-check{flex-shrink:0;color:var(--accent)}
.sel-empty{margin:0;padding:12px;font-size:13px;color:var(--text-3)}
@media (max-width:720px),(pointer:coarse){.sel-btn{height:44px}.sel-item{min-height:44px}}

/* turns */
/* Commands and output want the width; replies keep an 80ch measure. */
.transcript{flex-grow:1;padding:24px 24px 8px;display:flex;flex-direction:column;gap:24px}
.transcript:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* Left-aligned under the header, as wide as a wide window allows:
   commands, output and tables use the width; prose keeps a measure. */
.transcript>*{width:100%;max-width:960px;margin-inline:0}
.transcript .prompt{max-width:none}
.transcript .say{max-width:none}
/* Prose keeps its measure; a table takes the column's full width. */
.say>:not(.md),.say>.md>:not(.md-table){max-width:80ch}
.md-table table{width:100%}
.prompt-images{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.prompt-images a{display:grid;place-items:center;width:72px;height:54px;border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden;font-size:11px;color:var(--text-3);text-align:center}
.prompt-images img{width:100%;height:100%;object-fit:contain}
.transcript-retry{display:flex;align-items:center;justify-content:center;gap:10px}
.rt-paused{color:#e2ba78}
.rt-paused .link{color:#e2ba78;text-decoration:underline}
.turn{display:flex;flex-direction:column;gap:10px}
.prompt{display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:8px;align-items:baseline;max-width:78ch;min-width:0}
.prompt-mark{color:var(--accent)}
/* A pasted path or URL has no break opportunities; without these a long
   one pushed the whole prompt off the right edge of a phone. */
.prompt-text{min-width:0;display:flex;flex-direction:column;gap:8px}
.prompt p{margin:0;font-size:16px;font-weight:500;text-wrap:pretty;white-space:pre-wrap;overflow-wrap:anywhere}
/* Skill bodies ride along with the prompt they were invoked from. They
   are context the agent read, not something you typed, so they fold. */
.prompt-chip{display:inline-flex;align-items:center;max-width:100%;height:24px;padding:0 6px;vertical-align:1px;
  border:1px solid var(--line);border-radius:4px;background:none;font:500 12px var(--mono);color:var(--text-2);
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prompt-chip:hover,.prompt-chip[aria-expanded="true"]{border-color:var(--line-strong);color:var(--text-1)}
.prompt-atts{display:flex;flex-wrap:wrap;gap:6px}
.prompt-att{margin:0;padding:10px 14px;max-height:240px;overflow:auto;font:12px/1.6 var(--mono);border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--text-3);white-space:pre-wrap;overflow-wrap:anywhere}
.prompt-time{align-self:start;font-size:11px;line-height:24px;color:var(--text-3);white-space:nowrap}
.turn-body{display:flex;flex-direction:column;gap:12px;padding-left:22px}
.turn-body>.block+.block{margin-top:-6px}
.turn-done{padding-left:22px;font-size:12px;color:var(--text-3)}
/* A turn ends with what it did and what it cost. */
.turn-foot{padding-left:22px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;
           font-size:12px;line-height:18px;color:var(--text-3)}
.turn-outcome{color:var(--text-2)}
.turn-failed{color:var(--red)}
.turn-files>summary{cursor:pointer;list-style:none;color:var(--text-2)}
.turn-files>summary::-webkit-details-marker{display:none}
.turn-files>summary::before{content:"›";margin-inline-end:6px;font-family:var(--mono)}
.turn-files[open]>summary::before{content:"⌄"}
.turn-files[open]{flex-basis:100%}
.turn-files ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.turn-files li{font-size:12px;color:var(--text-2);overflow-wrap:anywhere}
/* The session's budget, always in view, and unboxed. */
/* It rides the thread head, beside the run setting: no band of its own. */
.runtime-strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:12px;line-height:16px}
.runtime-strip:empty{display:none}
.rt{display:inline-flex;align-items:center;gap:6px;min-width:0}
.rt-label{color:var(--text-3)}
.rt-value{color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-bar{width:64px;height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.rt-bar>span{display:block;height:100%;background:var(--accent)}
.rt-bar>.rt-hot{background:var(--amber)}
.rt-cache-hot .rt-value{color:var(--accent)}
.rt-cache-cold .rt-value{color:var(--text-2)}
.rt-jobs{position:relative}
.rt-jobs>summary{list-style:none;cursor:pointer;display:inline-flex;gap:6px}
.rt-jobs>summary::-webkit-details-marker{display:none}
.rt-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:20;margin:0;padding:6px 10px;list-style:none;min-width:260px;max-width:480px;
  background:var(--raised);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:4px}
.rt-pop li{display:flex;gap:12px;justify-content:space-between}
.rt-job-cmd{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-add{color:var(--accent)}
.rt-del{color:var(--red)}
.rt-pop li{align-items:center}
.rt-stale{color:var(--text-3)}
.rt-mark{display:inline-flex;margin-inline-end:4px;vertical-align:-2px}
.rt-diff{width:min(760px,calc(100vw - 24px));max-width:none;padding:4px}
.rt-pop li.rt-pop-head{flex-direction:column;align-items:stretch;gap:2px;padding-block:4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.rt-pop-head>span{min-width:0}
.rt-changes{width:min(420px,calc(100vw - 24px))}
.rt-jobs-pop{width:min(480px,calc(100vw - 24px));max-height:min(420px,60vh);overflow-y:auto}
.rt-job-row>.num{white-space:nowrap;flex-shrink:0}
.rt-pop li.rt-job{flex-wrap:wrap;gap:4px 8px}
.rt-job-row{flex:1;min-width:0;min-height:36px;align-items:center;justify-content:space-between;gap:12px;text-align:start}
.rt-job-out{flex-basis:100%;margin:0;padding:6px 8px;max-height:160px;overflow:auto;font-size:12px;line-height:17px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border-radius:6px}
@media (max-width:720px),(pointer:coarse){.rt-job-row{min-height:44px}}
.head-pop:focus{outline:none}
.rt-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rt-back{gap:8px;height:32px;color:var(--text-2)}
.rt-diff-body{margin:0;padding:6px 8px;max-height:min(420px,60vh);overflow:auto;font-size:12px;line-height:17px;white-space:pre}
.rt-diff-body>span{display:block}
.rt-pop .rt-link:focus-visible,.rt-jobs>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rt-link{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.rt-link:hover .rt-value{text-decoration:underline}
.rt-stop{height:24px;padding:0 8px;font-size:12px;flex-shrink:0}
/* A figure's detail: after a beat on hover, at once on focus or a tap. */
.rt-tip{position:relative;border-radius:4px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:default;text-align:start}
.rt-tip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rt-tip[data-tip="pin"]>.rt-tip-body{display:block;animation:none}
.rt-tip[data-tip="shut"]>.rt-tip-body{display:none!important}
.rt-file{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:36px;min-width:0}
.head-idle{color:var(--text-3)}
.rt-tip-body{position:absolute;top:calc(100% + 8px);left:0;z-index:30;width:max-content;max-width:min(360px,calc(100vw - 24px));
  padding:6px 10px;font-size:12px;line-height:16px;color:var(--text-2);background:var(--raised);
  border:1px solid var(--line);border-radius:8px;display:none}
/* display, not visibility: a hidden tip must not widen a phone's page. */
.rt-tip:hover>.rt-tip-body{display:block;animation:tip-in 80ms 300ms both}
.rt-tip:focus>.rt-tip-body{display:block;animation:none}
@keyframes tip-in{from{opacity:0}to{opacity:1}}
.sel-note{margin:0;padding:6px 12px;font-size:12px;color:var(--text-3);border-bottom:1px solid var(--line)}
/* Home: what wants a person now. */
.ov{flex-grow:1;display:flex;flex-direction:column;min-height:0}
.ov-head{flex-shrink:0;display:flex;align-items:center;gap:16px;height:48px;padding:0 24px;border-bottom:1px solid var(--line)}
.ov-head h1{margin:0;font-size:16px;font-weight:600}
.ov-hint{font-size:12px;color:var(--text-3)}
.ov-body{padding:24px;display:flex;flex-direction:column;gap:24px}
.ov-group{display:flex;flex-direction:column}
.ov-label{margin:0 0 4px;font:600 12px/16px var(--sans);color:var(--text-3)}
.ov-row{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;text-align:start;
        background:none;border:0;border-bottom:1px solid var(--line);color:var(--text-1);font:15px var(--sans);cursor:pointer}
.ov-row:hover{background:var(--raised)}
.ov-title{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-meta{flex-shrink:0;font-size:12px;color:var(--text-3)}
.ov-open{flex-shrink:0;font-size:12px;color:var(--accent)}
.ov-stale{display:flex;align-items:center;gap:12px;height:32px;margin:0;padding:0 12px;border-radius:6px;
          background:var(--raised);font-size:13px;color:var(--amber)}
.ov-why{flex-shrink:0;font-size:12px;color:var(--text-2)}
@media (max-width:720px){.ov-row{height:auto;min-height:44px;flex-wrap:wrap;row-gap:0;padding-block:6px}.ov-title{flex-basis:100%}.ov-open{margin-inline-start:auto}}
.ov-none{margin:0;color:var(--text-2)}

.say{display:flex;flex-direction:column;gap:8px;max-width:78ch}
.say-who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text-2)}
.sub-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--text-3)}
.err{background:var(--surface);border-left:2px solid var(--red);border-radius:0 6px 6px 0;
     padding:10px 14px;color:var(--red);white-space:pre-wrap;font-size:14px;max-width:78ch}
.hk-notice{margin:3px 0 0;padding-inline-start:10px;font-size:12px;color:var(--text-3);
           border-inline-start:2px solid var(--line-strong);overflow-wrap:anywhere}
.hk-cut{color:var(--amber)}
.hook-line{margin:0 0 6px;font-size:12px;color:var(--text-3)}
.hook-act{color:var(--amber)}
.hook-bad{color:var(--red)}
.hook-why{color:var(--text-3)}
.meta-line{font-size:12px;color:var(--text-3);max-width:78ch}

/* collapsible code and results */
.block{background:var(--surface);border-radius:8px;overflow:hidden}
.block>summary{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;list-style:none}
/* .block clips its overflow, so an outside ring would be cut off. */
.block>summary:focus-visible{outline-offset:-2px}
.block>summary::-webkit-details-marker{display:none}
.block>summary::before{content:"›";color:var(--text-3);font-family:var(--mono);width:8px}
.block[open]>summary::before{content:"⌄"}
.block-label{font-size:13px;color:var(--text-2);flex-shrink:0}
.block-detail{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-lines{margin-left:auto;font-size:12px;color:var(--text-3);flex-shrink:0}
.block pre{margin:0;padding:12px 14px;border-top:1px solid var(--line);font:13px/1.6 var(--mono);
           color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere;
           padding-inline-start:26px;text-indent:-12px}
/* thinking is prose, not a program: sans, wrapped, and a measure that
   does not run the full width of a wide window */
.block-failed .block-label{color:var(--red)}
/* The copy control rides the block's own header row, on the trailing
   edge, so it is there whether the block is open or shut without
   costing a row of its own. Quiet until wanted, but always in the DOM
   and always reachable by keyboard: a control that appears only on
   hover does not exist on a touchscreen. */
.copy-btn{display:grid;place-items:center;width:24px;height:24px;flex-shrink:0;
          color:var(--text-3);background:none;border:0;border-radius:6px;padding:0;
          cursor:pointer;opacity:.45;
          transition-property:opacity,color,background-color;transition-duration:120ms}
.block-lines+.copy-btn{margin-inline-start:8px}
/* With no line count to follow, the button takes the trailing edge. */
.block-detail+.copy-btn{margin-inline-start:auto}
.block:hover .copy-btn,.copy-btn:focus-visible{opacity:1}
.copy-btn:hover{color:var(--text-1);background:var(--raised)}
.copy-done{opacity:1;color:var(--accent)}
@media (hover:none){.copy-btn{opacity:1}}
@media (prefers-reduced-motion:reduce){.copy-btn{transition:none}}

/* the composer's / and @ pickers, docked above the box */
.composer{position:relative}
/* A popover, not a second transcript: capped width, eight rows tall,
   name first and folder dimmed, the keys it answers to in the foot. */
.mention{position:absolute;inset-block-end:calc(100% + 6px);max-width:480px;inset-inline-start:0;z-index:30;
         width:min(560px,100%);display:flex;flex-direction:column;overflow:hidden;
         background:var(--raised);border:1px solid var(--line-strong);border-radius:10px;
         box-shadow:0 1px 2px rgb(0 0 0/.4),0 10px 28px rgb(0 0 0/.45)}
.mention-list{max-height:min(288px,44vh);overflow-y:auto;padding:4px}
.mention-item{display:flex;align-items:center;gap:10px;width:100%;text-align:start;
              background:none;border:none;border-radius:6px;padding:0 10px;cursor:pointer;
              font:inherit;min-height:36px;color:var(--text-2)}
.mention-on{background:var(--sel);color:var(--text-1);box-shadow:inset 2px 0 0 var(--accent)}
.mention-glyph{flex-shrink:0;color:var(--text-3)}
.mention-on .mention-glyph{color:var(--accent)}
.mention-name{font-size:14px;color:var(--text-1);flex-shrink:0;max-width:60%;
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mention-dir{font-size:12px;color:var(--text-3);min-width:0;overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:start}
.mention-hint{font-size:12px;color:var(--text-3);min-width:0;overflow:hidden;
              text-overflow:ellipsis;white-space:nowrap}
.mention-foot{display:flex;gap:14px;padding:7px 12px;border-top:1px solid var(--line);
              font-size:12px;color:var(--text-3)}
.mention-foot kbd{font:11px var(--mono);color:var(--text-2);background:var(--surface);
                  border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-inline-end:3px}
@media (max-width:720px),(pointer:coarse){.mention-item{min-height:44px}.mention-foot{display:none}}

/* ⌘K quick access */
.pal-scrim{position:fixed;inset:0;background:rgb(0 0 0/.55);z-index:60}
.pal{position:fixed;z-index:61;inset-block-start:12vh;inset-inline:0;margin-inline:auto;
     width:min(620px,calc(100vw - 32px));background:var(--raised);
     border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;
     box-shadow:0 2px 4px rgb(0 0 0/.4),0 18px 48px rgb(0 0 0/.5);
     display:flex;flex-direction:column;max-height:min(70vh,calc(var(--vvh,100dvh) - 32px))}
.pal-field{font:15px var(--sans);color:var(--text-1);background:var(--surface);border:none;
           border-bottom:1px solid var(--line);padding:14px 16px;width:100%}
.pal-field::placeholder{color:var(--text-3)}
.pal-field:focus{outline:none}
/* Search fields inside a popover still show where the keyboard is. */
.pal-field:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pal-list{overflow-y:auto;padding:6px}
.pal-group{margin:8px 0 3px;padding-inline-start:10px;font:600 11px var(--mono);
           letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.pal-item{display:flex;align-items:baseline;gap:10px;width:100%;text-align:start;
          background:none;border:none;border-radius:7px;padding:8px 10px;cursor:pointer;
          font:inherit;min-height:32px}
.pal-on{background:var(--sel);box-shadow:inset 2px 0 0 var(--accent)}
.pal-label{font-size:13.5px;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap;flex:1}
.pal-on .pal-label{color:var(--accent)}
.pal-hint{font-size:12px;color:var(--text-3);min-width:0;max-width:56%;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
          font-family:var(--mono)}
.pal-none{margin:0;padding:16px 12px;font-size:13px;color:var(--text-3)}
.pal-foot{flex-shrink:0;display:flex;align-items:center;gap:12px;height:28px;padding:0 12px;
          border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}
.pal-foot-bad{color:var(--red)}
.pal-foot-keys{margin-inline-start:auto;font-family:var(--mono);font-size:11px}
@media (max-width:720px){.pal-foot-keys{display:none}}
/* the shortcut says it exists; a palette nobody finds is not a feature */
.pal-key{margin-inline-start:auto;font:600 10.5px var(--mono);color:var(--text-3);
         border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px}
@media (max-width:720px){.pal{inset-block-start:16px;max-height:calc(var(--vvh,100dvh) - 32px)}}

/* picking repos for one project */
.rp-pick{cursor:pointer;min-height:24px}
.rp-pick input{width:16px;height:16px;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.rp-bar{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-height:44px;
        padding:6px 24px;border-top:1px solid var(--line-strong);background:var(--surface)}
.rp-count{font-size:13px;color:var(--text-1)}
.rp-bar .btn,.rp-bar .sel-btn{height:32px}
.rp-clear{margin-inline-start:auto}
.rp-state{display:flex;align-items:center;gap:8px;height:36px;margin:0;font-size:13px;color:var(--text-3)}
.proj-filter .field{width:100%;height:32px;margin:0}
.proj-check{display:grid;place-items:center;width:24px;height:24px;flex-shrink:0;cursor:pointer}
.proj-check input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.proj-picked{background:var(--sel)}
.proj-page-head>.head-side{display:flex;margin-inline-start:auto}
.rp-group>summary::before{content:"›";display:inline-block;width:12px;color:var(--text-3);transition:transform .15s}
.rp-group[open]>summary::before{transform:rotate(90deg)}
@media (max-width:720px){
  .rp-bar{min-height:88px;padding:8px 16px}
  .rp-bar .btn,.rp-bar .sel-btn{height:44px}
  .proj-check{width:44px;height:44px;margin-inline-start:-10px}
  .proj-row>.proj-open{flex-basis:calc(100% - 58px)}
  .proj-row>.proj-open~*:not(.proj-move){margin-inline-start:34px}
  .proj-row>.proj-open~.proj-when{margin-inline-start:0}
  .proj-filter .field{height:44px}
  .proj-page-head>.head-side{display:flex}
}
.rp-name{display:flex;flex-direction:column;gap:4px;min-width:min(260px,100%)}
.rp-name .field{margin:0}

/* The Hooks page: many small things, each with a state. Rows share one
   grid so the eye runs down a column instead of re-reading each row's
   layout, and everything secondary is folded away until asked for. */
.hk2-row{padding:9px 0;border-top:1px solid var(--line)}
.hk2-row:first-of-type{border-top:0}
.hk2-line{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.hk2-name{font-size:13.5px;color:var(--text-1);font-weight:500;overflow-wrap:anywhere}
.hk2-off .hk2-name{color:var(--text-3);text-decoration:line-through}
.hk2-facts{font-size:12px;color:var(--text-3);min-width:0;overflow-wrap:anywhere}
.hk2-globs{display:block;margin-top:2px;font-size:12px;color:var(--text-3)}
.hk2-actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}

/* State is a word, never a colour alone. */
.hk2-state{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
           padding:2px 6px;border-radius:4px;flex-shrink:0}
.hk2-ok{color:var(--accent);background:color-mix(in oklab,var(--accent) 14%,transparent)}
.hk2-bad{color:var(--red);background:color-mix(in oklab,var(--red) 16%,transparent)}
.hk2-warn{color:var(--amber);background:color-mix(in oklab,var(--amber) 16%,transparent)}
.hk2-tag{font-size:11px;color:var(--text-3);border:1px solid var(--line-strong);
         border-radius:999px;padding:1px 7px;flex-shrink:0}
.hk2-alert{margin:5px 0 0;padding-inline-start:9px;border-inline-start:2px solid var(--red);
           font-size:12px;color:var(--red);overflow-wrap:anywhere}
.hk2-note{margin:0 0 4px;font-size:12px;color:var(--text-3)}
.hk2-path{margin:0 0 6px;font-size:11.5px;color:var(--text-3);overflow-wrap:anywhere}
.hk2-more>summary{font-size:12px;color:var(--text-3);cursor:pointer;padding:4px 0;
                  list-style:none;min-height:24px;display:flex;align-items:center;gap:6px}
.hk2-more>summary::-webkit-details-marker{display:none}
.hk2-more>summary::before{content:"\203a";font-family:var(--mono)}
.hk2-more[open]>summary::before{content:"\2304"}
.hk2-more-body{padding-inline-start:14px}
.hk2-gives{margin:0;padding-inline-start:16px;columns:2;column-gap:24px}
.hk2-gives li{margin:2px 0;break-inside:avoid}
.hk2-give{font-size:12.5px;color:var(--text-2)}

/* The page header: what needs attention, before any list. */
.hk2-sum{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;
         padding:0 0 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.hk2-sum-n{font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.hk2-sum-lab{font-size:12px;color:var(--text-3)}
@media (max-width:720px){
  .hk2-actions{margin-inline-start:0;width:100%}
  .hk2-gives{columns:1}
}

/* syntax colours — drawn from the app's own palette rather than a stock
   highlight.js theme, so code sits in the interface instead of on it.
   Hue carries meaning: green is the accent already used for "the agent",
   amber for literal values, red for anything destructive-looking. */
.hl{white-space:pre-wrap;overflow-wrap:anywhere}
.tool-output{border-top:1px solid var(--line);max-height:min(320px,40dvh);overflow:auto;overscroll-behavior:contain}
.block-body>.tool-output:first-child{border-top:0}
.block .tool-output pre.hl{white-space:pre;overflow-wrap:normal;overflow-x:auto;border-top:0;
                           text-indent:0;padding:12px 14px}
.hljs-comment,.hljs-quote{color:var(--text-3);font-style:italic}
.hljs-string,.hljs-regexp,.hljs-meta-string{color:var(--amber)}
.hljs-number,.hljs-literal,.hljs-boolean{color:#cfa6e0}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in{color:var(--accent)}
.hljs-title,.hljs-title.function_,.hljs-section{color:#9ec9f0}
.hljs-attr,.hljs-attribute,.hljs-property{color:#e0c98a}
.hljs-variable,.hljs-template-variable,.hljs-params{color:var(--text-1)}
.hljs-type,.hljs-class .hljs-title{color:#8fd6c4}
.hljs-symbol,.hljs-bullet,.hljs-link{color:var(--accent)}
.hljs-deletion{color:var(--red)}
.hljs-addition{color:var(--accent)}
.hljs-emphasis{font-style:italic}
.hljs-strong{font-weight:600}

/* a block's contents, and the call folded one layer inside it */
.block-body{border-top:1px solid var(--line)}
.block-inner{border-top:1px solid var(--line);background:var(--bg)}
.block-inner>summary{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;
                     list-style:none;font-size:12px}
.block-inner>summary::-webkit-details-marker{display:none}
.block-inner>summary::before{content:"\203a";color:var(--text-3);font-family:var(--mono);width:8px}
.block-inner[open]>summary::before{content:"\2304"}
.block-inner>summary .block-label{font-size:12px;color:var(--text-3)}
.block-inner pre{border-top:1px solid var(--line)}
/* Collapse in levels: a run of tool calls is one row; opened, it lists
   the calls, and each call opens onto its output. */
.toolrun-body{display:flex;flex-direction:column;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--bg)}
.toolrun-failed{margin-left:auto;font-size:12px;color:var(--red);flex-shrink:0}
/* A call's recorded exit and duration lead its metadata; the line count follows. */
.tool-meta{margin-left:auto;font-size:12px;color:var(--text-3);flex-shrink:0;white-space:nowrap}
.tool-meta+.block-lines{margin-left:0}
.tool-meta-failed{color:var(--red);font-weight:600}
/* Hooks and rules fire on every call: one quiet row per turn, the ledger inside. */
.turn-hooks{background:none;border:1px solid var(--line)}
.turn-hooks>summary{padding:5px 12px}
.turn-hooks>summary .block-label,.turn-hooks>summary .block-detail{font-size:12px;color:var(--text-3)}
.turn-hooks-body{max-height:min(280px,35dvh);overflow:auto;padding:8px 12px 4px;border-top:1px solid var(--line)}
.turn-hooks-body .hook-line{margin:0 0 6px;overflow-wrap:anywhere}
.thinking pre{color:var(--text-3);font:13px/1.65 var(--sans);white-space:pre-wrap;
              text-indent:0;padding-inline-start:14px;max-width:78ch}
.think-body{padding:2px 12px 12px;max-width:78ch}
.think-body .md{color:var(--text-2);font-size:13px;line-height:20px}
/* Open, the body starts with the sentence the summary previewed. */
.thinking[open]>summary .block-detail{display:none}
.think-body .md pre{background:var(--bg)}
.thinking .block-detail{font-style:italic}
/* Reasoning is not execution: no filled card, so tool calls carry the weight. */
.block.thinking{background:none;border:1px solid var(--line)}
/* Bookkeeping rows are one thin line: no card, muted 12px, detail on hover
   (.thin-pop) and the full blocks one click in. */
.block.thin{background:none;border:0;border-radius:0;overflow:visible}
.block.thin>summary{gap:8px;padding:4px;min-height:28px;font-size:13px;line-height:20px;border-radius:4px}
.block.thin>summary>.block-detail{flex:1 1 auto}
.block.thin>summary .block-label{font-weight:500}
.block.thin>summary:focus-visible{outline-offset:0}
.block.thin>summary::before{width:8px}
.block.thin>summary .block-label,.block.thin>summary .block-detail{font-size:13px;color:var(--text-3)}
.block.thin>summary:hover .block-label,.block.thin>summary:hover .block-detail{color:var(--text-2)}
.block.thin.block-failed>summary .block-label,.block.thin>summary .thin-failed{color:var(--red)}
.block.thin>summary .block-detail{min-width:0}
.block.thin>summary .tool-meta,.block.thin>summary .toolrun-failed{margin-left:0}
.block.thin>summary .tool-meta::before,.block.thin>summary .toolrun-failed::before{content:"· ";color:var(--text-3)}
.block.thin:not([open])>summary .copy-btn{display:none}
.block.thin[open]>summary .copy-btn{margin-inline-start:auto;width:20px;height:20px}
.block.thin>.block-body,.block.thin>pre,.block.thin>.think-body,.block.thin>.turn-hooks-body{
  margin:4px 0 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.block.thin>.think-body{background:none;padding-top:10px}
.block.thin.toolrun>.toolrun-body{gap:2px;padding:2px 0 4px 10px;margin-inline-start:7px;border-top:0;border-left:1px solid var(--line);background:none}
.turn-body>.block.thin+.block.thin{margin-top:-10px}
.sub-body>.block.thin+.block.thin{margin-top:-8px}
.thin-pop{position:fixed;z-index:60;max-height:min(240px,calc(100vh - 32px));overflow:auto;max-width:min(640px,calc(100vw - 32px));
  display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:2px 10px;padding:6px 10px;
  background:var(--raised);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.18);
  font-size:12px;line-height:18px;color:var(--text-2)}
.thin-pop-row{display:contents}
.thin-pop-cmd{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text-1)}
.thin-pop-row .num{color:var(--text-3);text-align:end;white-space:nowrap}
.thin-pop-failed>span,.thin-pop-failed .num{color:var(--red)}
.thin-pop-out{grid-column:1/-1;margin:0;white-space:pre;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.block.thin>summary .toolrun-failed{height:auto;color:var(--red)}
.block.thin>summary .toolrun-failed:hover{text-decoration:underline}
/* thin lines stay one line at any width: the full text is one tap in */
.block.thin>summary{flex-wrap:nowrap}
.block.thin>summary>.block-detail{order:0;flex:0 1 auto;flex-basis:auto;min-width:0;padding-inline-start:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px}
.block.thin>summary>.block-label,.block.thin>summary>.num{flex:none;white-space:nowrap}

/* markdown inside a reply */
.md{color:var(--text-2)}
.say .md{color:var(--text-1)}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md p{margin:0 0 12px;text-wrap:pretty}
.md h1,.md h2,.md h3,.md h4{color:var(--text-1);line-height:1.25;margin:18px 0 8px;text-wrap:balance}
.md h1{font-size:19px}.md h2{font-size:17px}.md h3{font-size:15px}.md h4{font-size:14px}
.md ul,.md ol{margin:0 0 12px;padding-inline-start:22px}
.md li{margin:4px 0}
.md li::marker{color:var(--text-3)}
.md code{font:13px var(--mono);background:var(--raised);border-radius:4px;padding:1px 5px;color:var(--text-1)}
.md pre{background:var(--surface);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.md pre code{background:none;padding:0;font-size:13px;line-height:1.6}
.md a{color:var(--accent)}
.md a:hover{color:var(--text-1)}
.md blockquote{margin:0 0 12px;padding-inline-start:14px;border-inline-start:2px solid var(--line-strong);
               color:var(--text-3)}
.md-table{position:relative;margin:0 0 12px}
.md-table-scroll{overflow-x:auto;border-radius:4px;min-width:0;max-width:100%}
.md-table-scroll:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.md-table::after{content:"";position:absolute;inset-block-end:0;height:var(--tbl-h,100%);right:0;width:24px;pointer-events:none;
  background:linear-gradient(to right,transparent,var(--bg))}
.md-table:not([data-over])::after,.md-table[data-end]::after{display:none}
.md-table[data-over]::before{content:attr(data-over);display:block;font-size:12px;line-height:16px;color:var(--text-3);margin-bottom:4px}
.md-table[data-over]{--tbl-h:calc(100% - 20px)}
@media (max-width:720px){.md-table table{min-width:640px}.md-table th,.md-table td{padding:8px;font-size:13px;line-height:18px}
  .md-table th:first-child,.md-table td:first-child{position:sticky;left:0;width:112px;min-width:112px;background:var(--bg);z-index:1}
  .md-table code{white-space:nowrap}}
.md table{border-collapse:collapse;margin:0;font-size:14px;display:table}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:start;vertical-align:top}
.md th{color:var(--text-1);font-weight:600}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}

.ask{background:var(--raised);border-inline-start:3px solid var(--amber);border-radius:0 8px 8px 0;
     scroll-margin-block:16px;padding:16px 18px;display:flex;flex-direction:column;
     gap:12px;max-width:78ch}
/* Short options sit in a row; long ones wrap to their own lines. */
.ask-options{display:flex;gap:6px;flex-wrap:wrap}
.ask-option{min-height:36px;height:auto;padding-block:8px;font-size:14px;line-height:20px;white-space:normal;text-align:start}
@media (max-width:720px),(pointer:coarse){.ask-option{min-height:44px}}
.ask-q{margin:0;font-size:15px;font-weight:500;color:var(--text-1)}

/* composer */
/* The composer shares the transcript's column, so what you type
   lines up with what you are reading. */
.composer-wrap{position:relative;flex-shrink:0;padding:8px 24px 12px}
.composer-wrap>*{width:100%;max-width:960px;margin-inline:0}
.send-failed{margin-bottom:8px;padding-inline:12px;line-height:18px;color:var(--text-2);font-size:13px;
             display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:8px}
.send-failed>details{min-width:0}
.send-failed summary,.send-failed-line{display:flex;align-items:center;gap:6px;min-height:32px;cursor:pointer;list-style:none;min-width:0}
.send-failed-line{cursor:default}
.send-failed summary::-webkit-details-marker{display:none}
.send-failed-chev{flex-shrink:0;color:var(--text-3);transition:transform .12s}
.send-failed details[open] .send-failed-chev{transform:rotate(90deg)}
.send-failed-meta{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:12px}
.send-failed strong{font-weight:600;color:#FF9787;flex-shrink:0}
.send-failed-text{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send-failed details[open] .send-failed-gist{display:none}
.send-failed-body{padding:4px 0 4px 12px;border-inline-start:2px solid #FF9787}
.send-failed-body p{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:30vh;overflow-y:auto}
.send-failed-prompt{color:var(--text-1)}
.send-failed-actions{display:flex;align-items:center;gap:8px}
.send-failed .btn{height:32px;padding:0 10px;font-size:13px}
@media (max-width:480px){.send-failed .link{min-height:44px}}
@media (max-width:600px){.send-failed summary{align-items:flex-start;padding-block:6px}
  .send-failed summary strong{display:block}
  .send-failed summary{flex-wrap:wrap;row-gap:2px}
  .send-failed-text{flex-basis:100%;white-space:normal;font-size:12px;line-height:16px;padding-inline-start:18px}
  .send-failed-gist{display:none}}
@media (max-width:720px),(pointer:coarse){.send-failed .btn{height:44px}}
/* Jump to latest sits beside Send: it never covers what you read. */
.jump-latest{gap:6px;font-size:12px}
/* At rest the composer is one row, the input beside its buttons; a long draft puts them under it. */
.composer{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;
          display:flex;flex-direction:row;align-items:flex-end;gap:6px;padding:6px 6px 6px 12px;min-height:56px;box-sizing:border-box}
.composer:not(.composer-multi) .hint{display:none}
.composer textarea{flex:1 1 auto;align-self:center;min-height:20px}
.composer-multi{flex-direction:column;align-items:stretch;padding:10px 12px}
.composer-multi textarea{align-self:stretch}
.composer-bar{display:flex;align-items:center;gap:12px}
.composer-actions{margin-inline-start:auto;display:flex;gap:8px}
.composer-bar .btn{height:32px}
/* It already grows to its text, so a drag grip is only noise. */
.composer textarea{width:100%;resize:none;background:none;border:0;color:var(--text-1);
                   font:14px/20px var(--sans);padding:0;max-height:34vh;overflow-y:auto}
.composer:has(> #composer:focus){outline:2px solid #82CB9A;outline-offset:2px}
/* A question further up is easy to lose once the turn scrolls on. */
.ask-bar{display:flex;align-items:center;gap:12px;margin-bottom:8px;min-height:32px;padding:0 0 0 12px;
         background:var(--raised);border-inline-start:3px solid var(--amber);border-radius:0 8px 8px 0}
.ask-bar p{margin:0;flex:1;min-width:0;font-size:13px;color:var(--text-2);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-bar strong{color:var(--amber);font-weight:600}
.ask-bar .btn{height:32px}
@media (max-width:720px),(pointer:coarse){.ask-bar{min-height:44px}.ask-bar .btn{height:44px}}
.composer textarea:focus{outline:none}
.composer textarea::placeholder{color:var(--text-3)}
.hint{font-size:12px;line-height:16px;color:var(--text-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attach-note{font-size:12px;color:var(--text-2)}
.attach-err{color:var(--red)}
.prompt-images{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.prompt-images img{display:block;max-height:160px;max-width:100%;border-radius:6px;border:1px solid var(--line)}
.composer:not(:has(> #composer:focus)) .hint{visibility:hidden}
/* The summary card: fixed beside the sidebar, never over the list it describes. */
.row-card{position:fixed;z-index:40;width:360px;max-width:calc(100vw - 24px);padding:10px 12px;border-radius:8px;
  background:var(--raised);border:1px solid var(--line-strong);color:var(--text-2);font-size:13px;line-height:1.45;
  box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none}
.row-card-state{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12px;color:var(--text-3)}
.row-card-note{margin:8px 0 0}
.row-card-note span{display:block;font-size:12px;color:var(--text-3)}
@media (hover:none){.row-card{display:none}}
.row-wrap{position:relative}
.row-ack{position:absolute;right:34px;top:50%;transform:translateY(-50%);z-index:2;height:24px;padding:0 8px;font-size:12px;
  opacity:0;pointer-events:none;background:var(--raised)}
.row-wrap:not(:has(.row-twist))>.row-ack{right:8px}
.row-wrap:hover>.row-ack,.row-wrap:focus-within>.row-ack{opacity:1;pointer-events:auto}
@media (hover:none){.row-ack{opacity:1;pointer-events:auto;height:32px}}
/* On touch the row's actions are real 44px buttons in their own columns, not overlays. */
@media (max-width:720px),(pointer:coarse){
  .row-wrap{display:flex;align-items:center}
  .row-wrap>.row{flex:1 1 auto;min-width:0}
  .row-has-log{padding-inline-end:10px}
  .row-wrap>.row-ack,.row-wrap>.row-twist{position:static;transform:none;flex:0 0 auto;opacity:1;pointer-events:auto;min-width:44px;height:44px}
  .row-wrap>.row-twist{width:44px}}
.row-jobs{flex-shrink:0;margin-inline-start:auto;font-size:12px;color:var(--accent)}
.btn{font:13px var(--sans);color:var(--text-2);background:none;border:1px solid var(--line-strong);
     border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{color:var(--text-1)}
.btn-primary{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:500}
.btn-primary:hover{color:var(--bg);filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
/* A half-faded accent still reads as "press me"; an empty Send is not. */
.btn-primary:disabled{background:var(--raised);color:var(--text-3);border-color:var(--line);opacity:1;filter:none}
/* Fingers are not cursors: the icon buttons get a full touch target. */
@media (max-width:720px),(pointer:coarse){.back,.head-more>.more,.copy-btn{min-width:44px;min-height:44px}}
/* On a phone the command is the part worth reading: it takes its own full
   line instead of being cut to fit beside a line count. */
@media (max-width:720px){
  .block>summary{flex-wrap:wrap;row-gap:2px}
  .block>summary>.block-detail{order:5;flex-basis:100%;white-space:normal;overflow-wrap:anywhere;line-height:18px;padding-inline-start:18px}
  .block:not([open])>summary>.block-lines{display:none}
}
.toast{position:fixed;right:20px;bottom:20px;max-width:46ch;background:var(--raised);
       border:1px solid var(--red);color:var(--text-1);border-radius:8px;padding:10px 14px;font-size:13px}
/* A dismissible alert is a button; buttons do not inherit the font or alignment. */
button.toast{font:13px/1.45 var(--sans);text-align:start;cursor:pointer}

/* sidebar views: icon over label, the way back to the pages beside sessions */
.side-nav{flex-shrink:0;display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.side-nav-item{flex:1 1 0;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;
  background:none;border:0;border-radius:8px;color:var(--text-3);font:12px/16px var(--sans);cursor:pointer}
.side-nav-item:hover{color:var(--text-1);background:var(--raised)}
.side-nav-on{color:var(--text-1);background:var(--sel)}
.side-nav-item .nav-count{position:absolute;top:2px;left:calc(50% + 10px);margin:0}

/* projects */
.proj-body{flex-grow:1;padding:24px 32px;display:flex;flex-direction:column;gap:32px}
.proj{display:flex;flex-direction:column;gap:2px}
.proj-head{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;margin-bottom:6px;
           border-bottom:1px solid var(--line)}
.proj-head h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.proj-count{font-size:12px;color:var(--text-3);margin-right:auto}
.proj-none{margin:6px 0 0;font-size:13px;color:var(--text-3)}
.proj-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.proj-row:last-child{border-bottom:0}
.proj-open{flex:1 1 auto;min-width:0;text-align:start;font:15px var(--sans);color:var(--text-1);
           background:none;border:0;padding:0;cursor:pointer;white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis}
.proj-open:hover{color:var(--accent)}
.proj-when{font-size:12px;color:var(--text-3);flex-shrink:0}
.proj-move .sel-btn{height:28px;font-size:12px;max-width:20ch}
.proj-empty{max-width:56ch;color:var(--text-3)}
.proj-empty-title{margin:0 0 6px;font-size:16px;font-weight:600;color:var(--text-2)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* Dialogs: asked in the page's own voice, not the browser's grey sheet. */
.dlg-scrim{position:fixed;inset:0 0 auto;height:var(--vvh,100dvh);z-index:60;display:grid;place-items:center;padding:16px;background:rgb(0 0 0/.55)}
.dlg{width:min(420px,calc(100vw - 32px));max-height:calc(var(--vvh,100dvh) - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:20px;
     background:var(--raised);border:1px solid var(--line-strong);border-radius:12px;
     box-shadow:0 1px 2px rgb(0 0 0/.4),0 16px 40px rgb(0 0 0/.5)}
.dlg-title{margin:0;font-size:16px;font-weight:600;line-height:1.3;color:var(--text-1)}
.dlg-body{margin:0;font-size:14px;line-height:1.5;color:var(--text-2)}
.dlg-input{font-size:14px;padding:9px 11px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}
.dlg-err{margin:0;font-size:13px;line-height:18px;color:#EF9A9A}
.dlg-actions .btn{min-height:32px;padding:0 14px}
.btn-danger{color:var(--bg);background:var(--red);border-color:var(--red);font-weight:500}
.btn-danger:hover{color:var(--bg);filter:brightness(1.08)}
/* Checkboxes drawn in tokens: the OS box is a white square on a forest page. */
input[type="checkbox"]{appearance:none;flex-shrink:0;display:inline-grid;place-content:center;width:16px;height:16px;
                       margin:0;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);cursor:pointer}
input[type="checkbox"]::before{content:"";width:10px;height:10px;background:var(--bg);transform:scale(0);
                               transition:transform 100ms;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0,43% 62%)}
input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
input[type="checkbox"]:checked::before{transform:scale(1)}
@media (max-width:720px){.dlg-input{font-size:16px}.dlg-actions .btn{min-height:44px}}
/* Context and Hooks: empty sections and missing files fold to one line. */
.ctx-empty>summary,.ctx-missing>summary,.ctx-file>summary,.rp-group>summary{cursor:pointer;list-style:none}
.ctx-empty>summary::-webkit-details-marker,.ctx-missing>summary::-webkit-details-marker,
.ctx-file>summary::-webkit-details-marker,.rp-group>summary::-webkit-details-marker{display:none}
.ctx-empty{max-width:none;border-bottom:1px solid var(--line)}
.ctx-empty>summary,.ctx-empty-row{display:flex;align-items:center;gap:10px;min-height:36px}
.ctx-empty .proj-empty-title{margin:0;font-size:14px;font-weight:600;color:var(--text-2)}
.ctx-none{font-size:12px;color:var(--text-3)}
.ctx-empty .link{margin-inline-start:auto;font-size:12px}
.ctx-file-main{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:44px}
.ctx-file-main::before{content:"›";color:var(--text-3);transition:transform .15s}
.ctx-file[open]>.ctx-file-main::before{transform:rotate(90deg)}
.ctx-file-main>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-file>.hk-path{padding-inline-start:20px}
.hk-fold>summary{cursor:pointer;list-style:none}
.hk-fold>summary::-webkit-details-marker{display:none}
.hk-chev{width:16px;text-align:center;color:var(--text-3);transition:transform .15s}
.hk-fold[open] .hk-chev{transform:rotate(90deg)}
.hk-fold:not(.hk-group) .hk-chev{visibility:hidden}
.hk-fold:not(.hk-group)>summary{cursor:default}
.hk-fold-body{padding:0 0 8px 80px}
.hk-tech{display:none;margin:0}
.hk-runs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.rp-err{display:flex;align-items:center;gap:8px;font-size:13px}
.proj-page-head>.head-side .btn-primary{height:32px;white-space:nowrap;background:var(--accent);border-color:var(--accent)}
@media (max-width:720px){
  .proj-page-head>.head-side .btn-primary{height:44px}
  /* The phone header's second row is empty on this page: the action sits there, whole. */
  .proj-page-head>.head-side>.btn-primary{grid-row:2;grid-column:1/-1;justify-self:end}
  .ctx-empty>summary,.ctx-empty-row{min-height:44px}
  .hk-fold .hk-chev{visibility:visible}
  .hk-fold>summary{cursor:pointer}
  .hk-fold-body{padding-inline-start:80px}
  .hk-tech{display:block}
  .proj-row{min-height:64px}
}
.ctx-empty>p{margin:0 0 8px}
.ctx-file>summary{min-height:36px}
.ctx-missing{color:var(--text-3);font-size:12px}
.ctx-missing>summary{min-height:32px;display:flex;align-items:center}
/* skills picker */
.skills-anchor{position:static}
.skills-scrim{position:fixed;inset:0;z-index:20}
.skills-pop{position:absolute;bottom:calc(100% + 6px);inset-inline-end:0;z-index:21;
            width:min(480px,100%);background:var(--raised);
            border:1px solid #657168;border-radius:8px;
            box-shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px rgb(0 0 0/.45);
            display:flex;flex-direction:column;overflow:hidden}
.skills-filter{font:13px var(--sans);color:var(--text-1);background:var(--surface);
               border:none;border-radius:4px;padding:10px 12px;margin:8px;width:calc(100% - 16px)}
.skills-filter:focus,.skills-filter:focus-visible{outline:2px solid #82CB9A;outline-offset:2px;box-shadow:none}

               grid-template-rows:44px 44px 24px;grid-template-areas:"back main main more" "model model effort effort" "strip strip strip strip"}

  .head-repo{display:none}

  .thread-head{position:relative}
  .head-more{position:static}
  .head-pop{top:calc(100% + 8px);inset-inline:12px;width:auto;max-width:366px;margin-inline-start:auto}

  .ctl-label{width:64px;flex-shrink:0}

  .composer-wrap{padding:8px 16px calc(12px + env(safe-area-inset-bottom))}

  .prompt{grid-template-columns:10px minmax(0,1fr) auto}

  .row-has-log{padding-inline-end:44px}

  .transcript{gap:20px}

  .md td code{white-space:normal;overflow-wrap:anywhere}

  /* Composer at rest: one row, the input beside its buttons; a long draft puts them under it. */
  .composer{flex-direction:row;align-items:flex-end;gap:6px;padding:6px 6px 6px 12px;min-height:56px}
  .composer textarea{flex:1 1 auto;align-self:center;line-height:22px;padding-block:4px;min-height:30px;box-sizing:content-box}

  .prompt-more,.turn-files>summary,.block-inner>summary,.head-ack,.rt-stop{min-height:44px;min-width:44px}

  .prompt-chip{height:32px}
  button.toolrun-failed{position:relative}

  .row-ack{height:44px;top:0;transform:none}
}

/* hooks: watchers, installed hooks, recent fires. The sections reuse the

           background:none;border:0;padding:4px 0;cursor:pointer}

/* rules, plugins and the per-session context panel. Everything listed
   is on until someone turns it off, so the control says "Turn off" at
   rest; an item that is off stays in the list, carries the word "Off",
   and offers the way back — dimming alone would leave no way to find
   it again. */
.hk-offbtn{min-height:32px;flex-shrink:0;font:12px var(--sans);color:var(--text-2);background:none;
           border:1px solid var(--line-strong);border-radius:6px;padding:6px 12px;cursor:pointer}
.hk-offbtn:hover{color:var(--text-1)}

/* A turn that is still running says so where the next words will land.
   The mark turns because the session is running — the status is the
   only clock. Under prefers-reduced-motion the blanket rule above
   freezes every animation here, which is why each one is legible at
   rest: a gapped ring, three dots, a solid block. Motion is never the
   only thing carrying the state; the word beside it always is. */
@keyframes bough-spin{to{transform:rotate(360deg)}}
.spin-mark{transform-origin:50% 50%;animation:bough-spin 1.05s linear infinite}
.working{display:flex;align-items:center;gap:8px;margin:2px 0 0;padding-inline-start:4px;font-size:12px;line-height:16px;color:var(--text-2)}
.working-dots{display:inline-flex;gap:3px}
.working-dots i{width:3px;height:3px;border-radius:50%;background:var(--text-3);
                animation:bough-pulse 1.2s ease-in-out infinite}
.working-dots i:nth-child(2){animation-delay:.16s}
.working-dots i:nth-child(3){animation-delay:.32s}
@keyframes bough-pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* Text that has not been recorded yet. It is deliberately not styled
   as a different kind of thing — it is the same reply, a second early
   — so the only mark is a caret at the end, which vanishes when the
   recorded entry replaces it. */
@keyframes bough-blink{50%{opacity:.25}}
/* The caret has to sit at the end of the last line of prose, so it is
   drawn by that line rather than placed beside the block — a sibling
   element would drop to a row of its own under the flex column. */
.stream-tip .md>:last-child::after{
  content:"";display:inline-block;width:7px;height:.95em;vertical-align:-2px;margin-inline-start:3px;
  background:var(--accent);animation:bough-blink 1s steps(1,end) infinite}

/* Subagents. A subagent's code and results used to be dealt straight
   into the parent's turn, which read as one agent doing two things at
   once. The rail and the indent say "someone else did this", and one
   card per worker keeps a run of interleaved steps as one thing that
   happened. */
.subrun{display:flex;flex-direction:column;gap:0;padding-inline-start:14px;
        border-inline-start:2px solid var(--line-strong)}

             list-style:none;min-height:36px}

.sub[open]>summary::before{content:"\2304"}

.wk-src-foot{flex-shrink:0;padding:10px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}

.wk-filter{min-height:24px;font:11px var(--sans);color:var(--text-3);background:none;border:1px solid var(--line-strong);
           border-radius:999px;padding:2px 9px;cursor:pointer}
.wk-filter[aria-pressed="true"]{color:var(--text-1);background:var(--sel)}
.wk-item{display:flex;flex-direction:column;gap:9px;padding:16px 0;border-bottom:1px solid var(--line)}
.wk-item:last-child{border-bottom:0}
.wk-where{margin-inline-start:auto;font:12px var(--mono);color:var(--text-3);background:none;border:0;padding:0;cursor:pointer}
.wk-where:hover{color:var(--text-1)}
.wk-item-claim{max-width:78ch;font-size:15px;color:var(--text-1)}
.wk-item-claim .md>p{margin:0}
.wk-ev{margin:0;max-width:78ch;padding:12px 14px;background:var(--surface);border-radius:8px;
       font:13px/1.6 var(--mono);color:var(--text-3);white-space:pre-wrap;overflow-wrap:anywhere}
.wk-ev-bad{color:var(--red)}
.wk-acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.wk-tag{flex-shrink:0;font-size:11px;color:var(--text-3);border:1px solid var(--line-strong);border-radius:999px;padding:1px 7px}
.wk-list{display:flex;flex-direction:column;gap:10px}
.wk-run{background:var(--surface);border-radius:8px;overflow:hidden}
.wk-run-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 14px}
.wk-run-when{flex-shrink:0;min-width:6ch;font:12px var(--mono);color:var(--text-3)}
.wk-run-what{flex:1 1 20ch;min-width:0;font-size:13px;color:var(--text-2);overflow-wrap:anywhere}
.wk-run-meta{margin-inline-start:auto;flex-shrink:0;font:12px var(--mono);color:var(--text-3)}
.wk-diff{margin:0;padding:12px 14px;list-style:none;border-top:1px solid var(--line);font:13px/1.6 var(--mono);
         display:flex;flex-direction:column;gap:2px}
.wk-add{color:var(--accent)}
.wk-mod{color:var(--amber)}
.wk-quiet{display:flex;align-items:center;gap:10px;padding:2px 14px;font-size:12px;color:var(--text-3)}
.wk-quiet::before{content:"\203a";font-family:var(--mono)}
.pal-ev{display:block;margin:0 10px 4px 22px;padding:7px 10px;background:var(--surface);border-radius:6px;
        font:12px/1.6 var(--mono);color:var(--text-3);white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:1200px){
  .wk-claim{grid-template-columns:minmax(0,1fr)}
  .wk-note{display:none}
}
@media (max-width:900px){
  .wk-split[data-source="1"] .wk-doc{display:none}
}
@media (max-width:720px){
  .wk-doc{padding:16px}
  .wk-row{flex-wrap:wrap;gap:4px 14px}
  .wk-row-main{flex-basis:100%}
  .wk-where,.wk-run-meta{margin-inline-start:0}
  .wk-inferred{margin-inline-start:0}
}

/* Pages (Context, Hooks, Projects): one short head, no empty budget row. */
.thread-head.page-head{grid-template-rows:36px;grid-template-areas:"back main side";min-height:48px;padding-block:6px}
.page-head~.proj-body{gap:16px}
.ctx-lede{display:flex;flex-wrap:wrap;gap:2px 16px;max-width:none;line-height:18px}
.ctx-usage{color:var(--text-2)}
.proj-open{display:flex;align-items:baseline;gap:14px}
.proj-title{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sel-cols{flex:none;display:flex;justify-content:space-between;align-items:center;height:24px;padding:0 38px 0 14px;
          font-size:11px;font-weight:600;color:var(--text-3);border-bottom:1px solid var(--line)}
.sel-foot{flex:none;padding:8px 12px;font-size:12px;line-height:18px;color:var(--text-2);border-top:1px solid var(--line-strong)}
.sel-foot-unit{color:var(--text-3)}
.dlg-scrim{top:var(--vvt,0px)}
.hk-fold:not(.hk-group) .hk-chev{visibility:visible}
.hk-fold:not(.hk-group)>summary{cursor:pointer}
.hk-inspect{min-width:0;margin:8px 0 12px}
.hk-io{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.hk-payload{min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.hk-payload h4{margin:0;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text-2)}
.hk-payload h4 span{font-weight:400}
.hk-payload p{margin:0;padding:12px;font-size:12px;overflow-wrap:anywhere}
.hk-payload pre{margin:0;padding:12px;max-height:320px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.6;color:var(--text-1)}
.hk-definition{overflow-wrap:anywhere}
.hk-source-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.hk-source-head .hk-path{min-width:0}
.hk-definition .hk-toggle{color:var(--text-1);font-weight:500;text-decoration:underline;text-underline-offset:3px;min-height:28px}
.hk-definition .hk-toggle:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media (pointer:coarse){.hk-definition .hk-toggle{min-height:44px}}
.hk-runs>li+li{border-top:1px solid var(--line);padding-top:8px}
.hook-invocation>summary{cursor:pointer;min-height:28px;padding-block:4px}
.hook-invocation>summary:hover{color:var(--text-1)}
.turn-hooks-body{max-height:none}
@media (max-width:720px){
  .hk-io{grid-template-columns:minmax(0,1fr)}
  .hk-fold-body{padding-inline-start:0}
  .hook-invocation>summary,.hk-inspect .hk-toggle{min-height:44px}
}
.ov-fails{display:flex;flex-direction:column;max-width:720px}
.ov-fail{display:flex;align-items:center;gap:12px;min-height:40px;border-bottom:1px solid var(--line);font-size:13px;color:var(--text-2)}
.ov-fail-what{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);color:var(--text-1)}
.ov-fail-exit{color:#EF9A9A;font-weight:500}
.ov-fail .btn{height:32px;flex-shrink:0}
@media (max-width:720px){
  .thread-head.page-head{grid-template-columns:44px minmax(0,1fr) auto;grid-template-rows:56px;grid-template-areas:none;gap:0 8px;padding-block:0;min-height:56px}
  .thread-head.page-head>*{grid-area:auto;grid-row:1}
  .page-head>.head-side,.proj-page-head>.head-side{display:flex}
  .proj-page-head>.head-side>.btn-primary{grid-row:auto;grid-column:auto}
  .pal{inset-block-start:calc(var(--vvt,0px) + 16px)}
  .proj-row{flex-wrap:nowrap;gap:8px;min-height:64px;padding-block:6px}
  .proj-row>.proj-open{flex:1 1 0;flex-direction:column;align-items:flex-start;gap:4px}
  .proj-row>.proj-open~*:not(.proj-move){margin-inline-start:0}
  .proj-title{max-width:100%;font-size:14px;line-height:20px}
  .proj-open .proj-when{line-height:16px}
  .proj-move .sel-btn{max-width:12ch}
  .hk-main>.hk-name{display:none}
  .hk-main>a.hk-sess{display:block;grid-column:2;grid-row:1;min-width:0;font:500 13px/18px var(--sans);color:#DDE3DE}
  .ov-fail{min-height:64px;flex-wrap:wrap;gap:4px 12px;padding-block:8px}
  .ov-fail-what{flex-basis:100%}
  .ov-fail .btn{height:44px;margin-inline-start:auto}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/app.js"></script>
</body>
