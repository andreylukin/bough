<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bough Control Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2382cb9b' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M12 21V9'/%3E%3Cpath d='M12 9c0-3 2-5 5-5 0 3-2 5-5 5z'/%3E%3Cpath d='M12 13c0-2.5-1.8-4.5-4.5-4.5 0 2.5 2 4.5 4.5 4.5z'/%3E%3C/svg%3E">
<style>
/* Tokens, all measured: the tightest text pair is text-3 on sel at
   5.08:1 against a 4.5:1 floor. line is decorative (1.61:1, deliberately
   faint); line-strong defines controls and clears 3:1 everywhere.
   One hue one meaning — accent is interactive, amber is "waiting for
   you", red is "failed"; resting states carry no colour. Dark by
   commitment, so every colour is painted, never inherited. */
:root {
  --bg:#0f1310; --surface:#191d1a; --raised:#222723; --sel:#242b25;
  --line:#343a35; --line-strong:#646b65;
  --text-1:#e3eae4; --text-2:#b1b8b2; --text-3:#939b94;
  --accent:#82cb9b; --amber:#eabc6e; --red:#ed756e;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--text-1);font:15px/1.5 var(--sans);
     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
::selection{background:color-mix(in srgb,var(--accent) 30%,var(--surface));color:var(--text-1)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:flex;height:100%}
.scroll{overflow-y:auto;min-height:0}

/* sidebar */
.sidebar{width:304px;flex-shrink:0;border-right:1px solid var(--line);background:var(--surface);
         display:flex;flex-direction:column}
.sidebar .scroll{flex:1 1 0%;min-height:0;padding-bottom:16px;position:relative}
/* .visually-hidden is absolute: without a positioned ancestor each one sat at its
   place deep in the transcript and stretched the document past the viewport. */
.transcript{position:relative}
/* The sidebar's first screen is for sessions: a 44px brand row, one row
   of view tabs, the search, then the queue. */
.brand{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;font-size:15px;font-weight:600;
       letter-spacing:-.01em}
.session-search{padding:0 16px 12px;flex-shrink:0}
/* Only the session list gives up height; the brand, tabs and search keep theirs. */
.brand,.nav,.sidebar-foot{flex-shrink:0}
.row-ask{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.group-count{margin-inline-start:6px;color:var(--text-3);font-weight:400}
.field-label{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font-size:12px;font-weight:500;color:var(--text-3);margin-bottom:6px}
.field{width:100%;font:13px var(--sans);color:var(--text-1);background:var(--raised);
       border:1px solid var(--line-strong);border-radius:7px;padding:8px 11px}
.field::placeholder{color:var(--text-3)}
.group-head{font:600 12px/16px var(--sans);color:var(--text-3);padding:0 16px 6px}
.row{display:flex;flex-direction:column;gap:2px;width:100%;text-align:start;padding:7px 16px;
     background:none;border:0;border-left:2px solid transparent;color:inherit;font:inherit;cursor:pointer}
.row-line{display:flex;align-items:center;gap:8px;min-width:0}
.row-line .num{margin-left:auto;font-size:12px;color:var(--text-3);flex-shrink:0}
.row-meta{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;color:var(--text-3)}
.row-meta .mono{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta .mono::before{content:"·";margin-inline-end:8px;color:var(--line-strong)}
.row:hover{background:var(--raised)}
.row-on{background:var(--sel);border-left-color:var(--accent)}
.row-title{font-size:14px;font-weight:500;color:var(--text-2);white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis;min-width:0}
.row-on .row-title{color:var(--text-1)}
.sidebar-foot{border-top:1px solid var(--line);padding:12px 20px}
.brand-new{margin-inline-start:auto;height:28px;padding:0 10px;font-size:12px}
.link{background:none;border:0;padding:0;color:var(--text-3);font:12px var(--sans);cursor:pointer}
.link:hover{color:var(--text-1)}

/* thread chrome */
.thread{flex-grow:1;display:flex;flex-direction:column;min-width:0;position:relative}
.thread.empty{align-items:center;justify-content:center;text-align:center;color:var(--text-3)}
.thread.empty h1{font-size:20px;font-weight:600;color:var(--text-2);margin:0 0 8px}
.thread.empty p{margin:0 auto 16px;max-width:46ch}
.thread-head{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 32px;
             border-bottom:1px solid var(--line)}
.head-main{display:flex;align-items:baseline;gap:14px;min-width:0;flex:1 1 320px}
.status{white-space:nowrap;flex-shrink:0}
.head-main h1{min-width:0}
.back{display:none;align-self:center;flex-shrink:0;width:32px;height:32px;margin-inline-start:-8px;
      align-items:center;justify-content:center;background:none;border:0;border-radius:6px;
      color:var(--text-2);cursor:pointer}
.back:hover{background:var(--raised);color:var(--text-1)}
.head-main h1{margin:0;font-size:19px;font-weight:600;line-height:1.2;letter-spacing:-.01em;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44ch}
.head-repo{font-size:13px;color:var(--text-3)}
.head-side{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px;flex:0 1 auto;max-width:100%;
           min-width:0}
.head-actions{display:flex;gap:12px}
/* Model stays in the header because it changes mid-session; project,
   thinking, rename and archive are rarer and live one click away. */
.head-extra{display:none;flex-basis:100%;justify-content:flex-end;flex-wrap:wrap;gap:12px}
.thread-head[data-more="1"] .head-extra{display:flex}
.thread-head>.more{order:1}
.thread-head>.head-extra{order:2}
.more{display:inline-flex;flex-shrink:0;width:32px;height:32px;align-items:center;justify-content:center;
      background:none;border:1px solid var(--line-strong);border-radius:6px;color:var(--text-2);cursor:pointer}
.more:hover{color:var(--text-1)}
.more[aria-expanded="true"]{background:var(--sel);color:var(--text-1)}

/* model + thinking selectors */
.controls{display:flex;gap:10px}
.ctl{display:flex;align-items:center;gap:7px}
.ctl-label{font-size:12px;color:var(--text-3)}
.ctl .sel{max-width:28ch}

/* Dropdowns. Never the OS menu: the @ picker's popover, anchored under
   a button that reads as a field, the current value checked. */
.sel{position:relative;display:inline-flex;min-width:0}
.sel-btn{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%;height:32px;
         padding:0 8px 0 10px;font:13px var(--sans);color:var(--text-2);background:var(--raised);
         border:1px solid var(--line-strong);border-radius:6px;cursor:pointer}
.sel-btn:hover,.sel-open .sel-btn{color:var(--text-1)}
.sel-open .sel-btn{border-color:var(--accent)}
.sel-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-placeholder{color:var(--text-3)}
.sel-chevron{flex-shrink:0;color:var(--text-3);transition:transform 120ms}
.sel-open .sel-chevron{transform:rotate(180deg)}
.sel-pop{position:absolute;top:calc(100% + 6px);z-index:40;min-width:max(100%,220px);width:max-content;
         max-width:min(380px,calc(100vw - 32px));display:flex;flex-direction:column;overflow:hidden;
         background:var(--raised);border:1px solid var(--line-strong);border-radius:10px;
         box-shadow:0 1px 2px rgb(0 0 0/.4),0 10px 28px rgb(0 0 0/.45)}
/* A searchable list keeps one width while it filters, instead of
   shrinking to whatever matches. */
.sel-pop:has(.sel-search){width:min(360px,calc(100vw - 32px))}
.sel-start{inset-inline-start:0}
.sel-end{inset-inline-end:0}
.sel-search{font:13px var(--sans);color:var(--text-1);background:var(--surface);border:none;
            border-bottom:1px solid var(--line);padding:10px 12px;width:100%}
.sel-search::placeholder{color:var(--text-3)}
.sel-search:focus{outline:none}
.sel-search:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sel-list{max-height:min(320px,50vh);overflow-y:auto;padding:4px}
.sel-group{padding:8px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--text-3)}
.sel-item{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 10px;text-align:start;
          font:13px var(--sans);color:var(--text-2);background:none;border:0;border-radius:6px;cursor:pointer}
.sel-on{background:var(--sel);color:var(--text-1);box-shadow:inset 2px 0 0 var(--accent)}
/* The header's controls are a toolbar, not a form: quiet at rest. */
@media (min-width:721px){
  .head-side .sel-btn,.head-side .btn{background:transparent;border-color:transparent}
  .head-side .sel-btn:hover,.head-side .btn:hover,.head-side .sel-open .sel-btn{background:var(--raised);border-color:var(--line-strong)}
}
/* A long prompt folds to four lines. */
.prompt-clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
/* An attached file is source: keep its indentation, scroll sideways. */
.prompt-file pre{white-space:pre;overflow-wrap:normal;overflow-x:auto;color:var(--text-2)}
.prompt-more{align-self:flex-start;font-size:12px}
.sel-item[aria-selected="true"]{color:var(--text-1)}
.sel-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-detail{margin-inline-start:auto;font-size:12px;color:var(--text-3)}
.sel-label+.sel-check{margin-inline-start:auto}
.sel-check{flex-shrink:0;color:var(--accent)}
.sel-empty{margin:0;padding:12px;font-size:13px;color:var(--text-3)}
@media (pointer:coarse){.sel-btn{height:44px}.sel-item{min-height:44px}}

/* turns */
/* One readable column, centred. A transcript set to the width of a
   wide window is a wall: the eye loses the line it is on between the
   right edge and the next line's start. 80ch is the measure asked for
   — wider than prose wants, which is right here, because most of this
   is commands and output rather than sentences. */
.transcript{flex-grow:1;padding:24px 32px 8px;display:flex;flex-direction:column;gap:28px}
.transcript>*{width:100%;max-width:80ch;margin-inline:auto}
.turn{display:flex;flex-direction:column;gap:14px}
.prompt{display:flex;align-items:baseline;gap:12px;max-width:78ch;min-width:0}
.prompt-mark{color:var(--accent);flex-shrink:0}
/* A pasted path or URL has no break opportunities; without these a long
   one pushed the whole prompt off the right edge of a phone. */
.prompt-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.prompt p{margin:0;font-size:16px;font-weight:500;text-wrap:pretty;white-space:pre-wrap;overflow-wrap:anywhere}
/* Skill bodies ride along with the prompt they were invoked from. They
   are context the agent read, not something you typed, so they fold. */
.prompt-skill>summary{padding:6px 12px}
.prompt-skill pre{margin:0;padding:10px 14px;max-height:240px;overflow:auto;font:12px/1.6 var(--mono);
                  color:var(--text-3);white-space:pre-wrap;overflow-wrap:anywhere}
.prompt-time{margin-left:auto;font-size:12px;color:var(--text-3);flex-shrink:0}
.turn-body{display:flex;flex-direction:column;gap:12px;padding-left:22px}
.turn-body>.block+.block{margin-top:-6px}
.turn-done{padding-left:22px;font-size:12px;color:var(--text-3)}
/* A turn ends with what it did and what it cost. */
.turn-foot{padding-left:22px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;
           font-size:12px;line-height:18px;color:var(--text-3)}
.turn-outcome{color:var(--text-2)}
.turn-failed{color:var(--red)}
.turn-files>summary{cursor:pointer;list-style:none;color:var(--text-2)}
.turn-files>summary::-webkit-details-marker{display:none}
.turn-files>summary::before{content:"›";margin-inline-end:6px;font-family:var(--mono)}
.turn-files[open]>summary::before{content:"⌄"}
.turn-files[open]{flex-basis:100%}
.turn-files ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.turn-files li{font-size:12px;color:var(--text-2);overflow-wrap:anywhere}
/* The session's budget, always in view, and unboxed. */
.runtime-strip{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;padding:6px 32px;
               border-bottom:1px solid var(--line);font-size:12px;line-height:16px}
.rt{display:inline-flex;align-items:center;gap:6px;min-width:0}
.rt-label{color:var(--text-3)}
.rt-value{color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-bar{width:64px;height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.rt-bar>span{display:block;height:100%;background:var(--accent)}
.rt-bar>.rt-hot{background:var(--amber)}
.rt-cache-hot .rt-value{color:var(--accent)}
.rt-cache-cold .rt-value{color:var(--text-2)}
.rt-jobs{position:relative}
.rt-jobs>summary{list-style:none;cursor:pointer;display:inline-flex;gap:6px}
.rt-jobs>summary::-webkit-details-marker{display:none}
.rt-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:20;margin:0;padding:6px 10px;list-style:none;min-width:260px;max-width:480px;
  background:var(--raised);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:4px}
.rt-pop li{display:flex;gap:12px;justify-content:space-between}
.rt-job-cmd{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-add{color:var(--accent)}
.rt-del{color:var(--red)}
.rt-pop li{align-items:center}
.rt-stop{height:24px;padding:0 8px;font-size:12px;flex-shrink:0}

.say{display:flex;flex-direction:column;gap:8px;max-width:78ch}
.say-who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text-2)}
.sub-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--text-3)}
.err{background:var(--surface);border-left:2px solid var(--red);border-radius:0 6px 6px 0;
     padding:10px 14px;color:var(--red);white-space:pre-wrap;font-size:14px;max-width:78ch}
.hk-notice{margin:3px 0 0;padding-inline-start:10px;font-size:12px;color:var(--text-3);
           border-inline-start:2px solid var(--line-strong);overflow-wrap:anywhere}
.hk-cut{color:var(--amber)}
.hook-line{margin:0 0 6px;font-size:12px;color:var(--text-3)}
.hook-act{color:var(--amber)}
.hook-bad{color:var(--red)}
.hook-why{color:var(--text-3)}
.meta-line{font-size:12px;color:var(--text-3);max-width:78ch}

/* collapsible code and results */
.block{background:var(--surface);border-radius:8px;overflow:hidden}
.block>summary{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;list-style:none}
/* .block clips its overflow, so an outside ring would be cut off. */
.block>summary:focus-visible{outline-offset:-2px}
.block>summary::-webkit-details-marker{display:none}
.block>summary::before{content:"›";color:var(--text-3);font-family:var(--mono);width:8px}
.block[open]>summary::before{content:"⌄"}
.block-label{font-size:13px;color:var(--text-2);flex-shrink:0}
.block-detail{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-lines{margin-left:auto;font-size:12px;color:var(--text-3);flex-shrink:0}
.block pre{margin:0;padding:12px 14px;border-top:1px solid var(--line);font:13px/1.6 var(--mono);
           color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere;
           padding-inline-start:26px;text-indent:-12px}
/* thinking is prose, not a program: sans, wrapped, and a measure that
   does not run the full width of a wide window */
.block-failed .block-label{color:var(--red)}
/* The copy control rides the block's own header row, on the trailing
   edge, so it is there whether the block is open or shut without
   costing a row of its own. Quiet until wanted, but always in the DOM
   and always reachable by keyboard: a control that appears only on
   hover does not exist on a touchscreen. */
.copy-btn{display:grid;place-items:center;width:24px;height:24px;flex-shrink:0;
          color:var(--text-3);background:none;border:0;border-radius:6px;padding:0;
          cursor:pointer;opacity:.45;
          transition-property:opacity,color,background-color;transition-duration:120ms}
.block-lines+.copy-btn{margin-inline-start:8px}
/* With no line count to follow, the button takes the trailing edge. */
.block-detail+.copy-btn{margin-inline-start:auto}
.block:hover .copy-btn,.copy-btn:focus-visible{opacity:1}
.copy-btn:hover{color:var(--text-1);background:var(--raised)}
.copy-done{opacity:1;color:var(--accent)}
@media (hover:none){.copy-btn{opacity:1}}
@media (prefers-reduced-motion:reduce){.copy-btn{transition:none}}

/* the composer's / and @ pickers, docked above the box */
.composer{position:relative}
/* A popover, not a second transcript: capped width, eight rows tall,
   name first and folder dimmed, the keys it answers to in the foot. */
.mention{position:absolute;inset-block-end:calc(100% + 8px);inset-inline-start:0;z-index:30;
         width:min(560px,100%);display:flex;flex-direction:column;overflow:hidden;
         background:var(--raised);border:1px solid var(--line-strong);border-radius:10px;
         box-shadow:0 1px 2px rgb(0 0 0/.4),0 10px 28px rgb(0 0 0/.45)}
.mention-list{max-height:min(304px,44vh);overflow-y:auto;padding:4px}
.mention-item{display:flex;align-items:center;gap:10px;width:100%;text-align:start;
              background:none;border:none;border-radius:6px;padding:0 10px;cursor:pointer;
              font:inherit;min-height:36px;color:var(--text-2)}
.mention-on{background:var(--sel);color:var(--text-1);box-shadow:inset 2px 0 0 var(--accent)}
.mention-glyph{flex-shrink:0;color:var(--text-3)}
.mention-on .mention-glyph{color:var(--accent)}
.mention-name{font-size:14px;color:var(--text-1);flex-shrink:0;max-width:60%;
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mention-dir{font-size:12px;color:var(--text-3);min-width:0;overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:start}
.mention-hint{font-size:12px;color:var(--text-3);min-width:0;overflow:hidden;
              text-overflow:ellipsis;white-space:nowrap}
.mention-foot{display:flex;gap:14px;padding:7px 12px;border-top:1px solid var(--line);
              font-size:12px;color:var(--text-3)}
.mention-foot kbd{font:11px var(--mono);color:var(--text-2);background:var(--surface);
                  border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-inline-end:3px}
@media (pointer:coarse){.mention-item{min-height:44px}.mention-foot{display:none}}

/* ⌘K quick access */
.pal-scrim{position:fixed;inset:0;background:rgb(0 0 0/.55);z-index:60}
.pal{position:fixed;z-index:61;inset-block-start:12vh;inset-inline:0;margin-inline:auto;
     width:min(620px,calc(100vw - 32px));background:var(--raised);
     border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;
     box-shadow:0 2px 4px rgb(0 0 0/.4),0 18px 48px rgb(0 0 0/.5);
     display:flex;flex-direction:column;max-height:70vh}
.pal-field{font:15px var(--sans);color:var(--text-1);background:var(--surface);border:none;
           border-bottom:1px solid var(--line);padding:14px 16px;width:100%}
.pal-field::placeholder{color:var(--text-3)}
.pal-field:focus{outline:none}
/* Search fields inside a popover still show where the keyboard is. */
.pal-field:focus-visible,.skills-filter:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pal-list{overflow-y:auto;padding:6px}
.pal-group{margin:8px 0 3px;padding-inline-start:10px;font:600 11px var(--mono);
           letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.pal-item{display:flex;align-items:baseline;gap:10px;width:100%;text-align:start;
          background:none;border:none;border-radius:7px;padding:8px 10px;cursor:pointer;
          font:inherit;min-height:32px}
.pal-on{background:var(--sel);box-shadow:inset 2px 0 0 var(--accent)}
.pal-label{font-size:13.5px;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap;flex:1}
.pal-on .pal-label{color:var(--accent)}
.pal-hint{font-size:12px;color:var(--text-3);min-width:0;max-width:56%;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
          font-family:var(--mono)}
.pal-none{margin:0;padding:16px 12px;font-size:13px;color:var(--text-3)}
/* the shortcut says it exists; a palette nobody finds is not a feature */
.pal-key{margin-inline-start:auto;font:600 10.5px var(--mono);color:var(--text-3);
         border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px}
@media (max-width:720px){.pal{inset-block-start:6vh;max-height:80vh}}

/* picking repos for one project */
.rp-pick{cursor:pointer;min-height:24px}
.rp-pick input{width:16px;height:16px;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.rp-bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:end;gap:10px 14px;
        margin-top:12px;padding:12px 0 4px;border-top:1px solid var(--line-strong);
        background:var(--bg)}
.rp-name{display:flex;flex-direction:column;gap:4px;min-width:min(260px,100%)}
.rp-name .field{margin:0}

/* The Hooks page: many small things, each with a state. Rows share one
   grid so the eye runs down a column instead of re-reading each row's
   layout, and everything secondary is folded away until asked for. */
.hk2-row{padding:9px 0;border-top:1px solid var(--line)}
.hk2-row:first-of-type{border-top:0}
.hk2-line{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.hk2-name{font-size:13.5px;color:var(--text-1);font-weight:500;overflow-wrap:anywhere}
.hk2-off .hk2-name{color:var(--text-3);text-decoration:line-through}
.hk2-facts{font-size:12px;color:var(--text-3);min-width:0;overflow-wrap:anywhere}
.hk2-globs{display:block;margin-top:2px;font-size:12px;color:var(--text-3)}
.hk2-actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}

/* State is a word, never a colour alone. */
.hk2-state{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
           padding:2px 6px;border-radius:4px;flex-shrink:0}
.hk2-ok{color:var(--accent);background:color-mix(in oklab,var(--accent) 14%,transparent)}
.hk2-bad{color:var(--red);background:color-mix(in oklab,var(--red) 16%,transparent)}
.hk2-warn{color:var(--amber);background:color-mix(in oklab,var(--amber) 16%,transparent)}
.hk2-tag{font-size:11px;color:var(--text-3);border:1px solid var(--line-strong);
         border-radius:999px;padding:1px 7px;flex-shrink:0}
.hk2-alert{margin:5px 0 0;padding-inline-start:9px;border-inline-start:2px solid var(--red);
           font-size:12px;color:var(--red);overflow-wrap:anywhere}
.hk2-note{margin:0 0 4px;font-size:12px;color:var(--text-3)}
.hk2-path{margin:0 0 6px;font-size:11.5px;color:var(--text-3);overflow-wrap:anywhere}
.hk2-more>summary{font-size:12px;color:var(--text-3);cursor:pointer;padding:4px 0;
                  list-style:none;min-height:24px;display:flex;align-items:center;gap:6px}
.hk2-more>summary::-webkit-details-marker{display:none}
.hk2-more>summary::before{content:"\203a";font-family:var(--mono)}
.hk2-more[open]>summary::before{content:"\2304"}
.hk2-more-body{padding-inline-start:14px}
.hk2-gives{margin:0;padding-inline-start:16px;columns:2;column-gap:24px}
.hk2-gives li{margin:2px 0;break-inside:avoid}
.hk2-give{font-size:12.5px;color:var(--text-2)}

/* The page header: what needs attention, before any list. */
.hk2-sum{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;
         padding:0 0 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.hk2-sum-n{font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.hk2-sum-lab{font-size:12px;color:var(--text-3)}
@media (max-width:720px){
  .hk2-actions{margin-inline-start:0;width:100%}
  .hk2-gives{columns:1}
}

/* syntax colours — drawn from the app's own palette rather than a stock
   highlight.js theme, so code sits in the interface instead of on it.
   Hue carries meaning: green is the accent already used for "the agent",
   amber for literal values, red for anything destructive-looking. */
.hl{white-space:pre-wrap;overflow-wrap:anywhere}
.tool-output{border-top:1px solid var(--line)}
.block .tool-output pre.hl{white-space:pre;overflow-wrap:normal;overflow-x:auto;border-top:0;
                           text-indent:0;padding:12px 14px}
.hljs-comment,.hljs-quote{color:var(--text-3);font-style:italic}
.hljs-string,.hljs-regexp,.hljs-meta-string{color:var(--amber)}
.hljs-number,.hljs-literal,.hljs-boolean{color:#cfa6e0}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in{color:var(--accent)}
.hljs-title,.hljs-title.function_,.hljs-section{color:#9ec9f0}
.hljs-attr,.hljs-attribute,.hljs-property{color:#e0c98a}
.hljs-variable,.hljs-template-variable,.hljs-params{color:var(--text-1)}
.hljs-type,.hljs-class .hljs-title{color:#8fd6c4}
.hljs-symbol,.hljs-bullet,.hljs-link{color:var(--accent)}
.hljs-deletion{color:var(--red)}
.hljs-addition{color:var(--accent)}
.hljs-emphasis{font-style:italic}
.hljs-strong{font-weight:600}

/* a block's contents, and the call folded one layer inside it */
.block-body{border-top:1px solid var(--line)}
.block-inner{border-top:1px solid var(--line);background:var(--bg)}
.block-inner>summary{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;
                     list-style:none;font-size:12px}
.block-inner>summary::-webkit-details-marker{display:none}
.block-inner>summary::before{content:"\203a";color:var(--text-3);font-family:var(--mono);width:8px}
.block-inner[open]>summary::before{content:"\2304"}
.block-inner>summary .block-label{font-size:12px;color:var(--text-3)}
.block-inner pre{border-top:1px solid var(--line)}
/* Collapse in levels: a run of tool calls is one row; opened, it lists
   the calls, and each call opens onto its output. */
.toolrun-body{display:flex;flex-direction:column;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--bg)}
.toolrun-failed{margin-left:auto;font-size:12px;color:var(--red);flex-shrink:0}
/* A call's recorded exit and duration lead its metadata; the line count follows. */
.tool-meta{margin-left:auto;font-size:12px;color:var(--text-3);flex-shrink:0;white-space:nowrap}
.tool-meta+.block-lines{margin-left:0}
.tool-meta-failed{color:var(--red);font-weight:600}
/* Hooks and rules fire on every call: one quiet row per turn, the ledger inside. */
.turn-hooks{background:none;border:1px solid var(--line)}
.turn-hooks>summary{padding:5px 12px}
.turn-hooks>summary .block-label,.turn-hooks>summary .block-detail{font-size:12px;color:var(--text-3)}
.turn-hooks-body{padding:8px 12px 4px;border-top:1px solid var(--line)}
.turn-hooks-body .hook-line{margin:0 0 6px;overflow-wrap:anywhere}
.thinking pre{color:var(--text-3);font:13px/1.65 var(--sans);white-space:pre-wrap;
              text-indent:0;padding-inline-start:14px;max-width:78ch}
.think-body{padding:2px 14px 12px;max-width:78ch}
.think-body .md{color:var(--text-3);font-size:13px}
.think-body .md pre{background:var(--bg)}
.thinking .block-detail{font-style:italic}
/* Reasoning is not execution: no filled card, so tool calls carry the weight. */
.block.thinking{background:none;border:1px solid var(--line)}

/* markdown inside a reply */
.md{color:var(--text-2)}
.say .md{color:var(--text-1)}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md p{margin:0 0 12px;text-wrap:pretty}
.md h1,.md h2,.md h3,.md h4{color:var(--text-1);line-height:1.25;margin:18px 0 8px;text-wrap:balance}
.md h1{font-size:19px}.md h2{font-size:17px}.md h3{font-size:15px}.md h4{font-size:14px}
.md ul,.md ol{margin:0 0 12px;padding-inline-start:22px}
.md li{margin:4px 0}
.md li::marker{color:var(--text-3)}
.md code{font:13px var(--mono);background:var(--raised);border-radius:4px;padding:1px 5px;color:var(--text-1)}
.md pre{background:var(--surface);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.md pre code{background:none;padding:0;font-size:13px;line-height:1.6}
.md a{color:var(--accent)}
.md a:hover{color:var(--text-1)}
.md blockquote{margin:0 0 12px;padding-inline-start:14px;border-inline-start:2px solid var(--line-strong);
               color:var(--text-3)}
.md table{border-collapse:collapse;margin:0 0 12px;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:start}
.md th{color:var(--text-1);font-weight:600}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}

.ask{background:var(--raised);border-inline-start:3px solid var(--amber);border-radius:0 8px 8px 0;
     scroll-margin-block:16px;padding:16px 18px;display:flex;flex-direction:column;
     gap:12px;max-width:78ch}
.ask-q{margin:0;font-size:15px;font-weight:500;color:var(--text-1)}

/* composer */
/* The composer shares the transcript's 80ch column, so what you type
   lines up with what you are reading. */
.composer-wrap{flex-shrink:0;padding:8px 32px 24px}
.composer-wrap>*{width:100%;max-width:80ch;margin-inline:auto}
.composer{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:12px 16px;
          display:flex;flex-direction:column;gap:10px}
/* It already grows to its text, so a drag grip is only noise. */
.composer textarea{width:100%;resize:none;background:none;border:0;color:var(--text-1);
                   font:15px/1.5 var(--sans);max-height:34vh;overflow-y:auto}
.composer:focus-within{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:2px}
/* A question further up is easy to lose once the turn scrolls on. */
.ask-bar{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:8px 8px 8px 14px;
         background:var(--raised);border-inline-start:3px solid var(--amber);border-radius:0 8px 8px 0}
.ask-bar p{margin:0;flex:1;min-width:0;font-size:13px;color:var(--text-2);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-bar strong{color:var(--amber);font-weight:600}
.composer textarea:focus{outline:none}
.composer textarea::placeholder{color:var(--text-3)}
.hint{font-size:12px;color:var(--text-3)}
.composer:not(:focus-within) .hint{visibility:hidden}
.row-jobs{color:var(--accent)}
.btn{font:13px var(--sans);color:var(--text-2);background:none;border:1px solid var(--line-strong);
     border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{color:var(--text-1)}
.btn-primary{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:500}
.btn-primary:hover{color:var(--bg);filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
/* A half-faded accent still reads as "press me"; an empty Send is not. */
.btn-primary:disabled{background:var(--raised);color:var(--text-3);border-color:var(--line);opacity:1;filter:none}
/* Fingers are not cursors: the icon buttons get a full touch target. */
@media (pointer:coarse){.back,.thread-head>.more,.copy-btn{min-width:44px;min-height:44px}}
.toast{position:fixed;right:20px;bottom:20px;max-width:46ch;background:var(--raised);
       border:1px solid var(--red);color:var(--text-1);border-radius:8px;padding:10px 14px;font-size:13px}

/* view switcher */
.nav{display:flex;gap:4px;padding:0 12px 10px}
.nav-item{display:inline-flex;align-items:center;height:32px;font:13px var(--sans);color:var(--text-2);
          background:none;border:0;border-radius:6px;padding:0 10px;cursor:pointer}
.nav-item:hover{background:var(--raised);color:var(--text-1)}
.nav-on{background:var(--sel);color:var(--text-1);font-weight:500}

/* projects */
.proj-body{flex-grow:1;padding:24px 32px;display:flex;flex-direction:column;gap:32px}
.proj{display:flex;flex-direction:column;gap:2px}
.proj-head{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;margin-bottom:6px;
           border-bottom:1px solid var(--line)}
.proj-head h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.proj-count{font-size:12px;color:var(--text-3);margin-right:auto}
.proj-none{margin:6px 0 0;font-size:13px;color:var(--text-3)}
.proj-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.proj-row:last-child{border-bottom:0}
.proj-open{flex:1 1 auto;min-width:0;text-align:start;font:15px var(--sans);color:var(--text-1);
           background:none;border:0;padding:0;cursor:pointer;white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis}
.proj-open:hover{color:var(--accent)}
.proj-when{font-size:12px;color:var(--text-3);flex-shrink:0}
.proj-move .sel-btn{height:28px;font-size:12px;max-width:20ch}
.proj-empty{max-width:56ch;color:var(--text-3)}
.proj-empty-title{margin:0 0 6px;font-size:16px;font-weight:600;color:var(--text-2)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* Dialogs: asked in the page's own voice, not the browser's grey sheet. */
.dlg-scrim{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgb(0 0 0/.55)}
.dlg{width:min(420px,100%);display:flex;flex-direction:column;gap:14px;padding:20px;
     background:var(--raised);border:1px solid var(--line-strong);border-radius:12px;
     box-shadow:0 1px 2px rgb(0 0 0/.4),0 16px 40px rgb(0 0 0/.5)}
.dlg-title{margin:0;font-size:16px;font-weight:600;line-height:1.3;color:var(--text-1)}
.dlg-body{margin:0;font-size:14px;line-height:1.5;color:var(--text-2)}
.dlg-input{font-size:14px;padding:9px 11px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}
.dlg-actions .btn{min-height:32px;padding:0 14px}
.btn-danger{color:var(--bg);background:var(--red);border-color:var(--red);font-weight:500}
.btn-danger:hover{color:var(--bg);filter:brightness(1.08)}
/* Checkboxes drawn in tokens: the OS box is a white square on a forest page. */
input[type="checkbox"]{appearance:none;flex-shrink:0;display:inline-grid;place-content:center;width:16px;height:16px;
                       margin:0;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);cursor:pointer}
input[type="checkbox"]::before{content:"";width:10px;height:10px;background:var(--bg);transform:scale(0);
                               transition:transform 100ms;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0,43% 62%)}
input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
input[type="checkbox"]:checked::before{transform:scale(1)}
@media (max-width:720px){.dlg-input{font-size:16px}}
/* skills picker */
.skills-anchor{position:relative}
.skills-scrim{position:fixed;inset:0;z-index:20}
.skills-pop{position:absolute;bottom:calc(100% + 8px);inset-inline-end:0;z-index:21;
            width:min(420px,calc(100vw - 32px));background:var(--raised);
            border:1px solid var(--line-strong);border-radius:10px;
            box-shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px rgb(0 0 0/.45);
            display:flex;flex-direction:column;overflow:hidden}
.skills-filter{font:13px var(--sans);color:var(--text-1);background:var(--surface);
               border:none;border-bottom:1px solid var(--line);padding:10px 12px;width:100%}
.skills-filter::placeholder{color:var(--text-3)}
.skills-list{overflow-y:auto;max-height:min(320px,50vh);padding:5px}
.skill{display:block;width:100%;text-align:start;background:none;border:none;
       border-radius:6px;padding:7px 9px;cursor:pointer;font:inherit}
.skill-on{background:var(--sel);box-shadow:inset 2px 0 0 var(--accent)}
.skill-name{display:block;font-size:13px;color:var(--text-1)}
.skill-on .skill-name{color:var(--accent)}
.skill-sum{display:block;font-size:12px;color:var(--text-3);line-height:1.45;margin-top:2px;
           overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.skills-empty{margin:0;padding:14px 12px;font-size:13px;color:var(--text-3);line-height:1.5}
/* Middling windows: the sidebar gives up width before the thread does. */
@media (max-width:1100px){
  .sidebar{width:256px}
  .transcript,.thread-head,.proj-body{padding-inline:24px}
  .composer-wrap{padding-inline:24px}
}
/* A phone shows one pane: the list, or the thread with a way back. The
   sidebar is not a drawer over the thread — nothing here is glanceable
   enough to justify hiding the list behind a hamburger. */
@media (max-width:720px){
  .app[data-pane="list"] .thread{display:none}
  .app[data-pane="thread"] .sidebar{display:none}
  .sidebar{width:100%;border-right:0}
  .back{display:inline-flex}
  .thread-head{padding:10px 12px 10px 8px;gap:10px 8px;align-items:center}
  .head-main{flex:1 1 0;min-width:0;gap:10px;align-items:center}
  .head-main h1{font-size:17px;flex:0 1 auto}
  .head-repo{display:none}
  .thread-head>.more{width:36px;height:36px;order:0}
  .thread-head[data-more="0"] .head-side{display:none}
  .head-side{margin-left:0;flex-basis:100%;flex-direction:column;align-items:stretch;gap:10px}
  .head-extra{flex-direction:column;align-items:stretch;gap:10px}
  /* Under 16px iOS zooms the page on focus. */
  .field,.sel-btn,.sel-search,.composer textarea{font-size:16px}
  .controls{flex-direction:column;gap:8px}
  .ctl{gap:10px}
  .ctl-label{width:64px;flex-shrink:0}
  .ctl .sel{flex:1 1 0;min-width:0;max-width:none}
  .ctl .sel-btn{width:100%;justify-content:space-between;height:44px}
  /* Four rows, so the picker still clears a phone's keyboard. */
  .mention-list{max-height:184px}
  .mention-item{min-height:44px}
  .mention-foot,.hint{display:none}
  .head-actions{gap:8px}
  .transcript{padding:16px 16px 8px;gap:24px}
  .turn-body{padding-left:0}
  .turn-done{padding-left:0}
  .turn-foot{padding-left:0}
  .runtime-strip{padding:6px 16px;gap:4px 14px}
  .composer-wrap{padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
  /* The clock goes under the prompt rather than holding a column of its own. */
  .prompt{display:grid;grid-template-columns:10px minmax(0,1fr);gap:4px 10px}
  .prompt-text,.prompt-time{grid-column:2}
  .prompt-time{margin-left:0}
  .composer{padding:10px 12px}
  .hint+.hint{display:none}
  .toast{left:16px;right:16px;bottom:16px;max-width:none}
  .proj-body{padding:16px}
  .proj-row{flex-wrap:wrap;gap:8px 14px}
  .proj-open{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* hooks: watchers, installed hooks, recent fires. The sections reuse the
   projects chrome; only the row internals are new. State is never colour
   alone — every red or amber mark carries the word beside it. */
.hk-row{flex-direction:column;align-items:stretch;gap:8px}
.hk-main{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-width:0}
.hk-name{font-size:13px;color:var(--text-1);overflow-wrap:anywhere}
.hk-when{font-size:12px;color:var(--text-3)}
.hk-time{flex:0 0 11ch}
.hk-tag{font-size:11px;color:var(--text-2);border:1px solid var(--line-strong);border-radius:999px;
        padding:1px 8px}
.hk-state{font-size:12px;font-weight:500}
.hk-ok{color:var(--text-3)}
.hk-bad{color:var(--red)}
.hk-shadow{color:var(--amber)}
.hk-why{font-size:13px;margin:0}
.hk-event{display:flex;flex-direction:column;gap:2px;padding-top:10px}
.hk-event-name{margin:0;font-size:12px;font-weight:500;color:var(--text-3)}
.hk-toggle{align-self:flex-start;min-height:28px;font:12px var(--sans);color:var(--text-3);
           background:none;border:0;padding:4px 0;cursor:pointer}
.hk-toggle:hover{color:var(--text-1)}
.hk-panel{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.hk-panel[hidden]{display:none}
.hk-path{margin:0;font-size:12px;color:var(--text-3);overflow-wrap:anywhere}
.hk-edit{width:100%;background:var(--surface);color:var(--text-1);border:1px solid var(--line-strong);
         border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;resize:vertical}
.hk-acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hk-acts .btn{min-height:28px}
.hk-note{font-size:12px;color:var(--text-3)}
@media (max-width:720px){
  .hk-time{flex-basis:auto}
  .hk-main{gap:4px 10px}
}
/* rules, plugins and the per-session context panel. Everything listed
   is on until someone turns it off, so the control says "Turn off" at
   rest; an item that is off stays in the list, carries the word "Off",
   and offers the way back — dimming alone would leave no way to find
   it again. */
.hk-offbtn{min-height:32px;flex-shrink:0;font:12px var(--sans);color:var(--text-2);background:none;
           border:1px solid var(--line-strong);border-radius:6px;padding:6px 12px;cursor:pointer}
.hk-offbtn:hover{color:var(--text-1)}
.hk-offbtn:disabled{opacity:.5;cursor:default}
.hk-act{margin-inline-start:auto}
.hk-is-off{opacity:.75}
.hk-offword{color:var(--amber)}
.hk-globs{margin:0;font-size:12px;color:var(--text-3);overflow-wrap:anywhere}
.hk-summary{margin:0;max-width:78ch}
.hk-gives{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 16px}
.hk-give-name{font-size:12px;color:var(--text-2)}
.ctx-lede{margin:0;max-width:70ch;font-size:13px;color:var(--text-3)}
@media (max-width:720px){
  .hk-act{margin-inline-start:0}
}

/* A turn that is still running says so where the next words will land.
   The mark turns because the session is running — the status is the
   only clock. Under prefers-reduced-motion the blanket rule above
   freezes every animation here, which is why each one is legible at
   rest: a gapped ring, three dots, a solid block. Motion is never the
   only thing carrying the state; the word beside it always is. */
@keyframes bough-spin{to{transform:rotate(360deg)}}
.spin-mark{transform-origin:50% 50%;animation:bough-spin 1.05s linear infinite}
.working{display:flex;align-items:center;gap:8px;margin:2px 0 0;font-size:13px;color:var(--text-2)}
.working-dots{display:inline-flex;gap:3px}
.working-dots i{width:3px;height:3px;border-radius:50%;background:var(--text-3);
                animation:bough-pulse 1.2s ease-in-out infinite}
.working-dots i:nth-child(2){animation-delay:.16s}
.working-dots i:nth-child(3){animation-delay:.32s}
@keyframes bough-pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* Text that has not been recorded yet. It is deliberately not styled
   as a different kind of thing — it is the same reply, a second early
   — so the only mark is a caret at the end, which vanishes when the
   recorded entry replaces it. */
@keyframes bough-blink{50%{opacity:.25}}
/* The caret has to sit at the end of the last line of prose, so it is
   drawn by that line rather than placed beside the block — a sibling
   element would drop to a row of its own under the flex column. */
.stream-tip .md>:last-child::after{
  content:"";display:inline-block;width:7px;height:.95em;vertical-align:-2px;margin-inline-start:3px;
  background:var(--accent);animation:bough-blink 1s steps(1,end) infinite}
.stream-think{padding-bottom:4px}
.stream-think-head{display:flex;align-items:center;gap:10px;padding:9px 14px 4px}
.stream-think-head .block-label{font-style:italic}

/* Subagents. A subagent's code and results used to be dealt straight
   into the parent's turn, which read as one agent doing two things at
   once. The rail and the indent say "someone else did this", and one
   card per worker keeps a run of interleaved steps as one thing that
   happened. */
.subrun{display:flex;flex-direction:column;gap:8px;padding-inline-start:14px;
        border-inline-start:2px solid var(--line-strong)}
.sub{background:var(--surface);border-radius:8px;overflow:hidden}
.sub>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;cursor:pointer;
             list-style:none;min-height:36px}
.sub>summary::-webkit-details-marker{display:none}
.sub>summary::before{content:"\203a";color:var(--text-3);font-family:var(--mono);width:8px;flex-shrink:0}
.sub[open]>summary::before{content:"\2304"}
.sub-tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);
         border:1px solid var(--line-strong);border-radius:999px;padding:1px 8px;flex-shrink:0}
.sub-task{font-size:13px;color:var(--text-3);min-width:0;flex:1 1 16ch;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-state{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3);flex-shrink:0}
.sub-failed .sub-state{color:var(--red)}
.sub-failed .sub-tag{border-color:var(--red);color:var(--red)}
.sub-live .sub-state{color:var(--text-2)}
.sub-steps{font-size:12px;color:var(--text-3);flex-shrink:0}
.sub-body{display:flex;flex-direction:column;gap:10px;padding:10px 14px 14px;
          border-top:1px solid var(--line)}
.sub-body .say{gap:6px}
@media (max-width:720px){
  .subrun{padding-inline-start:10px}
  .sub-task{flex-basis:100%;order:3}
}

/* The wiki. A claim and its evidence are one grid row, so the note sits
   beside the sentence it supports rather than at the foot of the page;
   under 1200px the column folds and the marker's tooltip carries the
   same excerpt. Unsupported is red and superseded amber — the two
   failures never look alike, and each always carries its word. */
.nav-count{margin-inline-start:6px;font:11px var(--mono);color:var(--amber);font-variant-numeric:tabular-nums}
.wk-health{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;padding-bottom:14px;
           border-bottom:1px solid var(--line)}
.wk-hpart{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 9px}
.wk-facts{font-size:12px;color:var(--text-3)}
.wk-link{font:12px var(--sans);color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-align:start}
.wk-link:hover{color:var(--text-1)}
.wk-link.mono{font-family:var(--mono);font-size:13px}
.wk-check pre{margin:0}
.wk-row{display:flex;align-items:center;gap:14px;width:100%;padding:9px 0;border:0;border-bottom:1px solid var(--line);
        background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.wk-row:last-child{border-bottom:0}
.wk-row:hover .wk-title{color:var(--accent)}
.wk-row-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.wk-title-line{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.wk-title{font:15px var(--sans);color:var(--text-1)}
.wk-sum{font-size:12px;color:var(--text-3);margin-top:2px}
.wk-counts{font:12px var(--mono);color:var(--text-3);flex-shrink:0;font-variant-numeric:tabular-nums}
.wk-date{font-size:12px;color:var(--text-3);flex-shrink:0}
.wk-foot{margin:0;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}
.wk-crumb{flex-wrap:wrap}
.wk-crumb-link{font:13px var(--sans);color:var(--text-3);background:none;border:0;padding:0;cursor:pointer}
.wk-crumb-link:hover{color:var(--text-1)}
.wk-crumb-static{cursor:default}
.wk-crumb-static:hover{color:var(--text-3)}
.wk-sep{color:var(--line-strong)}
.wk-split{flex-grow:1;display:flex;min-height:0}
.wk-doc{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:18px;padding:28px 32px}
.wk-split[data-source="1"] .wk-doc{flex:0 0 min(536px,45%);border-right:1px solid var(--line);padding:24px}
.wk-claim{display:grid;grid-template-columns:minmax(0,65ch) 260px;gap:0 28px;align-items:start}
.wk-split[data-source="1"] .wk-claim{grid-template-columns:minmax(0,1fr)}
.wk-split[data-source="1"] .wk-note{display:none}
.wk-text{color:var(--text-2);line-height:1.6;text-wrap:pretty}
.wk-text .md,.wk-text .md>p{display:inline;margin:0}
.wk-lede{font-size:16px;color:var(--text-1)}
.wk-bullet{position:relative;padding-inline-start:16px}
.wk-bullet::before{content:"";position:absolute;inset-inline-start:3px;top:.72em;width:4px;height:4px;
                   border-radius:50%;background:var(--text-3)}
.wk-h{margin:6px 0 0;font-size:17px;font-weight:600;line-height:1.25;color:var(--text-1)}
.wk-cite{font:11.5px var(--mono);color:var(--text-3);background:none;border:1px solid var(--line-strong);
         border-radius:4px;padding:0 5px;margin-inline-start:6px;vertical-align:1px;white-space:nowrap;cursor:pointer}
.wk-cite:hover{color:var(--text-1)}
.wk-cite-on,.wk-cite-on:hover{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.wk-cite-bad{color:var(--red);border-color:var(--red)}
.wk-need{font:11.5px var(--mono);color:var(--red);border:1px solid var(--red);border-radius:4px;
         padding:0 5px;margin-inline-start:6px;vertical-align:1px;white-space:nowrap}
.wk-inferred{border-inline-start:2px solid var(--line);padding-inline-start:12px;margin-inline-start:-14px}
.wk-infer-label{font:11.5px var(--mono);color:var(--text-3);margin-inline-end:7px}
.wk-struck .md{text-decoration:line-through;color:var(--text-3)}
.wk-super{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-top:6px;padding-inline-start:12px;
          border-inline-start:2px solid var(--amber)}
.wk-super-word{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--amber);flex-shrink:0}
.wk-note{font-size:12px;line-height:1.5;color:var(--text-3);border-inline-start:2px solid var(--line-strong);
         padding-inline-start:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.wk-note-bad{border-inline-start-color:var(--red);color:var(--red)}
.wk-note-src{display:block;margin-bottom:3px;font-family:var(--mono);color:var(--text-2)}
.wk-links .md ul{margin:0;padding-inline-start:18px}
.wk-pagefoot{margin-top:10px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3);max-width:65ch}
.wk-history{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.wk-history p{margin:0}
.wk-src{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--surface)}
.wk-src-head{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.wk-src-title{font-size:14px;font-weight:500;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-src-meta{margin-top:2px;font:11.5px var(--mono);color:var(--text-3)}
.wk-x{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:0;background:none;
      color:var(--text-3);cursor:pointer}
.wk-x:hover{background:var(--raised);color:var(--text-1)}
.wk-ent{display:flex;align-items:baseline;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line)}
.wk-ent-on{background:var(--sel);border-inline-start:2px solid var(--accent);padding-inline-start:14px}
.wk-ent-seq{flex-shrink:0;width:5ch;text-align:end;font:11.5px var(--mono);color:var(--text-3)}
.wk-ent-kind{flex-shrink:0;width:9ch;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.wk-ent-on .wk-ent-seq,.wk-ent-on .wk-ent-kind{color:var(--accent)}
.wk-ent-text{min-width:0;font-size:13px;line-height:1.55;color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
.wk-ent-on .wk-ent-text{color:var(--text-1)}
.wk-src-foot{flex-shrink:0;padding:10px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}
.wk-filters{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.wk-filter{min-height:24px;font:11px var(--sans);color:var(--text-3);background:none;border:1px solid var(--line-strong);
           border-radius:999px;padding:2px 9px;cursor:pointer}
.wk-filter[aria-pressed="true"]{color:var(--text-1);background:var(--sel)}
.wk-item{display:flex;flex-direction:column;gap:9px;padding:16px 0;border-bottom:1px solid var(--line)}
.wk-item:last-child{border-bottom:0}
.wk-where{margin-inline-start:auto;font:12px var(--mono);color:var(--text-3);background:none;border:0;padding:0;cursor:pointer}
.wk-where:hover{color:var(--text-1)}
.wk-item-claim{max-width:78ch;font-size:15px;color:var(--text-1)}
.wk-item-claim .md>p{margin:0}
.wk-ev{margin:0;max-width:78ch;padding:12px 14px;background:var(--surface);border-radius:8px;
       font:13px/1.6 var(--mono);color:var(--text-3);white-space:pre-wrap;overflow-wrap:anywhere}
.wk-ev-bad{color:var(--red)}
.wk-acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.wk-tag{flex-shrink:0;font-size:11px;color:var(--text-3);border:1px solid var(--line-strong);border-radius:999px;padding:1px 7px}
.wk-list{display:flex;flex-direction:column;gap:10px}
.wk-run{background:var(--surface);border-radius:8px;overflow:hidden}
.wk-run-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 14px}
.wk-run-when{flex-shrink:0;min-width:6ch;font:12px var(--mono);color:var(--text-3)}
.wk-run-what{flex:1 1 20ch;min-width:0;font-size:13px;color:var(--text-2);overflow-wrap:anywhere}
.wk-run-meta{margin-inline-start:auto;flex-shrink:0;font:12px var(--mono);color:var(--text-3)}
.wk-diff{margin:0;padding:12px 14px;list-style:none;border-top:1px solid var(--line);font:13px/1.6 var(--mono);
         display:flex;flex-direction:column;gap:2px}
.wk-add{color:var(--accent)}
.wk-mod{color:var(--amber)}
.wk-quiet{display:flex;align-items:center;gap:10px;padding:2px 14px;font-size:12px;color:var(--text-3)}
.wk-quiet::before{content:"\203a";font-family:var(--mono)}
.pal-ev{display:block;margin:0 10px 4px 22px;padding:7px 10px;background:var(--surface);border-radius:6px;
        font:12px/1.6 var(--mono);color:var(--text-3);white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:1200px){
  .wk-claim{grid-template-columns:minmax(0,1fr)}
  .wk-note{display:none}
}
@media (max-width:900px){
  .wk-split[data-source="1"] .wk-doc{display:none}
}
@media (max-width:720px){
  .wk-doc{padding:16px}
  .wk-row{flex-wrap:wrap;gap:4px 14px}
  .wk-row-main{flex-basis:100%}
  .wk-where,.wk-run-meta{margin-inline-start:0}
  .wk-inferred{margin-inline-start:0}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/app.js"></script>
</body>
