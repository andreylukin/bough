# bough config tree: a list of plugin rows. Mount order comes from
# each plugin's Inject() deps; row order only breaks ties within a
# mount pass (which is why optional loop seams sit above the loop row).
#
# This file is embedded in the binary as the base tree. A ./bough.yml
# or ~/.bough/bough.yml is laid over it by id: same id replaces the
# row, a new id is appended, `disabled: true` drops one. Write down
# only the rows you change.

- id: llm
  plugin: llm-anthropic
  config:
    model: claude-sonnet-5
    # max_tokens: 16384   # cap on one reply; raise it if long patches
    #                     # come back cut off (the loop says when they do)

# Swap the provider by replacing the row above with:
# - id: llm
#   plugin: llm-echo
# or (needs OPENROUTER_API_KEY):
# - id: llm
#   plugin: llm-openrouter
#   config:
#     model: deepseek/deepseek-chat
# or (needs CEREBRAS_API_KEY; ~3000 tok/s, no dollar cost reported, so
# price it under the cost row: prices: {gpt-oss-120b: {input: …, output: …}}):
# - id: llm
#   plugin: llm-cerebras
#   config:
#     model: gpt-oss-120b

# Dollar cost in the status bar and /cost for every provider: OpenRouter
# prices its own responses; OpenAI and Anthropic tallies are priced from
# a built-in table (first-party $/Mtok) that `prices:` overrides, e.g.
#   config: {prices: {gpt-5-mini: {input: 0.25, output: 2}}}
# History mounts before cost: cost sums the done entries on file when it
# mounts (a resumed session's tally), and a miss here would remount cost,
# re-provide "usage", and reload the loop row under a turn already running
# (headless submits its prompt the moment the ui row is up).
- id: history
  plugin: history
  # config:
  #   file: /path/to/session.jsonl  # resume that exact session (what -c/-r set)

- id: cost
  plugin: cost

- id: codemode
  plugin: codemode

# Slash-command registry ("/help", "/quit", ...). The ui palette and
# dispatch read the "commands" service; init.js registers into it via
# bough.command.
- id: commands
  plugin: commands

# What is true about this session, for plugins: id, title, model and
# provider, tokens and cost, context fill, turn count. Go rows Get the
# "session" service and call Info(); init.js reads bough.session().
# Resolved when asked, so it follows /model and a resumed session.
- id: session
  plugin: session

# User configuration in JS: runs ~/.bough/init.js then ./.bough/init.js
# (both optional) with a global `bough` API; may provide theme, keymap,
# llm, cognition, projection. See docs/INIT.md.
- id: init-js
  plugin: init-js

- id: tools
  plugin: tools-basic

# Subagents: tools.spawn(task) runs a bounded child agent (depth 1)
# whose final plain-text reply is the tool's return value.
- id: workers
  plugin: workers
  # config:
  #   max_spawns: 4  # spawns per parent turn
  #   max_steps: 6   # child agent steps

# Optional loop seams. The loop resolves these at mount time, so their
# rows sit above the loop row (within a mount pass, row order is the
# tie-breaker).

- id: hooks
  plugin: hooks-js

- id: skills
  plugin: skills

- id: context-md
  plugin: context-md

# Rules you already keep for Claude Code and Codex, honoured here —
# from home (~/.claude/rules, ~/.codex/rules) and from the project
# (./.claude/rules, ./.codex/rules), like hooks. Claude rules (.md):
# unscoped ones join the AGENTS.md preamble; ones with `paths:` are
# shown when a code block touches a matching file. Codex rules
# (prefix_rule in .rules): forbidden refuses the shell command with
# the justification, prompt asks you first. /rules lists them.
- id: rules
  plugin: rules

- id: mcp
  plugin: mcp
  # config:
  #   servers:
  #     example:
  #       command: some-mcp-server
  #       args: [--flag]
  #       env: {KEY: value}
  #   disable: [name]

# Session TODO list: /todo, tools.todo, and a system-prompt section.
# State is derived from history entries, so it survives resume.
- id: todo
  plugin: todo
  # config:
  #   inject_prompt: false  # drop the system-prompt TODO section

# /connect: add a provider API key without leaving the session. Writes
# it to ~/.bough/env (0600), sets it in this process, and switches the
# llm row over. The command hides its arguments, so the key reaches
# neither the transcript nor the history file.
- id: connect
  plugin: connect
  # config:
  #   env_file: ~/.bough/env

# Markdown prompt templates: every ~/.bough/prompts/<name>.md and
# ./.bough/prompts/<name>.md becomes a "/name" command that expands the
# file ($ARGUMENTS, $1..$9) and submits it as your prompt. "/init" ships
# in the binary; a file of the same name shadows it.
- id: prompts
  plugin: prompts

# Interactive questions: tools.ask(question, options...) blocks until
# the user answers in the UI (headless: the next stdin line), then
# returns the answer as the tool's output.
- id: ask
  plugin: ask
  # config:
  #   timeout_minutes: 10  # unanswered asks error after this

# A cheap model for the jobs that are not the conversation: naming a
# session, the status line. Any llm-* plugin with
# {service: llm-small}; without this row those jobs use the agent's own
# model.
# - id: llm-small
#   plugin: llm-openrouter
#   config:
#     service: llm-small
#     model: z-ai/glm-5.3-flash

#     days: 14              # only PRs updated this recently
#     max_prs: 3            # per poll
#     authors: ["@me"]      # whose PRs
#     bots: [codex, devin, copilot, coderabbit, cursor, sourcery, graphite, greptile]

- id: loop
  plugin: loop
  # config:
  #   max_steps: 100          # model steps per turn
  #   keep_whole_results: 8   # the FLOOR: this many recent tool outputs
  #                           # are always shown whole. Older ones are
  #                           # shortened only once the projection grows
  #                           # past ~60k characters, and keep their head
  #                           # plus a note saying what was cut. A short
  #                           # session is never touched. 0 disables it.
  #                           # Nothing is summarised and the history log
  #                           # is untouched either way.

# The agent's own directory: values that survive a code block, notes
# that survive the context window, and somewhere to put a throwaway
# file that is not the user's checkout. $BOUGH_SCRATCH points at it.
# After loop so its prompt section lands. config: {dir: <path>}
- id: scratchpad
  plugin: scratchpad

# While the agent works, a small model says what it is doing in a few
# words, on the bottom line. Needs the llm-small row; without it the
# plugin is quiet (a status line is not worth the agent's own model).
- id: activity
  plugin: activity

# One cheap call per session names it, so `bough sessions` and the
# picker read as a list of jobs instead of opening sentences.
# Inside a cmux terminal (macOS), the sidebar row takes the session's
# title as its name, the prompt in flight as its description, and a
# "bough" pill saying running / needs an answer / done / stopped.
# Elsewhere the row does nothing.
- id: cmux
  plugin: cmux
  # config:
  #   prefix: "bough · "   # put before the title

- id: session-title
  plugin: session-title

# Colors: a bundled palette by name (forest, forest_light, ansi,
# tokyonight, catppuccin_mocha, gruvbox, nord, dracula); /theme lists
# and switches live. init.js `ui.theme` tokens overlay the palette.
# The local page server: one address where rows with a page to show
# mount it — every artifact an agent publishes. The first bough process binds it; later ones
# find it taken and point at the same pages (they are read from disk).
- id: web
  plugin: web
  # config:
  #   addr: localhost:7683

# Artifacts: pages the agent publishes for you to read and act on in
# the browser (a comparison, a report, a dashboard, a form) —
# tools.artifact(name, code) returns the URL and opens it once;
# /artifacts lists this session's. code is OpenUI Lang
# (thesysdev/openui): one `name = Component(...)` per line, drawn by
# the vendored OpenUI bundle. Buttons, forms and the note box reach
# the agent as notices; so do the renderer's errors, which it fixes
# with tools.artifactPatch. Stored under ~/.bough/artifacts/<session>/.
- id: artifacts
  plugin: artifacts
  # config:
  #   open: false          # do not open the browser on first publish

- id: theme
  plugin: theme
  config:
    name: forest

- id: ui
  plugin: ui
  # config:
  #   collapse: all|large|none (default all) — which code/result blocks start collapsed
