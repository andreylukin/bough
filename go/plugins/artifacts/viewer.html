<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>artifact</title>
<link rel="stylesheet" href="/artifacts/_lib/openui-styles.css">
<style>
:root { --paper: #faf9f5; --ink: #1c1b18; --muted: #6b675e; --rule: #e6e2d8; --border: #cfcabc; --card: #ffffff; --good: #2f7a3e; --bad: #b3352b; --accent: #3b6d3a;
  --sans: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root { --paper: #15161a; --ink: #e8e6df; --muted: #a09c92; --rule: #2a2c33; --border: #3d404a; --card: #1c1e24; --good: #7fcf8b; --bad: #ef7b6f; --accent: #8fc98a; } }
html { background: var(--paper); color: var(--ink); }
body { margin: 0; font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
main { max-width: 960px; margin: 0 auto; padding: 32px 20px 72px; }
.eyebrow { font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#root { margin-top: 12px; }
.errors { margin-top: 18px; border-left: 3px solid var(--bad); background: var(--card); padding: 10px 14px; border-radius: 0 6px 6px 0; font: 13px/1.5 var(--mono); white-space: pre-wrap; }
.errors[hidden] { display: none; }
.errors b { color: var(--bad); }
.ask { margin-top: 40px; background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 14px 16px 12px; max-width: 78ch; }
.ask textarea { font: 14px var(--sans); padding: 7px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--paper); color: var(--ink); width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical; margin-top: 10px; }
.ask .row { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
.ask .send { font: 600 13px var(--sans); padding: 7px 14px; border: 0; border-radius: 4px; background: var(--ink); color: var(--paper); cursor: pointer; }
.ask .send:disabled { opacity: .5; }
.status { font: 12px var(--mono); color: var(--muted); } .status.ok { color: var(--good); }
footer { margin-top: 48px; padding-top: 14px; border-top: 1px solid var(--rule); font: 12px var(--mono); color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
footer a { color: inherit; }
.reload { position: fixed; right: 16px; bottom: 16px; font: 12px var(--mono); background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 4px; opacity: 0; transition: opacity .3s; pointer-events: none; }
.reload.on { opacity: .9; }
</style>
</head>
<body>
<main>
  <div class="eyebrow" id="eyebrow">artifact</div>
  <div id="root"></div>
  <div class="errors" id="errors" hidden></div>
  <div class="ask">
    <div class="eyebrow">note to the agent</div>
    <textarea id="notetext" placeholder="Anything you want the agent to know about this page…"></textarea>
    <div class="row"><button class="send" id="notesend">Send</button><span class="status" id="notestatus"></span></div>
  </div>
  <div class="reload" id="reload">updated</div>
  <footer>
    <span>AI-generated — verify before relying on it</span>
    <span id="when"></span>
    <a id="raw">source</a>
    <a href="/artifacts/">all artifacts</a>
  </footer>
</main>
<script src="/artifacts/_lib/openui-bundle.min.js"></script>
<script>
const PAGE = /*PAGE*/null;
const base = location.pathname.replace(/\/$/, '');
const $ = id => document.getElementById(id);
async function post(path, body) {
  const r = await fetch(base + path, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error('not saved');
  return r.json();
}
const status = (node, text, ok) => { node.textContent = text; node.className = 'status' + (ok ? ' ok' : ''); if (ok) setTimeout(() => { if (node.textContent === text) node.textContent = ''; }, 2500); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function flash(text) { const chip = $('reload'); chip.textContent = text; chip.classList.add('on'); setTimeout(() => chip.classList.remove('on'), 1800); }

let root = null, state = {}, stateTimer = null, lastErrors = '';
function draw() {
  const { React, createRoot, Renderer, openuiChatLibrary } = window.__OpenUI;
  document.title = PAGE.name;
  $('eyebrow').textContent = 'artifact · ' + PAGE.name + ' · v' + PAGE.version;
  if (PAGE.published) $('when').textContent = new Date(PAGE.published).toLocaleString();
  $('raw').href = base + '.ui';
  if (!root) root = createRoot($('root'));
  root.render(React.createElement(Renderer, {
    response: PAGE.code, library: openuiChatLibrary, isStreaming: false, initialState: state,
    onAction: async (e) => {
      // A button, a follow-up, a form submit: send it to the agent.
      if (e.type === 'open_url' && e.params && e.params.url) { window.open(e.params.url, '_blank', 'noopener'); return; }
      const value = {type: e.type, message: e.humanFriendlyMessage, form: e.formName || null, params: e.params || {}, formState: e.formState || null};
      try { await post('/answers', {kind: 'action', value, state: e.formState || state}); flash('sent to the agent'); }
      catch (err) { flash('not sent — is bough running?'); }
    },
    onStateUpdate: (s) => {
      state = s || {};
      clearTimeout(stateTimer);
      stateTimer = setTimeout(() => post('/answers', {kind: 'state', value: null, state}).catch(() => {}), 800);
    },
    onError: (errors) => {
      const box = $('errors');
      const list = errors || [];
      box.hidden = list.length === 0;
      box.innerHTML = list.map(e => '<b>' + esc(e.code || e.source) + '</b> ' + (e.statementId ? esc(e.statementId) + ': ' : '') + esc(e.message || '') + (e.hint ? '\n  ' + esc(e.hint) : '')).join('\n');
      // Tell the agent, once per distinct report per version.
      const key = PAGE.version + ':' + JSON.stringify(list);
      if (key === lastErrors) return;
      lastErrors = key;
      post('/errors', {version: PAGE.version, errors: list}).catch(() => {});
    },
  }));
}

async function main() {
  if (!PAGE) return;
  try { const r = await fetch(base + '/answers'); if (r.ok) { const a = await r.json(); state = a.state || {}; } } catch (e) {}
  draw();
  const note = $('notetext'), st = $('notestatus'), send = $('notesend');
  send.onclick = async () => {
    if (!note.value.trim()) return;
    send.disabled = true;
    try { await post('/answers', {kind: 'note', value: note.value.trim()}); note.value = ''; status(st, 'sent to the agent', true); }
    catch (e) { status(st, 'not sent — is bough running?'); }
    finally { send.disabled = false; }
  };
  // Live reload: the server says "update" when the program changes.
  try {
    const es = new EventSource(base + '/events');
    es.addEventListener('update', async () => {
      const r = await fetch(base + '.ui', {cache: 'no-store'});
      if (!r.ok) return;
      PAGE.code = await r.text();
      PAGE.version += 1;
      lastErrors = '';
      draw();
      flash('updated');
    });
  } catch (e) {}
}
main();
</script>
</body>
</html>
