<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>current work</title>
<style>
:root{--bg:#2d353b;--bg2:#343f44;--bg3:#3d484d;--fg:#d3c6aa;--dim:#859289;--border:#56635f;--green:#a7c080;--aqua:#83c092;--amber:#dbbc7f;--red:#e67e80;--blue:#7fbbb3;--purple:#d699b6}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.45 ui-monospace,"JetBrains Mono","SF Mono",Menlo,monospace}
header{display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:3}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em}
header .meta{color:var(--dim);flex:1}
header .stale{color:var(--red);font-weight:600}
header .zoom button{background:transparent;color:var(--dim);border:1px solid var(--border);border-radius:3px;padding:2px 8px;font:inherit;cursor:pointer;margin-left:4px}
header .zoom button.on{color:var(--fg);border-color:var(--amber)}
header .chats{margin-left:14px}
.btn{background:transparent;color:var(--fg);border:1px solid var(--border);border-radius:3px;padding:2px 10px;font:inherit;cursor:pointer;text-decoration:none;margin-left:6px}
.btn.new{color:var(--aqua);border-color:var(--aqua)}
#chats{position:fixed;top:44px;right:16px;width:460px;max-height:70vh;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:4px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.chatsHead{padding:8px 12px;border-bottom:1px solid var(--border);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg)}
.chatsHead .dim{color:var(--dim);text-transform:none;letter-spacing:0}
.chat{display:grid;grid-template-columns:14px 1fr 60px;gap:8px;padding:6px 12px;border-bottom:1px solid var(--bg3);text-decoration:none;color:var(--fg);align-items:baseline}
.chat:hover{background:var(--bg3)}
.chat .dot{color:var(--aqua)}.chat .dot.main{color:var(--amber)}
.chat .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chat .t small{display:block;color:var(--dim);font-size:11px}
.chat .when{color:var(--dim);font-size:11px;text-align:right}
.mk a{color:inherit;text-decoration:none}
aside dd a{color:var(--aqua);text-decoration:none}aside dd a:hover{text-decoration:underline}
aside .act{margin-top:14px}
main{display:grid;grid-template-columns:1fr 330px;min-height:calc(100% - 44px)}
body.present main{grid-template-columns:1fr}
body.present aside{display:none}
#flow{padding:12px 16px;min-width:0;overflow-x:auto}
.grid{display:grid;grid-template-columns:170px minmax(240px,1fr) 250px 96px;gap:0 8px;align-items:stretch}
.h{color:var(--dim);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px 6px}
.axis{display:grid;color:var(--dim);font-size:10px;padding:0 0 4px;position:relative}
.axis span{overflow:hidden;white-space:nowrap}
.axis span:last-child{color:var(--amber)}
.grp{grid-column:1/-1;margin-top:12px;padding:4px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--border)}
.grp.me{color:var(--amber)}.grp.motion{color:var(--aqua)}.grp.blocked{color:var(--red)}.grp.others{color:var(--dim)}
.lbl{padding:8px 6px;font-weight:600;border-top:1px solid var(--bg3);overflow:hidden}
.lbl a{color:inherit;text-decoration:none}.lbl a:hover{text-decoration:underline}
.lbl small{display:block;color:var(--dim);font-weight:400;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{position:relative;border-top:1px solid var(--bg3);min-height:48px;background:var(--grid)}
.seg{position:absolute;top:22px;height:8px;border-radius:2px}
.seg.queued{background:var(--border)}.seg.building{background:var(--blue)}.seg[data-stage="in review"]{background:var(--amber)}.seg.blocked{background:var(--red)}.seg.shipping{background:var(--green)}
.seg.agent{background:repeating-linear-gradient(90deg,var(--aqua) 0 6px,#5f9c86 6px 9px)}
.mk{position:absolute;top:4px;font-size:10px;color:var(--fg);background:var(--bg);padding:0 3px;white-space:nowrap;transform:translateX(-50%);cursor:default;border-radius:2px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.mk::after{content:"";position:absolute;left:50%;top:14px;width:1px;height:8px;background:var(--dim)}
.mk.me{color:var(--amber)}.mk.bot{color:var(--dim)}.mk.agent{color:var(--aqua)}
.mk:hover{background:var(--bg3);z-index:2;max-width:none}
.nowc{border-top:1px solid var(--bg3);border-left:2px dashed var(--amber);padding:5px 6px}
.card{background:var(--bg3);border-left:3px solid var(--border);border-radius:3px;padding:4px 6px;font-size:12px;position:relative;cursor:pointer;transition:background .15s}
.card:hover,.card.hovered{background:#475258}
.card.me{border-left-color:var(--amber)}.card.motion{border-left-color:var(--aqua)}.card.blocked{border-left-color:var(--red)}
.card.changed .t{color:var(--amber)}
.card .t{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding-right:44px}
.card .t a{color:inherit;text-decoration:none}.card .t a:hover{text-decoration:underline}
.card .k{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .chip{position:absolute;right:6px;top:4px;font-size:11px;color:var(--aqua)}
.card .age{position:absolute;right:6px;bottom:3px;font-size:10.5px;color:var(--dim)}
.st{margin-left:6px;font-weight:600}.st.bad{color:var(--red)}.st.ok{color:var(--aqua)}
.nxt{border-top:1px solid var(--bg3);padding:6px;font-size:10.5px;color:var(--purple)}
.nxt div{border:1px dashed var(--purple);border-radius:3px;padding:1px 5px;margin-bottom:3px;white-space:nowrap}
#strip{padding:8px 20px 6px;border-bottom:1px solid var(--border);background:var(--bg2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11px;color:var(--dim)}
.legend .dim{color:var(--dim)}
#headline{margin-top:6px;font-size:13.5px;color:var(--fg);min-height:0}
#headline .counts{color:var(--dim)}
#headline .pend{color:var(--dim);font-style:italic}
body.present .k .raw{display:none}
body.present .lbl .key{display:none}
.card .brief{color:var(--fg);font-size:12px;margin-top:2px;display:none;padding-right:30px}
body.present .card .brief{display:block}
body.present .card .k{display:none}
body.present .card .t{padding-right:44px}
body.present .grid{grid-template-columns:200px minmax(240px,1fr) 320px}
body.present .nxt,body.present .grid>.h:nth-child(4){display:none}
#presentBtn.on{color:var(--fg);border-color:var(--amber)}
main{transition:none}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;vertical-align:middle;margin-right:5px}
aside{padding:14px 18px;position:sticky;top:44px;align-self:start;max-height:calc(100vh - 44px);overflow:auto;border-left:1px solid var(--border)}
aside .empty{color:var(--dim)}
aside h3{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--amber);text-wrap:balance}
aside h3 a{color:inherit;text-decoration:none}
aside .facts{color:var(--dim);margin-bottom:12px}
aside dl{margin:0;display:grid;grid-template-columns:76px 1fr;gap:6px 10px}
aside dt{color:var(--dim)}
aside dd{margin:0;word-break:break-word}
@media (max-width:1180px){main{grid-template-columns:1fr}aside{position:static;max-height:none;border-left:0;border-top:1px solid var(--border)}.grid{grid-template-columns:160px minmax(200px,1fr) 240px 100px}}
</style>
</head>
<body>
<header><h1>current work</h1><span class="meta" id="meta">reading the graph…</span><span class="zoom"><button data-d="1">1d</button><button data-d="7" class="on">7d</button><button data-d="30">30d</button></span><span class="chats"><button class="btn" id="presentBtn" title="plain words and one-line briefs, for showing someone else">present</button><a class="btn new" href="/s/new" target="_blank">+ new chat</a><button class="btn" id="chatsBtn">chats ▾</button></span></header>
<div id="strip"><div class="legend"><span><i style="background:var(--border)"></i>queued</span><span><i style="background:var(--blue)"></i>building</span><span><i style="background:var(--amber)"></i>in review</span><span><i style="background:var(--red)"></i>blocked</span><span><i style="background:repeating-linear-gradient(90deg,var(--aqua) 0 6px,#5f9c86 6px 9px)"></i>an agent is on it</span><span><i style="background:var(--green)"></i>shipping</span><span class="dim">· amber marks are moments the work came back to me</span></div><div id="headline"></div></div>
<div id="chats" hidden><div class="chatsHead">recent chats <span class="dim">· a dot means it is open now</span></div><div id="chatList"></div></div>
<main>
  <section id="flow"><div class="grid" id="grid"></div></section>
  <aside id="aside"><div class="empty">hover a card for what the graph knows about it</div></aside>
</main>
<script>
const $=s=>document.querySelector(s);
const FRAMES=["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
let days=7, facts={}, first=true, hovered=null, detailCache={}, spinTick=0, present=false, briefCache={};
try{ present=localStorage.getItem('present')==='1'; }catch(e){}
document.body.classList.toggle('present',present);
const GROUP={me:['needs me','needs my action'],motion:['in motion','my agents are working on it'],blocked:['blocked','blocked'],others:['waiting on others','waiting on other people']};
function words(t){ if(!present) return t; return (t||'')
  .replace(/^next: \?$/,'no one lined up next').replace(/^review required$/,'needs a review').replace(/ci failing/g,'checks failing').replace(/ci green/g,'checks passing')
  .replace(/^session [0-9a-f]{4} · /,'an agent is handling: ').replace(/^awaits /,'waiting on ').replace(/^→ you$/,'came back to me').replace(/^→ /,'handed to ').replace(/^pr-watch$/,'agent').replace(/^\+(\d+) /,'+$1 ').replace(/ threads?$/,' review threads'); }
$('#presentBtn').addEventListener('click',()=>{ present=!present; try{localStorage.setItem('present',present?'1':'0');}catch(e){} document.body.classList.toggle('present',present); $('#presentBtn').classList.toggle('on',present); load(); });
$('#presentBtn').classList.toggle('on',present);
setInterval(()=>{spinTick=(spinTick+1)%FRAMES.length;document.querySelectorAll('.spin').forEach(e=>e.textContent=FRAMES[spinTick])},100);
document.querySelectorAll('.zoom button').forEach(b=>b.addEventListener('click',()=>{days=+b.dataset.d;document.querySelectorAll('.zoom button').forEach(x=>x.classList.toggle('on',x===b));load();}));
$('#chatsBtn').addEventListener('click',async()=>{ const p=$('#chats'); if(!p.hidden){p.hidden=true;return;} p.hidden=false; await loadChats(); });
document.addEventListener('click',e=>{ if(!e.target.closest('#chats')&&!e.target.closest('#chatsBtn')) $('#chats').hidden=true; });
async function loadChats(){ try{ const r=await fetch('/sessions'); const list=await r.json()||[]; const now=Date.now();
  $('#chatList').innerHTML=list.map(s=>'<a class="chat" href="'+esc(s.url)+'" target="_blank"><span class="dot '+esc(s.live||'')+'">'+(s.live?'●':'')+'</span><span class="t">'+esc(s.title)+(s.cwd?'<small>'+esc(s.cwd.replace(/^\/Users\/[^/]+/,'~'))+'</small>':'')+'</span><span class="when">'+age(now-new Date(s.at).getTime())+'</span></a>').join('')||'<div class="chat">no chats yet</div>'; }catch(e){ $('#chatList').textContent='could not list chats: '+e; } }
setInterval(()=>{ if(!$('#chats').hidden) loadChats(); },5000);

function age(ms){const h=ms/36e5; if(h<1) return Math.max(0,Math.floor(ms/6e4))+'m'; if(h<48) return Math.floor(h)+'h'; const d=h/24; if(d<21) return Math.floor(d)+'d'; return Math.floor(d/7)+'w';}
function shortKey(k){const i=k.indexOf('#'); if(i<0||i<=14) return k; return k.slice(0,i).split(/[-_.]/).map(p=>p[0]).join('')+k.slice(i);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtNext(ms){ if(ms<=0) return 'now'; const m=Math.round(ms/6e4); if(m<60) return m+'m'; const h=Math.round(m/60); if(h<48) return h+'h'; return Math.round(h/24)+'d'; }

function card(it, now, colKey){
  const ms=now-new Date(it.Since).getTime();
  const key=it.Key, f=it.Status+'|'+it.Detail+'|'+it.Session, changed=!first&&facts[key]!==undefined&&facts[key]!==f; facts[key]=f;
  let st=''; if(/^ci failing/.test(it.Status)){const n=it.Status.replace('ci failing','').trim(); st='<span class="st bad">✕'+(n&&n!=='×'+it.Count?' '+n:'')+'</span>';} else if(it.Status==='ci green') st='<span class="st ok">✓</span>';
  const name=it.Count?esc(present?it.Title:it.Key)+' <span style="color:var(--dim)">×'+it.Count+'</span>':(it.URL?'<a href="'+esc(it.URL)+'" target="_blank" rel="noopener">'+esc(it.Title)+'</a>':esc(it.Title));
  const chip=it.Session?'<span class="chip spin">⠋</span>':'';
  const d=document.createElement('div'); d.className='card '+colKey+(changed?' changed':'')+(key===hovered?' hovered':''); d.dataset.key=key;
  d.innerHTML='<div class="t">'+name+st+'</div>'+chip+'<div class="k">'+(it.Count?'':shortKey(key)+' · ')+esc(words(it.Detail))+'</div><div class="brief"></div><span class="age">'+age(ms)+'</span>';
  if(present) brief(it, d.querySelector('.brief'));
  d.addEventListener('mouseenter',()=>hover(it));
  d.addEventListener('click',e=>{ if(e.target.tagName==='A') return; if(it.URL) window.open(it.URL,'_blank','noopener'); });
  return d;
}

function track(row, from, now){
  const span=now-from, x=t=>Math.max(0,Math.min(100,(new Date(t).getTime()-from)/span*100));
  const d=document.createElement('div'); d.className='trk';
  (row.segments||[]).forEach(sg=>{ const a=x(sg.from), b=x(sg.to); if(b<=a) return; const e=document.createElement('div'); e.className='seg '+(sg.agent?'agent':sg.stage); e.dataset.stage=sg.stage; e.style.left=a+'%'; e.style.width=(b-a)+'%'; e.title=sg.stage+(sg.agent?' · agent on it':'')+' · '+age(new Date(sg.to)-new Date(sg.from)); d.appendChild(e); });
  // marks: cluster those within 3% of the previous
  let lastX=-10, cluster=null, n=0;
  (row.marks||[]).forEach(m=>{ const px=x(m.at); if(px-lastX<3&&cluster){ n++; cluster.textContent='+'+n+' '+cluster.dataset.first; cluster.title+='\n'+m.text+(m.claim?': '+m.claim:''); return; }
    const e=document.createElement('div'); e.className='mk '+m.kind; e.style.left=Math.min(px,94)+'%'; const mt=words(m.text); if(m.url){ e.innerHTML='<a href="'+esc(m.url)+'" target="_blank">'+esc(mt)+'</a>'; } else e.textContent=mt; e.dataset.first=mt; e.title=new Date(m.at).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+' · '+m.text+(m.claim?': '+m.claim:''); d.appendChild(e); lastX=px; cluster=e; n=0; });
  return d;
}

function render(f){
  const now=new Date(f.now).getTime(), from=new Date(f.from).getTime();
  const g=$('#grid'); g.innerHTML='';
  const ticks=days===1?6:days===7?7:6; const ax=document.createElement('div'); ax.className='axis'; ax.style.gridTemplateColumns='repeat('+ticks+',1fr)';
  for(let i=0;i<ticks;i++){ const t=new Date(from+(now-from)*i/ticks); const s=document.createElement('span'); s.textContent=i===ticks-1&&days<=1?'':(days===1?t.toLocaleTimeString([], {hour:'2-digit'}):t.toLocaleDateString([], {month:'short',day:'numeric'})); if(i===ticks-1) s.textContent='now →'; ax.appendChild(s); }
  const lbl=h=>{const e=document.createElement('div'); e.className='h'; e.textContent=h; return e;};
  g.append(lbl('subject'), ax, lbl('now'), lbl('next'));
  const grid=`repeating-linear-gradient(90deg,transparent 0 calc(100%/${ticks} - 1px),var(--bg3) calc(100%/${ticks} - 1px) calc(100%/${ticks}))`;
  (f.groups||[]).forEach(gr=>{
    const h=document.createElement('div'); h.className='grp '+gr.key; h.textContent=(GROUP[gr.key]?GROUP[gr.key][present?1:0]:gr.label)+' · '+gr.rows.length; g.appendChild(h);
    let lastSubj=null;
    gr.rows.forEach(r=>{
      const l=document.createElement('div'); l.className='lbl';
      const same=lastSubj===r.subject.key; lastSubj=r.subject.key;
      const sk=shortKey(r.subject.key); const title=r.subject.url?'<a href="'+esc(r.subject.url)+'" target="_blank" rel="noopener" title="'+esc(r.subject.key)+'">'+esc(sk)+'</a>':esc(sk);
      if(present){ const t=esc(r.subject.title!==r.subject.key?r.subject.title:r.subject.key); l.innerHTML=same?'<small>↳ '+esc(r.item.Title)+'</small>':(r.subject.url?'<a href="'+esc(r.subject.url)+'" target="_blank" rel="noopener">'+t+'</a>':t); l.style.fontWeight='500'; }
      else l.innerHTML=same?'<small>↳ '+esc(shortKey(r.item.Key))+'</small>':title+'<small>'+esc(r.subject.title!==r.subject.key?r.subject.title:'')+'</small>';
      const t=track(r, from, now); t.style.setProperty('--grid', grid);
      const nc=document.createElement('div'); nc.className='nowc'; nc.appendChild(card(r.item, now, gr.key));
      const nx=document.createElement('div'); nx.className='nxt'; (r.next||[]).forEach(n=>{const e=document.createElement('div'); e.textContent=n.text.replace('pr-watch poll','poll')+' '+fmtNext(new Date(n.at)-now); e.title=n.text; nx.appendChild(e);});
      g.append(l,t,nc,nx);
    });
  });
  first=false;
}

async function hover(it){
  hovered=it.Key; document.querySelectorAll('.card').forEach(e=>e.classList.toggle('hovered',e.dataset.key===it.Key));
  const a=$('#aside'); const since=new Date(it.Since).getTime();
  const head='<h3>'+(it.URL?'<a href="'+esc(it.URL)+'" target="_blank" rel="noopener">'+esc(it.Title)+'</a>':esc(it.Title))+'</h3><div class="facts">'+esc(it.Key)+' · '+esc(it.Kind)+(it.Status?' · '+esc(it.Status):'')+' · '+age(Date.now()-since)+'</div>';
  let rows=[]; if(it.Summary) rows.push(['source',esc(it.Summary)]);
  if(it.Members) rows.push(['stack',it.Members.map(esc).join('<br>')]);
  if(it.Count){ a.innerHTML=head+dl(rows)+chatAbout(it); return; }
  a.innerHTML=head+dl(rows.concat([['','<span class="empty">reading the graph…</span>']]));
  let lines=detailCache[it.Key]; const stale=!lines||Date.now()-lines.at>30000;
  if(stale){ try{ const r=await fetch('/api/detail?kind='+encodeURIComponent(it.Kind)+'&key='+encodeURIComponent(it.Key)); lines={lines:await r.json()||[],at:Date.now()}; detailCache[it.Key]=lines; }catch(e){ lines={lines:[],at:Date.now()}; } }
  if(hovered!==it.Key) return;
  const body=lines.lines.map(l=>[l.Label, l.Links&&l.Links.length? l.Links.map(x=>'<a href="'+esc(x.url)+'" target="_blank">'+esc(x.text)+'</a>').join(' · ')+(l.Text.includes('· +')?' · '+esc(l.Text.split('· +').pop().replace(/^/,'+')):'') : esc(l.Text)]);
  a.innerHTML=head+dl(rows.concat(body))+chatAbout(it);
}
function chatAbout(it){ const draft='About '+it.Kind+':'+it.Key+(it.Title&&it.Title!==it.Key?' “'+it.Title+'”':'')+(it.URL?' '+it.URL:'')+' — '; return '<div class="act"><a class="btn new" href="/s/new?draft='+encodeURIComponent(draft)+'" target="_blank">+ chat about this</a></div>'; }
async function brief(it, el){
  const c=briefCache[it.Key]; if(c&&c.text){ el.textContent=c.text; return; }
  if(c&&c.at&&Date.now()-c.at<4000){ el.innerHTML='<span class="pend">writing…</span>'; return; }
  briefCache[it.Key]={at:Date.now()};
  try{ const r=await fetch('/api/brief?kind='+encodeURIComponent(it.Kind)+'&key='+encodeURIComponent(it.Key)); const b=await r.json();
    if(b.text){ briefCache[it.Key]={text:b.text}; el.textContent=b.text; } else if(!b.available){ briefCache[it.Key]={text:''}; el.textContent=''; } else { el.innerHTML='<span class="pend">writing…</span>'; }
  }catch(e){}
}
function countsLine(f){ const n=k=>{const g=(f.groups||[]).find(x=>x.key===k); return g?g.rows.length:0;}; const me=n('me'),mo=n('motion'),bl=n('blocked'),ot=n('others');
  return present?`${me} need${me===1?'s':''} my action · ${mo} being worked by my agents · ${bl} blocked · ${ot} waiting on other people`:`${me} need me · ${mo} in motion · ${bl} blocked · ${ot} waiting on others`; }
let headlineAt=0;
async function headline(f){ const h=$('#headline'); const counts='<span class="counts">'+countsLine(f)+'</span>';
  if(!present){ h.innerHTML=counts; return; }
  if(Date.now()-headlineAt<4000&&h.dataset.text){ h.innerHTML=esc(h.dataset.text)+' <br>'+counts; return; }
  headlineAt=Date.now();
  try{ const r=await fetch('/api/headline'); const b=await r.json(); if(b.text){ h.dataset.text=b.text; h.innerHTML=esc(b.text)+' <br>'+counts; } else if(!b.available){ h.innerHTML=counts; } else { h.innerHTML='<span class="pend">summarising…</span> <br>'+counts; } }catch(e){ h.innerHTML=counts; }
}
function dl(rows){return '<dl>'+rows.map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+v+'</dd>').join('')+'</dl>';}

async function load(){
  try{
    const r=await fetch('/api/flow?days='+days); const f=await r.json(); const now=new Date(f.now).getTime();
    if(f.err&&!(f.groups&&f.groups.length)){ $('#meta').textContent=f.err; return; }
    const col=f.collected&&!f.collected.startsWith('0001')?new Date(f.collected):null; let meta=col?'collected '+col.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'never collected';
    if(col&&now-col.getTime()>864e5) meta+=' <span class="stale">STALE</span>';
    $('#meta').innerHTML=meta+' · refreshes every 5 s';
    render(f); headline(f);
  }catch(e){ $('#meta').textContent='bough is not reachable: '+e; }
}
load(); setInterval(load,5000);
</script>
</body>
</html>
