[package]
name = "bough-core"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/andreylukin/bough"

[dependencies]
model2vec-rs = { version = "0.2", features = ["hf-hub"] }  # embeddings: pure-Rust static vectors
mlua = { version = "0.11", features = ["luau", "serialize"] }  # hooks: the embedded Lua runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
nix = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
include_dir = { workspace = true }
# The vec0 KNN virtual table, STATICALLY registered (`sqlite3_auto_extension`) —
# no dylib to find, unlike the npm package the TS side loads. See `db/embed.rs`.
sqlite-vec = "0.1.9"

[dev-dependencies]
chrono-tz = { workspace = true }
