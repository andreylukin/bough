[package]
name = "bough-core"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/andreylukin/bough"

[dependencies]
bough-llm = { workspace = true }
model2vec-rs = { version = "0.2", features = ["hf-hub"] }  # embeddings: pure-Rust static vectors
mlua = { version = "0.12", features = ["luau", "serialize"] }  # hooks: the embedded Lua runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
nix = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
include_dir = { workspace = true }
rmcp = { workspace = true }
# `oauth2`'s HttpRequest/HttpResponse are `http::Request/Response<Vec<u8>>`, and
# rmcp re-exports neither: the `OAuthHttpClient` impl in `mcp/rmcp_auth.rs` needs
# the types to build its side of that contract.
http = "1"
# The vec0 KNN virtual table, STATICALLY registered (`sqlite3_auto_extension`) —
# no dylib to find, unlike the npm package the TS side loads. See `db/embed.rs`.
sqlite-vec = "0.1.9"

[dev-dependencies]
bough-llm = { workspace = true, features = ["test-support"] }
chrono-tz = { workspace = true }
