[package]
name = "bough-llm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/andreylukin/bough"
description = "bough's LLM provider layer: one LlmClient over Anthropic, OpenAI, OpenRouter, Cloudflare and Cerebras, with routing, retries, pricing and tracing."

[features]
# Exposes `test_support` (scripted client, canned transports) to downstream
# crates' tests.
test-support = []

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
