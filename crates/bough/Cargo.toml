[package]
name = "bough"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "bough"
path = "src/lib.rs"

[[bin]]
name = "bough"
path = "src/main.rs"

# Composition only (§0.1 item 2). The plugin dependencies below exist for ONE reason: linking them
# so their `inventory::submit!` registrations land in the binary. The launcher never names a
# plugin type.
[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-hello = { workspace = true }
bough-plugin-ledger-sqlite = { workspace = true }
bough-plugin-ledger-memory = { workspace = true }
bough-plugin-projection-assembler = { workspace = true }
bough-plugin-projection-probe = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
include_dir = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
libc = { workspace = true }
# Phase 1 integration gates: the swap/bench/invariant/calibration tests speak the ledger and
# projection vocabularies directly, and the live calibration talks to Anthropic through bough-llm.
bough-plugin-ledger = { workspace = true }
bough-plugin-projection = { workspace = true }
bough-llm = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
