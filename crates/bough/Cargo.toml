[package]
name = "bough"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/andreylukin/bough"

[dependencies]
bough-core = { workspace = true }
bough-server = { workspace = true }
bough-tui = { workspace = true }
tokio = { workspace = true }
# `bough exec` is a loopback HTTP client with a streamed SSE body.
reqwest = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
# `bough tags sql` opens its own READ-ONLY connection — never the injected
# handle. The gate is structural (OPEN_READ_ONLY + PRAGMA query_only), which
# needs the driver directly.
rusqlite = { workspace = true }

[dev-dependencies]
# exec's tests drive the REAL route table over an in-memory database: the
# fake transport hands an axum Request to the server's dispatcher directly,
# so no socket is bound and nothing reads ~/.bough.
axum = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
