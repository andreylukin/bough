[package]
name = "bough"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "bough"
path = "src/lib.rs"

[[bin]]
name = "bough"
path = "src/main.rs"

# Composition only (§0.1 item 2). The plugin dependencies below exist for ONE reason: linking them
# so their `inventory::submit!` registrations land in the binary. The launcher never names a
# plugin type.
[dependencies]
bough-kernel = { workspace = true }
bough-util = { workspace = true }
bough-plugin-hello = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
include_dir = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
libc = { workspace = true }
