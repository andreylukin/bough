# V3's tree (WP-5): the offline model, plus the `actions-shim` Provider whose two configured
# delays ARE the two windows a `kill -9` lands in (§7).
#
# A TEMPLATE, not a finished layer: `crash_reconcile.rs` substitutes `@GH@`, `@BEFORE@` and
# `@AFTER@` and writes the result into the run's own `$BOUGH_HOME`. The shim's path is absolute
# and per-run, so it cannot be spelled in a committed file — and `actions-shim` takes the binary
# from CONFIG (never a hardcoded `gh`), which is exactly why no PATH trick is needed.
entries:
  # MERGE (track C → track B): `actions.github` is in `bundles/bough-base.yml` now and it registers
  # `open_pr` too. With both mounted the SHIM is not what runs the act — so the two configured
  # delays that ARE this file's kill windows never happen, the wake ends before the kill lands, and
  # `until_gh_called` waits out its deadline against a shim nobody called. Disabled here: this
  # fixture's whole subject is the reconciliation, and the shim is the Provider it reconciles.
  actions.github:
    disabled: true
  llm.anthropic:
    plugin: llm-replay
    config:
      # Not strict: the RESTART runs a second, different task through the same transcript, and a
      # run that fell off the end of the script must answer rather than fail — the crash is the
      # subject here, not the replay's strictness.
      strict: false
      models: "*"
      rounds:
        - match: "open a pr"
          chunks:
            - { type: tool_call, id: "call-open-pr", name: "open_pr",
                input: { target: "andrey/bough", payload: { title: "t", body: "b" } } }
            - { type: end, stop: tool_use }
        - chunks:
            - { type: text, text: "done" }
            - { type: end, stop: end_turn }
insert:
  - after: tool.actions
    entry:
      id: actions.shim
      plugin: actions-shim
      config:
        gh: "@GH@"
        kinds: [open_pr]
        delay_before_ms: @BEFORE@
        delay_after_ms: @AFTER@
