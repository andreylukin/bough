# V4's tree (WP-5): the offline model with a script long enough for several wakes, and nothing
# else. `fault-inject` rows are inserted by the TEST, one per case, because each case breaks a
# different named site and `after`/`times` differ per case — a committed row would fix them.
entries:
  llm.anthropic:
    plugin: llm-replay
    config:
      strict: true
      models: "*"
      rounds:
        - chunks: [{ type: text, text: "first" }, { type: end, stop: end_turn }]
        - chunks: [{ type: text, text: "second" }, { type: end, stop: end_turn }]
        - chunks: [{ type: text, text: "third" }, { type: end, stop: end_turn }]
        - chunks: [{ type: text, text: "fourth" }, { type: end, stop: end_turn }]
        - chunks: [{ type: text, text: "fifth" }, { type: end, stop: end_turn }]
        - chunks: [{ type: text, text: "sixth" }, { type: end, stop: end_turn }]
