# The phase's SWAP patch (§17 Phase 2): the `agent.loop` row keeps its id and its place, and
# changes plugin. `agent-loop-scripted` is a second Provider of the same seam, so nothing else in
# the tree moves — about-line, tools, workers and model-policy keep working against it.
#
# `config` is REPLACED wholesale (§0.5): the scripted driver's config has nothing in common with
# the live loop's, which is exactly why restating it is the honest spelling.
entries:
  agent.loop:
    plugin: agent-loop-scripted
    config:
      strict: true
      wakes:
        - steps:
            - chunks:
                - { chunk: text, text: "hello from the transcript" }
                - { chunk: end, stop: end_turn }
        - steps:
            - chunks:
                - { chunk: text, text: "and again" }
                - { chunk: end, stop: end_turn }
        - steps:
            - chunks:
                - { chunk: text, text: "and once more" }
                - { chunk: end, stop: end_turn }
