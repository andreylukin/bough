# `bough exec` offline (V9): the model is `llm-replay`, so one task runs end to end with no
# network and no key. The task itself comes from the `exec` row's own synthetic layer.
entries:
  llm.anthropic:
    plugin: llm-replay
    config:
      strict: false
      models: "*"
      rounds:
        - match: "two plus two"
          chunks:
            - { type: text, text: "four" }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "ok" }
            - { type: end, stop: end_turn }
