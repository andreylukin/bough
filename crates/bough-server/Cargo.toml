[package]
name = "bough-server"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/andreylukin/bough"

[dependencies]
libc         = { workspace = true }   # restart: signal the recorded server pid
bough-core = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
include_dir = { workspace = true }   # the vendored chart bundle (src/js/lib)

[dev-dependencies]
tower = { workspace = true }
# `start_paused` heartbeat tests (events.rs) advance tokio's clock manually.
tokio = { workspace = true, features = ["test-util"] }
# search.rs breaks `messages_fts` through a SECOND connection, so the failure
# under test is the real SQLite error, not what a stub says it would be.
rusqlite = { workspace = true }
