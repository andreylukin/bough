# `ask`: a question that blocks on an answer rather than spawning work.
id: 09-ask-a-question
prompt: >-
  Ask for the one thing you would need to know before renaming src/greet.txt, then stop and
  report what you asked.
covers: [ask]
pass:
  - pass: step_appended
    kind: tool/call
    count: 1
  - pass: step_appended
    kind: wake/end
    count: 1
