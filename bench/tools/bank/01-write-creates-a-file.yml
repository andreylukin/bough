# A file edit: create. The simplest thing either surface has to do.
id: 01-write-creates-a-file
prompt: >-
  Create the file src/created.txt in this repo whose entire contents are the single line
  `created by the bench`. Then answer in one short sentence.
covers: [write]
pass:
  - pass: file_equals
    path: src/created.txt
    text: "created by the bench"
  - pass: step_appended
    kind: tool/call
    count: 1
