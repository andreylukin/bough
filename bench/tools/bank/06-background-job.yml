# A long command that must not block the turn: start it named, read its output back.
id: 06-background-job
prompt: >-
  Start a background job named `slow` that sleeps one second and then writes the word `done`
  into src/bg.txt. Wait for it to finish, read its output back, and say what it printed.
covers: [bg]
pass:
  - pass: file_contains
    path: src/bg.txt
    needle: "done"
