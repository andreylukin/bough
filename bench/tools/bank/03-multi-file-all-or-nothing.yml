# A file edit: two files in ONE patch. All of them or none of them.
id: 03-multi-file-all-or-nothing
prompt: >-
  In a SINGLE patch, change src/a.txt to `alpha edited` and src/b.txt to `beta edited`.
  View both files first. Do not send two patches.
covers: [view, patch]
pass:
  - pass: file_equals
    path: src/a.txt
    text: "alpha edited"
  - pass: file_equals
    path: src/b.txt
    text: "beta edited"
