# Recorded transcript: 04-multi-step-shell, CODE-MODE arm.
#
# The same task as `../typed/04-multi-step-shell.yml`, in ONE `run(program)` round plus the answer. The token
# counts are deliberately larger per round (the surface section is in the prompt, the program is in
# the output) and fewer rounds: that trade is the thing the bench measures.
{
  "entries": {
    "llm.anthropic": {
      "plugin": "llm-replay",
      "config": {
        "strict": true,
        "models": "*",
        "rounds": [
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c0",
                "name": "run",
                "input": {
                  "program": "const g = await bash(\"wc -l < src/greet.txt\", \"app:linecount:greet\");\nconst n = await bash(\"wc -l < src/notes.md\", \"app:linecount:notes\");\nconsole.log(g, n);\nawait write(\"src/counts.txt\", \"4\\n4\\n\");"
                }
              },
              {
                "type": "usage",
                "input_tokens": 5600,
                "output_tokens": 320
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "text",
                "text": "greet.txt has 4 lines, notes.md has 4; written to src/counts.txt."
              },
              {
                "type": "usage",
                "input_tokens": 6400,
                "output_tokens": 60
              },
              {
                "type": "end",
                "stop": "end_turn"
              }
            ]
          }
        ]
      }
    }
  }
}
