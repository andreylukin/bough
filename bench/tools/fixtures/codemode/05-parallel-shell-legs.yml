# Recorded transcript: 05-parallel-shell-legs, CODE-MODE arm.
#
# `Promise.all` over `bash` legs, NOT `sh([...])`: no row in this tree registers a tool named `sh`,
# so the recorded program used to be one a real run could not have executed (an uncaught
# ReferenceError, ending the round). Concurrency in code mode is the language's, not a verb's.
#
# The same task as `../typed/05-parallel-shell-legs.yml`, in ONE `run(program)` round plus the answer. The token
# counts are deliberately larger per round (the surface section is in the prompt, the program is in
# the output) and fewer rounds: that trade is the thing the bench measures.
{
  "entries": {
    "llm.anthropic": {
      "plugin": "llm-replay",
      "config": {
        "strict": true,
        "models": "*",
        "rounds": [
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c0",
                "name": "run",
                "input": {
                  "program": "const [a, b] = await Promise.all([\n  bash(\"printf one > src/one.txt\", \"file:write:one\"),\n  bash(\"printf two > src/two.txt\", \"file:write:two\"),\n]);\nconsole.log(a + b);\nconsole.log(await bash(\"ls src/one.txt src/two.txt\", \"file:confirm:pair\"));"
                }
              },
              {
                "type": "usage",
                "input_tokens": 5600,
                "output_tokens": 320
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "text",
                "text": "Both files exist."
              },
              {
                "type": "usage",
                "input_tokens": 6400,
                "output_tokens": 60
              },
              {
                "type": "end",
                "stop": "end_turn"
              }
            ]
          }
        ]
      }
    }
  }
}
