# Recorded transcript: 12-ledger-drill, TYPED arm.
#
# A patch layer that replaces `llm.anthropic` with `llm-replay`, so the bench measures the SURFACE
# and not the model's mood. The rounds are consumed in order: one per tool call the typed surface
# needs, then the answer. The `usage` chunk is what the $ column is arithmetic over.
{
  "entries": {
    "llm.anthropic": {
      "plugin": "llm-replay",
      "config": {
        "strict": true,
        "models": "*",
        "rounds": [
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c0",
                "name": "ledger_read",
                "input": {
                  "op": "search",
                  "q": "bench"
                }
              },
              {
                "type": "usage",
                "input_tokens": 4200,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c1",
                "name": "ledger_read",
                "input": {
                  "op": "tail",
                  "n": 5
                }
              },
              {
                "type": "usage",
                "input_tokens": 5100,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c2",
                "name": "write",
                "input": {
                  "path": "src/drill.txt",
                  "content": "5\n"
                }
              },
              {
                "type": "usage",
                "input_tokens": 6000,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "text",
                "text": "Read 5 raw steps; the number is in src/drill.txt."
              },
              {
                "type": "usage",
                "input_tokens": 6900,
                "output_tokens": 60
              },
              {
                "type": "end",
                "stop": "end_turn"
              }
            ]
          }
        ]
      }
    }
  }
}
