# Recorded transcript: 03-multi-file-all-or-nothing, TYPED arm.
#
# A patch layer that replaces `llm.anthropic` with `llm-replay`, so the bench measures the SURFACE
# and not the model's mood. The rounds are consumed in order: one per tool call the typed surface
# needs, then the answer. The `usage` chunk is what the $ column is arithmetic over.
{
  "entries": {
    "llm.anthropic": {
      "plugin": "llm-replay",
      "config": {
        "strict": true,
        "models": "*",
        "rounds": [
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c0",
                "name": "view",
                "input": {
                  "path": "src/a.txt"
                }
              },
              {
                "type": "usage",
                "input_tokens": 4200,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c1",
                "name": "view",
                "input": {
                  "path": "src/b.txt"
                }
              },
              {
                "type": "usage",
                "input_tokens": 5100,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c2",
                "name": "patch",
                "input": {
                  "patch": "[src/a.txt#]\nSWAP 1.=1:\n+alpha edited\n[src/b.txt#]\nSWAP 1.=1:\n+beta edited"
                }
              },
              {
                "type": "usage",
                "input_tokens": 6000,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "text",
                "text": "Both files changed in one patch."
              },
              {
                "type": "usage",
                "input_tokens": 6900,
                "output_tokens": 60
              },
              {
                "type": "end",
                "stop": "end_turn"
              }
            ]
          }
        ]
      }
    }
  }
}
