# Recorded transcript: 14-schedule-an-intent, TYPED arm.
#
# A patch layer that replaces `llm.anthropic` with `llm-replay`, so the bench measures the SURFACE
# and not the model's mood. The rounds are consumed in order: one per tool call the typed surface
# needs, then the answer. The `usage` chunk is what the $ column is arithmetic over.
{
  "entries": {
    "llm.anthropic": {
      "plugin": "llm-replay",
      "config": {
        "strict": true,
        "models": "*",
        "rounds": [
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c0",
                "name": "schedule",
                "input": {
                  "at": "+5m",
                  "intent": "re-check src/greet.txt"
                }
              },
              {
                "type": "usage",
                "input_tokens": 4200,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "text",
                "text": "Scheduled a re-check of src/greet.txt in five minutes."
              },
              {
                "type": "usage",
                "input_tokens": 5100,
                "output_tokens": 60
              },
              {
                "type": "end",
                "stop": "end_turn"
              }
            ]
          }
        ]
      }
    }
  }
}
