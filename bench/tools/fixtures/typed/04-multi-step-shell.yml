# Recorded transcript: 04-multi-step-shell, TYPED arm.
#
# A patch layer that replaces `llm.anthropic` with `llm-replay`, so the bench measures the SURFACE
# and not the model's mood. The rounds are consumed in order: one per tool call the typed surface
# needs, then the answer. The `usage` chunk is what the $ column is arithmetic over.
{
  "entries": {
    "llm.anthropic": {
      "plugin": "llm-replay",
      "config": {
        "strict": true,
        "models": "*",
        "rounds": [
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c0",
                "name": "bash",
                "input": {
                  "command": "wc -l < src/greet.txt",
                  "tags": ["bash", "bench", "shell"]
                }
              },
              {
                "type": "usage",
                "input_tokens": 4200,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c1",
                "name": "bash",
                "input": {
                  "command": "wc -l < src/notes.md",
                  "tags": ["bash", "bench", "shell"]
                }
              },
              {
                "type": "usage",
                "input_tokens": 5100,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c2",
                "name": "write",
                "input": {
                  "path": "src/counts.txt",
                  "content": "4\n4\n"
                }
              },
              {
                "type": "usage",
                "input_tokens": 6000,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "text",
                "text": "greet.txt has 4 lines, notes.md has 4; written to src/counts.txt."
              },
              {
                "type": "usage",
                "input_tokens": 6900,
                "output_tokens": 60
              },
              {
                "type": "end",
                "stop": "end_turn"
              }
            ]
          }
        ]
      }
    }
  }
}
