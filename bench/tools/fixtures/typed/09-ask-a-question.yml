# Recorded transcript: 09-ask-a-question, TYPED arm.
#
# A patch layer that replaces `llm.anthropic` with `llm-replay`, so the bench measures the SURFACE
# and not the model's mood. The rounds are consumed in order: one per tool call the typed surface
# needs, then the answer. The `usage` chunk is what the $ column is arithmetic over.
{
  "entries": {
    "llm.anthropic": {
      "plugin": "llm-replay",
      "config": {
        "strict": true,
        "models": "*",
        "rounds": [
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c0",
                "name": "ask",
                "input": {
                  "question": "Is anything outside this repo allowed to reference src/greet.txt by name?"
                }
              },
              {
                "type": "usage",
                "input_tokens": 4200,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "text",
                "text": "I asked whether anything outside the repo references src/greet.txt by name."
              },
              {
                "type": "usage",
                "input_tokens": 5100,
                "output_tokens": 60
              },
              {
                "type": "end",
                "stop": "end_turn"
              }
            ]
          }
        ]
      }
    }
  }
}
