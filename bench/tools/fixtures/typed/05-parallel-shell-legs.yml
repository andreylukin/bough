# Recorded transcript: 05-parallel-shell-legs, TYPED arm.
#
# A patch layer that replaces `llm.anthropic` with `llm-replay`, so the bench measures the SURFACE
# and not the model's mood. The rounds are consumed in order: one per tool call the typed surface
# needs, then the answer. The `usage` chunk is what the $ column is arithmetic over.
{
  "entries": {
    "llm.anthropic": {
      "plugin": "llm-replay",
      "config": {
        "strict": true,
        "models": "*",
        "rounds": [
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c0",
                "name": "bash",
                "input": {
                  "command": "printf one > src/one.txt"
                }
              },
              {
                "type": "usage",
                "input_tokens": 4200,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c1",
                "name": "bash",
                "input": {
                  "command": "printf two > src/two.txt"
                }
              },
              {
                "type": "usage",
                "input_tokens": 5100,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "tool_call",
                "id": "c2",
                "name": "bash",
                "input": {
                  "command": "ls src/one.txt src/two.txt"
                }
              },
              {
                "type": "usage",
                "input_tokens": 6000,
                "output_tokens": 140
              },
              {
                "type": "end",
                "stop": "tool_use"
              }
            ]
          },
          {
            "chunks": [
              {
                "type": "text",
                "text": "Both files exist."
              },
              {
                "type": "usage",
                "input_tokens": 6900,
                "output_tokens": 60
              },
              {
                "type": "end",
                "stop": "end_turn"
              }
            ]
          }
        ]
      }
    }
  }
}
