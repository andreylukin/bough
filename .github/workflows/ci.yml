name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - run: cargo build --workspace --all-targets
      # nextest, one process per test, exactly like `make test`: the integration suites
      # set BOUGH_HOME and boot whole trees, so thread-parallel `cargo test` in one
      # process races them against each other. Doctests stay on `cargo test` because
      # nextest does not run them.
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@cargo-audit
      # Fails on actual advisories only. `cargo audit` reports unmaintained and
      # unsound crates as informational warnings without failing, which is right:
      # they are usually transitive and unfixable from here, and a gate that goes
      # red for something no PR author can act on gets ignored.
      - run: cargo audit
