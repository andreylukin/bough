# CI for the Go bough under go/: everything runs in parallel.
#   unit    — go test ./... on Linux and macOS (kernel, plugin, teatest,
#             headless e2e, and PTY suites). macOS is where bough is used
#             most. -race everywhere except the PTY suite (internal/vtreal):
#             it drives a separately built bough binary, so the detector
#             only slows its timing-sensitive screens down. Windows ships
#             no binary and its tests are not claimed to pass, so it is
#             compiled and vetted (cross), not tested. The race run is
#             four timing-balanced shards per OS, each with its own
#             build + test cache, so a PR reruns only what it changed.
#   cross   — every release target compiles and vets, so a tag never
#             discovers a build break on an architecture nobody ran
#   model   — scripts/model-test.sh: the FizzBee models and their tests
#   web-dist — bun test, typecheck + design check, and a rebuild of the
#             committed dist/app.js that must match
#   web-e2e — Playwright specs against real `bough --web` processes,
#             sharded 4 ways; each shard uploads a blob report and
#             web-e2e-report merges them into one HTML report
name: ci-go

on:
  push:
    branches: [main]
    paths: ['go/**', 'scripts/model-test.sh', '.github/workflows/ci-go.yml']
  pull_request:
    paths: ['go/**', 'scripts/model-test.sh', '.github/workflows/ci-go.yml']
  # Nightly: the model job's exhaustive run (every transition in the
  # browser and on the server, and the fizzbee-mbt random runs), too
  # slow to gate a push.
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # The race-checked packages take minutes even split up, so they run
    # as four jobs, and the PTY suite as a fifth, all in parallel.
    # scripts/test-shards.sh bin-packs the packages by their recorded
    # times (scripts/test-timings.tsv); by name, plugins/ui, plugins/tools
    # and tests/model/mbt kept landing together in one slow shard.
    name: unit (${{ matrix.os }}, ${{ matrix.shard == 'pty' && 'pty' || format('race {0}/4', matrix.shard) }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: ['1', '2', '3', '4', pty]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      # setup-go's own cache is keyed on go.sum alone and only saved on a
      # miss, so after the first run its test results never refresh, and
      # nine jobs race to write the one key. Each job keeps its own cache
      # below instead.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      # The test cache keys a test's result on the mtime of every file in
      # the module it opened, and a checkout stamps every file with the
      # time of the checkout, so without this no result from an earlier
      # run is ever reused. Contents are covered by the build hash.
      - name: Pin checkout mtimes for the test cache
        run: find . -path ./.git -prune -o -exec touch -h -t 200001010000 {} +
        working-directory: .
      - name: Go cache paths
        id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
      # Build and test cache (both live in GOCACHE) plus modules, one per
      # os and shard. A PR restores the newest one main saved, so the
      # packages it does not change report (cached) instead of running.
      # Only pushes to main save: one entry per shard per commit already
      # fills the repo's cache quota quickly.
      - name: Restore Go build and test cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: go-test-${{ runner.os }}-${{ matrix.shard }}-
      # The pre-commit hook runs this too; CI is what catches a commit
      # made with --no-verify. gofmt and vet answer the same on any
      # runner (vet per GOOS runs in cross).
      - name: gofmt + vet
        if: matrix.os == 'ubuntu-latest' && matrix.shard == '1'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
          go vet ./...
          scripts/test-shards_test.sh
      # Few vCPUs: wide parallelism only starves the timing-sensitive
      # TUI and PTY tests. No -count=1: an unchanged package's cached
      # result is the point of the cache above. A race binary sleeps
      # atexit_sleep_ms (1 s) before it exits, paid once per package and
      # per re-exec'd child; races found are still reported and fail.
      - name: test (race, shard ${{ matrix.shard }}/4)
        if: matrix.shard != 'pty'
        env:
          GORACE: atexit_sleep_ms=0
        run: |
          set -euo pipefail
          # The model job runs MBT with its pinned Fizz tools and a
          # budget for the complete generated walks.
          pkgs=$(go list ./... | grep -Ev '/internal/vtreal$|/tests/model/mbt$' | scripts/test-shards.sh ${{ matrix.shard }} 4)
          echo "$pkgs"
          go test -race -parallel 4 -timeout 20m $pkgs
      - name: test (PTY suite)
        if: matrix.shard == 'pty'
        run: go test -parallel 4 -timeout 20m ./internal/vtreal/
      - name: Save Go build and test cache
        if: github.event_name == 'push' && !cancelled()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ matrix.shard }}-${{ github.sha }}

  # A release cross-compiles four targets from one runner. Finding out
  # at tag time that one of them does not build is finding out too late.
  # Windows is here too: no binary is published for it, but the
  # Unix-only calls are behind build tags and this keeps them that way.
  cross:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      - name: Build every release target
        run: |
          set -euo pipefail
          # One arch per OS: GOARCH rarely breaks a pure-Go build, GOOS does.
          for target in darwin/arm64 linux/amd64 windows/amd64; do
            echo "building $target"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/bough
          done
      - name: Vet darwin and windows
        run: |
          set -euo pipefail
          for goos in darwin windows; do
            echo "vet $goos"
            CGO_ENABLED=0 GOOS=$goos go vet ./...
          done

  # dist/app.js is committed and go:embed-ed. A source change without a
  # rebuild ships the old UI, so rebuild and require no diff.
  web-dist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/internal/serve/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run build
      - name: dist/app.js matches a fresh build
        run: git diff --exit-code --stat -- dist/app.js

  # The FizzBee models and the model-based tests that drive the real
  # code from them. The script fetches its own pinned binaries.
  model:
    runs-on: ubuntu-latest
    # A push walks every state; the nightly run takes every transition.
    timeout-minutes: ${{ github.event_name == 'schedule' && 360 || 180 }}
    env:
      MODEL_COVER: ${{ github.event_name == 'schedule' && 'transitions' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      # The runner's default node cannot strip TS types; the path
      # generator's tests run on node directly.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: go/tests/web/package-lock.json
      # The script's last steps walk the model paths in a browser and
      # check the transcripts they leave.
      - run: npm ci
        working-directory: go/tests/web
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: go/tests/web
      - run: scripts/model-test.sh

  web-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      # Build the binary once here; global-setup skips its own build
      # when BOUGH_BIN is set.
      - run: go build -o "$GITHUB_WORKSPACE/bough-go-bin" ./cmd/bough
        working-directory: go
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: go/tests/web/package-lock.json
      - run: npm ci
        working-directory: go/tests/web
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('go/tests/web/package-lock.json') }}
      # The cache holds the browser but not the apt packages it links
      # against, so a hit still needs the system deps.
      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
        working-directory: go/tests/web
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: go/tests/web
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        working-directory: go/tests/web
        env:
          BOUGH_BIN: ${{ github.workspace }}/bough-go-bin
      # Uploaded even when green: the merge job needs every shard's blob.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: go/tests/web/blob-report/
          retention-days: 3
          if-no-files-found: ignore

  # One HTML report for the whole run instead of four to open.
  web-e2e-report:
    if: ${{ !cancelled() }}
    needs: web-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/tests/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: go/tests/web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: go/tests/web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: go/tests/web/playwright-report/
          retention-days: 14
