# CI for the Go bough under go/: everything runs in parallel.
#   unit    — go vet + go test -race ./... (kernel, plugin, teatest,
#             headless e2e, and PTY suites; each test is isolated, so
#             the whole tree runs fully parallel in one job) on Linux,
#             macOS and Windows. macOS is where bough is used most and
#             was long unchecked; Windows is where nobody has run it, so
#             the tests are the only thing that can say whether it works
#             (GitHub's runners ship Git Bash, which is the `sh` that
#             tools.bash needs)
#   cross   — every release target compiles, so a tag never discovers a
#             build break on an architecture nobody ran, plus Windows,
#             which ships no binary but must keep compiling
#   web-e2e — Playwright specs against real `bough --web` processes,
#             sharded 4 ways
name: ci-go

on:
  push:
    branches: [main]
    paths: ['go/**', '.github/workflows/ci-go.yml']
  pull_request:
    paths: ['go/**', '.github/workflows/ci-go.yml']

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows does not pass yet and is not claimed to. The job runs so
    # the failures are enumerated rather than imagined — see the
    # Windows section of the README — but it does not gate a merge on a
    # platform bough does not ship a binary for.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true # modules + build cache
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      # Two vCPUs: 16-way parallelism only starves the timing-sensitive
      # TUI and PTY tests. -race is the point of running it here.
      - run: go test -race -parallel 4 -timeout 20m ./...

  # A release cross-compiles four targets from one runner. Finding out
  # at tag time that one of them does not build is finding out too late.
  # Windows is here too: no binary is published for it and nobody has
  # run bough there, but the Unix-only calls are behind build tags now
  # and this is what keeps them that way.
  cross:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      - name: Build every release target
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "building $target"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/bough
          done

  web-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      # Build the binary once here; global-setup skips its own build
      # when BOUGH_BIN is set.
      - run: go build -o "$GITHUB_WORKSPACE/bough-go-bin" ./cmd/bough
        working-directory: go
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: go/tests/web/package-lock.json
      - run: npm ci
        working-directory: go/tests/web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('go/tests/web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: go/tests/web
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        working-directory: go/tests/web
        env:
          BOUGH_BIN: ${{ github.workspace }}/bough-go-bin
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: go/tests/web/test-results/
          if-no-files-found: ignore
