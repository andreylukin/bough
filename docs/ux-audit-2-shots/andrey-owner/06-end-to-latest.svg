<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="435.00" y="206.00" width="10.00" height="21.00" fill="#2d3f60"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle</text><text x="365.00" y="51.26" fill="#8b92a1" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3. </text><text x="395.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Handle Job Control</text><text x="575.00" y="51.26" fill="#d0d0d0" textLength="590.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Applications rely on terminal job control signals (Ctrl+C</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail reply with exactly th…</text><text x="395.00" y="72.26" fill="#d0d0d0" textLength="790.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sends SIGINT, Ctrl+Z sends SIGSTOP). These signals only work properly through a</text><text x="35.00" y="93.26" fill="#8b92a1" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">QX-LATE…</text><text x="395.00" y="93.26" fill="#d0d0d0" textLength="800.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">PTY's session leadership mechanism, allowing the multiplexer to properly control</text><text x="395.00" y="114.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">foreground and background processes.</text><text x="15.00" y="135.26" fill="#d0d0d0" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ terra</text><text x="315.00" y="135.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle</text><text x="365.00" y="156.26" fill="#8b92a1" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">4. </text><text x="395.00" y="156.26" fill="#d0d0d0" font-weight="bold" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Preserve Terminal State</text><text x="625.00" y="156.26" fill="#d0d0d0" textLength="570.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: PTYs maintain terminal modes and settings (like raw vs.</text><text x="395.00" y="177.26" fill="#d0d0d0" textLength="810.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">cooked mode) that affect how input is processed, which is crucial for interactive</text><text x="395.00" y="198.26" fill="#d0d0d0" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">applications.</text><text x="365.00" y="240.26" fill="#d0d0d0" textLength="820.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Without pseudo-terminals, a terminal multiplexer would be reduced to simple stream</text><text x="365.00" y="261.26" fill="#d0d0d0" textLength="850.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">redirection, losing the rich interactive capabilities that make terminal multiplexing</text><text x="365.00" y="282.26" fill="#d0d0d0" textLength="850.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">useful. The PTY layer is fundamental to how modern terminal applications communicate.</text><text x="365.00" y="303.26" fill="#d0d0d0" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── turn ended · completed </text><text x="365.00" y="324.26" fill="#9ece6a" textLength="850.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail In roughly three hundred words, explain what a pseudo-terminal is and why a</text><text x="365.00" y="345.26" fill="#d0d0d0" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── turn </text><text x="365.00" y="366.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="365.00" y="387.26" fill="#d0d0d0" textLength="590.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">reply with exactly this and nothing else: ZQX-LATEST-MARKER</text><text x="365.00" y="408.26" fill="#8b92a1" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">· usage/round</text><text x="365.00" y="429.26" fill="#d0d0d0" textLength="170.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ZQX-LATEST-MARKER</text><text x="365.00" y="450.26" fill="#d0d0d0" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── turn ended · completed </text><text x="365.00" y="471.26" fill="#9ece6a" textLength="690.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail reply with exactly this and nothing else: ZQX-LATEST-MARKER</text><text x="365.00" y="492.26" fill="#8b92a1" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">· usage/round</text><text x="365.00" y="513.26" fill="#7aa2f7" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search </text><text x="435.00" y="513.26" fill="#8b92a1" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[▏]</text><text x="15.00" y="765.26" fill="#7aa2f7" textLength="110.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bough 0.1.0</text><text x="125.00" y="765.26" fill="#8b92a1" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> · </text><text x="155.00" y="765.26" fill="#d0d0d0" textLength="400.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">~/repos/bough-rebuild/target/ux2/an…/cwd</text><text x="555.00" y="765.26" fill="#8b92a1" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> · </text><text x="585.00" y="765.26" fill="#d0d0d0" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">claude-haiku-4-5</text><text x="745.00" y="765.26" fill="#8b92a1" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> · 97% ctx · $0.02</text><text x="25.00" y="786.26" fill="#6f7783" textLength="340.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Type a message, or / for a command</text></svg>