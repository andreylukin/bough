" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">10. </text><text x="395.00" y="366.26" fill="#d0d0d0" font-weight="bold" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Common Commands</text><text x="545.00" y="366.26" fill="#d0d0d0" textLength="540.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - Quick reference for frequently used rebase commands</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">11. </text><text x="395.00" y="387.26" fill="#d0d0d0" font-weight="bold" textLength="170.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Advanced Features</text><text x="565.00" y="387.26" fill="#d0d0d0" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - Autosquash functionality</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">12. </text><text x="395.00" y="408.26" fill="#d0d0d0" font-weight="bold" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Decision Table</text><text x="535.00" y="408.26" fill="#d0d0d0" textLength="540.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - When to use rebase vs merge for different scenarios</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="280.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The guide has been saved to </text><text x="635.00" y="450.26" fill="#7aa2f7" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git-rebase-guide.md</text><text x="825.00" y="450.26" fill="#d0d0d0" textLength="390.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> and covers everything from basic usage</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="660.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">to advanced techniques with concrete examples and visual diagrams!</text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `explain how git rebase works in detail with examples`; I'll create; a detai</text><text x="355.00" y="534.26" fill="#707680" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / worker_</text><text x="355.00" y="555.26" fill="#7aa2f7" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s49 request/header  {"as_of":48,"budget":96000,"call":{"effort":null,"max_tokens":</text><text x="355.00" y="576.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s42 request/header  {"as_of":41,"budget":96000,"call":{"effort":null,"max_tokens":</text><text x="355.00" y="597.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s31 request/header  {"as_of":30,"budget":96000,"call":{"effort":null,"max_tokens":</text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>