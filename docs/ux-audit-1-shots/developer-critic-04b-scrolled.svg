<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="415.00" y="206.00" width="10.00" height="21.00" fill="#2d3f60"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `explain how git reba…</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1. </text><text x="385.00" y="72.26" fill="#d0d0d0" font-weight="bold" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Find the merge base</text><text x="575.00" y="72.26" fill="#d0d0d0" textLength="640.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Git identifies the common ancestor between your current branch</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">smoothe…</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="730.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">and the target branch. This is the point where the two branches diverged.</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2. </text><text x="385.00" y="135.26" fill="#d0d0d0" font-weight="bold" textLength="170.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Save your commits</text><text x="555.00" y="135.26" fill="#d0d0d0" textLength="630.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Git creates a list of all commits in your current branch that</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="620.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">are not in the target branch. These become your "patch stack."</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3. </text><text x="385.00" y="198.26" fill="#d0d0d0" font-weight="bold" textLength="170.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Reset your branch</text><text x="555.00" y="198.26" fill="#d0d0d0" textLength="630.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Git resets your current branch to point to the same commit as</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the target branch.</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">4. </text><text x="385.00" y="261.26" fill="#d0d0d0" font-weight="bold" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Replay each commit</text><text x="565.00" y="261.26" fill="#d0d0d0" textLength="610.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Git takes each commit from your saved list, one by one, and</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">applies it on top of the current HEAD. For each commit, Git tries to apply the changes</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="500.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">from that commit to the current state of the code.</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">5. </text><text x="385.00" y="345.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Handle conflicts</text><text x="545.00" y="345.26" fill="#d0d0d0" textLength="630.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: If any commit cannot be applied cleanly (because the code has</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="620.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">changed), Git will pause and ask you to resolve the conflicts.</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">6. </text><text x="385.00" y="408.26" fill="#d0d0d0" font-weight="bold" textLength="170.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Continue or abort</text><text x="555.00" y="408.26" fill="#d0d0d0" textLength="660.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: You can either resolve the conflicts and continue the rebase, or</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">abort the entire operation.</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Why Use Rebase?</text><text x="355.00" y="513.26" fill="#d0d0d0" font-weight="bold" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Cleaner History</text><text x="505.00" y="513.26" fill="#d0d0d0" textLength="690.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Rebase creates a linear history, making it easier to understand the</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>