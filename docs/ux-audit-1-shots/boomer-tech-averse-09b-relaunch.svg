<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="380.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle- Creating clean, linear histories</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Cleaning up commits before merging</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="470.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Updating your branch with latest changes from</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> main</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Avoiding unnecessary merge commits</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The key is understanding that rebase </text><text x="725.00" y="177.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">rewrites history</text><text x="885.00" y="177.26" fill="#d0d0d0" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> and should only be used on</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="760.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">commits that haven't been shared yet. When used appropriately, it keeps your</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">repository's history clear and easy to follow.</text><text x="355.00" y="240.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="261.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `Explain in detail how git rebase works, with lots of examples.`; I'll provi</text><text x="355.00" y="282.26" fill="#707680" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake </text><text x="355.00" y="303.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="810.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Write a very long essay about the history of the typewriter, at least 2000 words.</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="420.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'll write a comprehensive essay about the</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="730.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> history of the typewriter, ensuring it meets the 2000+ word requirement.</text><text x="355.00" y="387.26" fill="#707680" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · interrupted </text><text x="355.00" y="408.26" fill="#707680" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake </text><text x="355.00" y="429.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="60.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say OK</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">OK</text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="220.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `say OK`; OK</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>