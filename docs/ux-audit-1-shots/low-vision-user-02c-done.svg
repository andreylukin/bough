<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle## What I'm Good At</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `what can you do here…</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">give me…</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="60.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I can:</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ✅  Analyze code and propose changes</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="590.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ✅  Automate repetitive tasks (file operations, scripting)</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ✅  Coordinate with GitHub/Linear workflows</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="500.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ✅  Break down complex problems into worker tasks</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="530.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ✅  Debug issues by examining logs and running tests</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Limitations</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I can't:</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="420.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ❌  Access systems outside this task tree</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="510.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ❌  Create Linear tickets (that's Andrey's domain)</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ❌  Push to branches I didn't author</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ❌  Make decisions without asking you first</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">--- </text><text x="355.00" y="450.26" fill="#d0d0d0" font-weight="bold" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">What would you like me to help with?</text><text x="715.00" y="450.26" fill="#d0d0d0" textLength="450.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Just give me a task or question and I'll get</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">started!</text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `what can you do here?`; I'm; **sol**, an AI agent working in this task tree</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>