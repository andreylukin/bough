dGlyphs" xml:space="preserve">sol s23 request/header  {"as_of":22,"budget":96000,"call":{"effort":null,"max_tokens":</text><text x="355.00" y="639.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s12 thought/text  {"step_index":0,"text":" decisions I can't make myself\n- `spawn</text><text x="355.00" y="660.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s6 request/header  {"as_of":5,"budget":96000,"call":{"effort":null,"max_tokens":81</text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>