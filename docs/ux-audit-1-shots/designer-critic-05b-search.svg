0" y="114.26" fill="#d0d0d0" textLength="280.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Logical commit grouping</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">6. </text><text x="385.00" y="156.26" fill="#d0d0d0" font-weight="bold" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Advanced Scenarios</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="300.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Rebase with merge commits</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Autosquash</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Rebasing on remote branches</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">7. </text><text x="385.00" y="261.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Common Workflows</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Clean PR history</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="220.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Syncing with main</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Fixing commits after PR review</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">8. </text><text x="385.00" y="366.26" fill="#d0d0d0" font-weight="bold" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Troubleshooting</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   -