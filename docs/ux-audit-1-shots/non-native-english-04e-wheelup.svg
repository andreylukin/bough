<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="465.00" y="290.00" width="10.00" height="21.00" fill="#2d3f60"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#7aa2f7" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● </text><text x="35.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol</text><text x="285.00" y="51.26" fill="#7aa2f7" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">running</text><text x="355.00" y="51.26" fill="#d0d0d0" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> let me show you the file:</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `Please create a file…</text><text x="355.00" y="72.26" fill="#7aa2f7" font-weight="bold" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▾ read_file </text><text x="475.00" y="72.26" fill="#707680" textLength="720.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">notes.txt                                                               </text><text x="1195.00" y="72.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ✓</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The fil…</text><text x="355.00" y="93.26" fill="#707680" textLength="60.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">path: </text><text x="415.00" y="93.26" fill="#d0d0d0" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">notes.txt</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">This is the first line.</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">This is the second line.</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">This is the third line.</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Perfect</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">! I've created the file </text><text x="595.00" y="219.26" fill="#7aa2f7" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">notes.txt</text><text x="685.00" y="219.26" fill="#d0d0d0" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> with three lines:</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">This is the first line.</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">This is the second line.</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">This is the third line.</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="840.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The file has been successfully created in the current directory and contains exactly</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">72 bytes.</text><text x="355.00" y="387.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="408.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `Please create a file named notes.txt in the current directory with three li</text><text x="355.00" y="429.26" fill="#707680" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake </text><text x="355.00" y="450.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="690.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Explain in detail how git rebase works, with examples and many steps.</text><text x="355.00" y="492.26" fill="#d0d0d0" textLength="830.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'll provide you with a detailed explanation of how git rebase works with practical</text><text x="355.00" y="513.26" fill="#d0d0d0" textLength="410.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">examples and step-by-step demonstrations.</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>