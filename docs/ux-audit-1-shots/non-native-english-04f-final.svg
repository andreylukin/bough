eal-World Example</text><text x="665.00" y="261.26" fill="#d0d0d0" textLength="470.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - A full project scenario from start to finish</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The guide includes:</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="400.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- 40+ code examples you can copy and run</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="430.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Visual ASCII diagrams of commit histories</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="560.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Explanations of how commit hashes change during rebase</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Comparison tables (Rebase vs Merge)</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="280.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Recovery techniques using </text><text x="635.00" y="408.26" fill="#7aa2f7" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git reflog</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Safety tips like </text><text x="545.00" y="429.26" fill="#7aa2f7" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">--force-with-lease</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The file has been saved to </text><text x="625.00" y="471.26" fill="#7aa2f7" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git_rebase_guide.md</text><text x="815.00" y="471.26" fill="#d0d0d0" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> (12,096 bytes).</text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `Explain in detail how git rebase works, with examples and many steps.`; I'l</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="15.00" y="786.26" fill="#282d35" textLength="10.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">P</text><text x="25.00" y="786.26" fill="#b9bfca" text-decoration="underline" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">rior</text></svg>