<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="355.00" y="248.00" width="10.00" height="21.00" fill="#2d3f60"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="300.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle## Common Rebase Workflows</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `explain how git reba…</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">smoothe…</text><text x="355.00" y="93.26" fill="#d0d0d0" font-weight="bold" textLength="280.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Updating your feature branch</text><text x="635.00" y="93.26" fill="#d0d0d0" textLength="570.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Before creating a pull request, you rebase your feature</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="820.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">branch onto the latest main branch to ensure your changes are on top of the newest</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">code.</text><text x="355.00" y="177.26" fill="#d0d0d0" font-weight="bold" textLength="250.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Cleaning up local commits</text><text x="605.00" y="177.26" fill="#d0d0d0" textLength="600.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Use interactive rebase to squash, reorder, and refine your</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="280.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">commits before pushing them.</text><text x="355.00" y="240.26" fill="#d0d0d0" font-weight="bold" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Incorporating changes from upstream</text><text x="705.00" y="240.26" fill="#d0d0d0" textLength="500.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: If you've been working on a fork, you can rebase</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="430.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">your work onto the latest upstream commits.</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="170.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Final Thoughts</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="800.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Git rebase is a sophisticated tool that gives you fine-grained control over your</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="830.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">commit history. When used correctly on local or feature branches, it creates clean,</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="840.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">linear, easy-to-understand histories. However, it must be used carefully with shared</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="650.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">history to avoid confusing other developers. The golden rule is: </text><text x="1005.00" y="408.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">rebase early and</text><text x="355.00" y="429.26" fill="#d0d0d0" font-weight="bold" textLength="820.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">often on your own branches, but never on commits that have been shared with others</text><text x="1175.00" y="429.26" fill="#d0d0d0" textLength="10.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">.</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Understanding when and how to use rebase will significantly improve your Git workflows</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">and make collaboration smoother.</text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `explain how git rebase works in great detail, at least 60 lines, no tools`;</text><text x="355.00" y="534.26" fill="#707680" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / _</text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>