<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="60.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle- </text><text x="375.00" y="51.26" fill="#7aa2f7" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">push_to_pr</text><text x="475.00" y="51.26" fill="#d0d0d0" textLength="400.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Add commits to open PRs I've authored</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `what can you do here…</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="72.26" fill="#7aa2f7" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bash</text><text x="415.00" y="72.26" fill="#d0d0d0" textLength="380.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Any git operations via command line</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I work …</text><text x="355.00" y="114.26" fill="#d0d0d0" font-weight="bold" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Issue Tracking:</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="135.26" fill="#7aa2f7" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">linear_write</text><text x="495.00" y="135.26" fill="#d0d0d0" textLength="450.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Change status or comment on Linear tickets</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="156.26" fill="#7aa2f7" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bot_thread_op</text><text x="505.00" y="156.26" fill="#d0d0d0" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Manage bot review threads on PRs</text><text x="355.00" y="198.26" fill="#d0d0d0" font-weight="bold" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Collaboration:</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="219.26" fill="#7aa2f7" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ask</text><text x="405.00" y="219.26" fill="#d0d0d0" textLength="570.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Ask you (my spawner) for decisions I can't make myself</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="240.26" fill="#7aa2f7" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">spawn_worker</text><text x="495.00" y="240.26" fill="#d0d0d0" textLength="560.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Delegate self-contained tasks to a fresh worker agent</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## What This Means</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I can help with:</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="345.26" fill="#d0d0d0" font-weight="bold" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Implementing features</text><text x="585.00" y="345.26" fill="#d0d0d0" textLength="290.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — code changes, commits, PRs</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="366.26" fill="#d0d0d0" font-weight="bold" textLength="110.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Fixing bugs</text><text x="485.00" y="366.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — locating issues, testing, patching</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="387.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Automating tasks</text><text x="535.00" y="387.26" fill="#d0d0d0" textLength="290.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — scripting, bulk operations</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="408.26" fill="#d0d0d0" font-weight="bold" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Managing workflows</text><text x="555.00" y="408.26" fill="#d0d0d0" textLength="330.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — tickets, reviews, coordination</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="850.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I work best when you give me a specific task or problem to solve. What would you like</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">me to help with?</text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `what can you do here?`; I'm; sol, a task-oriented agent in the lane system.</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>