345.26" fill="#d0d0d0" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> through files</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="366.26" fill="#d0d0d0" font-weight="bold" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Open pull requests</text><text x="555.00" y="366.26" fill="#d0d0d0" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> or push commits</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="387.26" fill="#d0d0d0" font-weight="bold" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Manage Linear tickets</text><text x="585.00" y="387.26" fill="#d0d0d0" textLength="170.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> or GitHub issues</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="408.26" fill="#d0d0d0" font-weight="bold" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Spawn workers</text><text x="505.00" y="408.26" fill="#d0d0d0" textLength="170.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> for larger tasks</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Or anything else!</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="420.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Just let me know what you'd like to do! 😊 </text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="670.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `hello world`; Hello; ! 👋  Hello w