<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#7aa2f7" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● </text><text x="35.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol</text><text x="285.00" y="51.26" fill="#7aa2f7" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">running</text><text x="355.00" y="51.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="51.26" fill="#7aa2f7" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">push_to_pr</text><text x="475.00" y="51.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Push commits to PRs I've authored</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="72.26" fill="#7aa2f7" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bot_thread_op</text><text x="505.00" y="72.26" fill="#d0d0d0" textLength="280.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Manage bot review threads</text><text x="355.00" y="114.26" fill="#d0d0d0" font-weight="bold" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Project Management</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="135.26" fill="#7aa2f7" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">linear_write</text><text x="495.00" y="135.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Update Linear ticket status or add comments</text><text x="355.00" y="177.26" fill="#d0d0d0" font-weight="bold" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Collaboration</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="198.26" fill="#7aa2f7" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ask</text><text x="405.00" y="198.26" fill="#d0d0d0" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Ask you for decisions I can't make myself</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="219.26" fill="#7aa2f7" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">spawn_worker</text><text x="495.00" y="219.26" fill="#d0d0d0" textLength="690.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Delegate self-contained tasks to another worker with fresh context</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## What I'm Good At</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="60.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I can:</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ✅  Analyze code and propose changes</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="590.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ✅  Automate repetitive tasks (file operations, scripting)</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ✅  Coordinate with GitHub/Linear workflows</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="500.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ✅  Break down complex problems into worker tasks</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="530.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ✅  Debug issues by examining logs and running tests</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Limitations</text><text x="355.00" y="492.26" fill="#d0d0d0" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I can't:</text><text x="355.00" y="513.26" fill="#d0d0d0" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- ❌  Access systems outside this</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>