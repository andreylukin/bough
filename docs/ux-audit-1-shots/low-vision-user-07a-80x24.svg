6" fill="#d0d0d0" textLength="390.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">from basics to dangerous scenarios with</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="380.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">recovery strategies. It emphasizes the</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">critical rule: </text><text x="505.00" y="198.26" fill="#d0d0d0" font-weight="bold" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">never rebase shared/public</text><text x="355.00" y="219.26" fill="#d0d0d0" font-weight="bold" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">branches!</text><text x="445.00" y="219.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> 🚀 </text><text x="355.00" y="240.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="261.26" fill="#9ece6a" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `explain how git rebase works in det</text><text x="355.00" y="282.26" fill="#707680" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / Limitations</text><text x="355.00" y="303.26" fill="#7aa2f7" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s12 thought/text  {"step_index":0,"text":"</text><text x="15.00" y="513.26" fill="#565f89" textLength="800.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">unknown command `tmp`                                                           </text><text x="25.00" y="534.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>