<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="800.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idleremained the dominant version control system for many years, particularly in</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `say ONE`; read mail …</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">open-source projects.</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">TWO</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="690.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">CVS introduced several other important features that became standard:</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="800.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> the ability to branch development, tagging releases, and checking out arbitrary</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="820.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">versions. However, CVS had limitations. It was centralized, meaning all operations</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="830.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">required communication with a central server. Network latency could be problematic,</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="740.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">and the central repository was a single point of failure. Additionally, CV</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="810.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">S's approach to merging, while innovative for its time, was relatively primitive.</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="300.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Moving branches and tags was c</text><text x="355.00" y="261.26" fill="#707680" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · interrupted </text><text x="355.00" y="282.26" fill="#707680" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake </text><text x="355.00" y="303.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say ONE</text><text x="355.00" y="345.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say TWO</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="510.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'll respond to both of these messages from Andrey:</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ONE</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">TWO</text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `say ONE`; read mail `say TWO`; I'll respond; to both of these messages from</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>