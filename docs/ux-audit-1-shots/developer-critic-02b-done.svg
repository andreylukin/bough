<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="530.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle- Spawn worker agents for self-contained subtasks</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `what can you do here…</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="430.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Ask you for decisions I can't make myself</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">**What …</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="220.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## 📋  What I'm Good At</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Analyzing code and proposing fixes</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="410.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Automating repetitive development tasks</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Creating and managing pull requests</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="510.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Reading through codebases to understand structure</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="290.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Running tests and debugging</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Writing documentation and comments</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## ❓  How to Use Me</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="400.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Just tell me what you need! For example:</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- "Fix the bug in </text><text x="535.00" y="366.26" fill="#7aa2f7" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">src/api.js</text><text x="635.00" y="366.26" fill="#d0d0d0" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> where..."</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="530.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- "Create a PR to refactor the authentication module"</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="450.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- "Update the Linear ticket TEAM-123 to done"</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="390.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- "Search the codebase for all uses of </text><text x="745.00" y="429.26" fill="#7aa2f7" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">deprecated_function</text><text x="935.00" y="429.26" fill="#d0d0d0" textLength="10.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">"</text><text x="355.00" y="471.26" fill="#d0d0d0" font-weight="bold" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">What would you like me to help with?</text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `what can you do here?`; Hey; ! I'm **sol**, an AI agent working within this</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>