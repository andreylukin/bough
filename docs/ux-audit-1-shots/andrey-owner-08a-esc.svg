55.00" y="114.26" fill="#d0d0d0" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Core Capabilities</text><text x="355.00" y="156.26" fill="#d0d0d0" font-weight="bold" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Code &amp; File Management:</text><text x="355.00" y="177.26" fill="#7aa2f7" textLength="410.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Read, write, and edit files in the task</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> tree</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="580.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Search files with grep and find files with glob patterns</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="410.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Run shell commands and scripts via bash</text><text x="355.00" y="282.26" fill="#d0d0d0" font-weight="bold" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Git &amp; Pull Requests:</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Open pull requests on repositories</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Push commits to PRs I've authored</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Work with code changes and version control</text><text x="355.00" y="408.26" fill="#d0d0d0" font-weight="bold" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Project Management:</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Update Linear ticket status and add comments</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Manage bot review threads</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="290.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Track work items and issues</text><text x="355.00" y="513.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Task Delegation:</text><text x="355.00" y="534.26" fill="#707680" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / capabilities</text><text x="355.00" y="555.26" fill="#7aa2f7" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s8 thought/text  {"step_index":0,"text":"! I'm **sol**, a task-focused assistant. </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">unknown command `tmp`                                                                                                   </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>