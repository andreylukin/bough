serve"> — Run shell commands and get output/exit status</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">**Git</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> &amp; Pull Requests:**</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="303.26" fill="#7aa2f7" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">open_pr</text><text x="445.00" y="303.26" fill="#d0d0d0" textLength="390.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Create pull requests in repositories</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="324.26" fill="#7aa2f7" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">push_to_pr</text><text x="475.00" y="324.26" fill="#d0d0d0" textLength="400.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Add commits to open PRs I've authored</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="345.26" fill="#7aa2f7" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bash</text><text x="415.00" y="345.26" fill="#d0d0d0" textLength="380.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Any git operations via command line</text><text x="355.00" y="387.26" fill="#d0d0d0" font-weight="bold" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Issue Tracking:</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- `linear_write</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">` — Change status or comment on Linear tickets</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="450.26" fill="#7aa2f7" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bot_thread_op</text><text x="505.00" y="450.26" fill="#d0d0d0" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Manage bot review threads on PRs</text><text x="355.00" y="492.26" fill="#d0d0d0" font-weight="bold" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Collaboration:</text><text x="355.00" y="513.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="513.26" fill="#7aa2f7" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ask</text><text x="405.00" y="513.26" fill="#d0d0d0" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Ask you (my spawner) for</text><text x="355.00" y="534.26" fill="#707680" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / spawn_worker</text><text x="355.00" y="555.26" fill="#7aa2f7" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s50 request/header  {"as_of":49,"budget":96000,"call":{"effort":null,"max_tokens":</text><text x="355.00" y="576.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s43 request/header  {"as_of":42,"budget":96000,"call":{"effort":null,"max_tokens":</text><text x="355.00" y="597.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s32 request/header  {"as_of":31,"budget":96000,"call":{"effort":null,"max_tokens":</text><text x="355.00" y="618.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s23 request/header  {"as_of":22,"budget":96000,"call":{"effort":null,"max_tokens":</text><t