ble</text><text x="535.00" y="261.26" fill="#d0d0d0" textLength="540.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - When to use rebase vs merge for different scenarios</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The guide has</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> been saved to </text><text x="505.00" y="324.26" fill="#7aa2f7" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git-rebase-guide.md</text><text x="695.00" y="324.26" fill="#d0d0d0" textLength="510.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> and covers everything from basic usage to advanced</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="540.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">techniques with concrete examples and visual diagrams!</text><text x="355.00" y="366.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="387.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `explain how git rebase works in detail with examples`; I'll create; a detai</text><text x="355.00" y="408.26" fill="#707680" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake </text><text x="355.00" y="429.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="700.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">write a very long essay about the history of unix, at least 2000 words</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="840.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'll write a comprehensive essay about the history of Unix. This will be a detailed,</text><text x="355.00" y="492.26" fill="#d0d0d0" textLength="620.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">long-form piece covering its origins, development, and impact.</text><text x="355.00" y="513.26" fill="#707680" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · interrupted </text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>