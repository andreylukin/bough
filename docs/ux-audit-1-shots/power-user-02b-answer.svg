<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `what can you do here…</text><text x="355.00" y="72.26" fill="#d0d0d0" font-weight="bold" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Issue Tracking:</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="10.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">!</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="480.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Update Linear ticket statuses and add comments</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="550.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Operate on BOT review threads (reply, resolve, close)</text><text x="355.00" y="156.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Task Management:</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="490.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Spawn worker agents for self-contained subtasks</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="660.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Ask questions back to you when I need decisions or clarification</text><text x="355.00" y="240.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Current Context:</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'm in a fresh wake cycle and can work on whatever you need. I have access to the task</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="290.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">tree and all available tools.</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="600.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">What would you like me to help you with? For example, I can:</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="340.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Help you work on code or scripts</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="330.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Manage pull requests or tickets</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Perform file operations or searches</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="450.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Run commands to diagnose or build something</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Or anything else within those capabilities</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="470.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Just let me know what you'd like to accomplish!</text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `what can you do here?`; I can help; you with a variety of tasks! Here's wha</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>