the…</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="290.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">system. Here's what I can do:</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## 🛠</text><text x="405.00" y="135.26" fill="#d0d0d0" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Core Capabilities</text><text x="355.00" y="177.26" fill="#7aa2f7" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">**Code &amp; File</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Operations:**</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="390.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Read and write files in the task tree</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="420.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Search files with grep and glob patterns</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Edit files</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> (find and replace)</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="290.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Run shell commands via bash</text><text x="355.00" y="345.26" fill="#d0d0d0" font-weight="bold" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Git &amp; PR Management:</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="300.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Open pull requests as Andrey</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="400.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Push commits to open PRs I've authored</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Work with repositories</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">**Issue</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Tracking:**</text><text x="355.00" y="492.26" fill="#d0d0d0" textLength="530.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Update Linear tickets (change status, add comments)</text><text x="355.00" y="513.26" fill="#d0d0d0" textLength="410.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Interact with GitHub/bot review threads</text><text x="355.00" y="534.26" fill="#707680" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / Capabilities</text><text x="355.00" y="555.26" fill="#7aa2f7" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s8 thought/text  {"step_index":0,"text":"! I'm **sol**, an AI agent working within</text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">unknown command `tmp`                                                                                                   </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>