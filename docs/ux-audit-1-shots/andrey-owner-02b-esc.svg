<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `what can you do here…</text><text x="355.00" y="72.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Task Delegation:</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Feel fr…</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Spawn worker tasks for self-contained work</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="390.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Ask for decisions I can't make myself</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## How I Work</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'm designed to:</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1. </text><text x="385.00" y="219.26" fill="#d0d0d0" font-weight="bold" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Understand context</text><text x="565.00" y="219.26" fill="#d0d0d0" textLength="450.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> from the task description and recent history</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2. </text><text x="385.00" y="240.26" fill="#d0d0d0" font-weight="bold" textLength="110.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Take action</text><text x="495.00" y="240.26" fill="#d0d0d0" textLength="430.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> using the available tools to make progress</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3. </text><text x="385.00" y="261.26" fill="#d0d0d0" font-weight="bold" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Communicate clearly</text><text x="575.00" y="261.26" fill="#d0d0d0" textLength="290.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> about what I'm doing and why</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">4. </text><text x="385.00" y="282.26" fill="#d0d0d0" font-weight="bold" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Handle dependencies</text><text x="575.00" y="282.26" fill="#d0d0d0" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> by running dependent operations in sequence</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Next Steps</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="420.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">To help you effectively, I'd need to know:</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="387.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">What's the task?</text><text x="535.00" y="387.26" fill="#d0d0d0" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> What are you trying to accomplish?</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="408.26" fill="#d0d0d0" font-weight="bold" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">What repository or files</text><text x="615.00" y="408.26" fill="#d0d0d0" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> are involved?</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="429.26" fill="#d0d0d0" font-weight="bold" textLength="340.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Any specific goals or constraints?</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="560.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Feel free to share the details, and I'll get started! 🚀 </text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `what can you do here?`; Hello; ! I'm **sol**, a task-focused assistant. Her</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>