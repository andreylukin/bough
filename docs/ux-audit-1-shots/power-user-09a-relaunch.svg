<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="480.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle   - Using merge tools for complex conflicts</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="340.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - How to skip or abort a rebase</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Conflict marker explanation</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">4. </text><text x="385.00" y="156.26" fill="#d0d0d0" font-weight="bold" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Rebase vs Merge</text><text x="535.00" y="156.26" fill="#d0d0d0" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - Detailed comparison:</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="390.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Visual diagrams of both approaches</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="500.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Comprehensive comparison table (7 dimensions)</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="490.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Golden rules (DO's and DON'Ts with examples)</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="450.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Practical workflow examples showing real</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> scenarios</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="840.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The guide includes practical, real-world examples and emphasizes the critical rule: </text><text x="355.00" y="324.26" fill="#d0d0d0" font-weight="bold" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Never rebase published/shared commits</text><text x="725.00" y="324.26" fill="#d0d0d0" textLength="480.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">. All concepts are explained with diagrams, code</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="330.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">examples, and clear descriptions.</text><text x="355.00" y="366.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="387.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `explain in detail how git rebase works, interactive rebase, conflicts, and </text><text x="355.00" y="408.26" fill="#707680" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake </text><text x="355.00" y="429.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="700.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">write a very long essay about the history of unix, at least 2000 words</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'll write a comprehensive essay about the history of Unix for you. Let me create this</text><text x="355.00" y="492.26" fill="#d0d0d0" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">detailed document.</text><text x="355.00" y="513.26" fill="#707680" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · interrupted </text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>