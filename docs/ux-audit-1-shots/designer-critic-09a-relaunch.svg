<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="810.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle, developed in Ireland and Britain, combined Roman and Celtic influences into</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="830.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">distinctive, highly decorative letterforms. Carolingian minuscule, developed during</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="790.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the reign of Charlemagne (768-814), represented a revolutionary breakthrough in</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="690.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">readability. This script featured lowercase letters with clear distin</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="810.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ctions between characters, making text significantly easier to read than previous</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">scripts. The spacing, proportions, and differentiation between letterforms established</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="470.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">principles that scribes refined over centuries.</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="830.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">By the 12th century, Blackletter or Gothic script emerged, particularly in Northern</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="300.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Europe. This script featured t</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="770.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ightly compressed, angular letterforms that could fit more text onto precious</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">parchment. While economical, Blackletter sacrificed legibility for density, creating a</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="810.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">dense, almost textile-like appearance on the page. Despite its visual complexity,</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="690.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Blackletter became the dominant script throughout medieval Europe and</text><text x="355.00" y="345.26" fill="#707680" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · interrupted </text><text x="355.00" y="366.26" fill="#707680" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake </text><text x="355.00" y="387.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="60.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say hi</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="60.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Hi! 👋 </text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="430.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Great to see you! How can I help you today?</text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="280.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `say hi`; Hi; ! 👋 </text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>