<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="115.00" y="773.00" width="10.00" height="21.00" fill="#b9bfca"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle</text><text x="355.00" y="51.26" fill="#707680" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake </text><text x="355.00" y="72.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">what can you do here?</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I can help you with</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="540.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> a variety of tasks! Here's what I'm capable of doing:</text><text x="355.00" y="177.26" fill="#d0d0d0" font-weight="bold" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Code &amp; File Management:</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Read, write, and edit files in the task tree</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="420.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Search files with grep or list them with</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> glob patterns</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Run shell commands and scripts</text><text x="355.00" y="303.26" fill="#d0d0d0" font-weight="bold" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Git &amp; Pull Requests:</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Open pull requests on repositories</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Push commits to PRs I've authored</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="310.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Work with GitHub repositories</text><text x="355.00" y="408.26" fill="#d0d0d0" font-weight="bold" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Issue Tracking:</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="310.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Update Linear tickets (change</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="220.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> status, add comments)</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Manage bot review threads on GitHub</text><text x="355.00" y="492.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="744.26" fill="#b9bfca" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">line one                                                                                                                </text><text x="15.00" y="765.26" fill="#b9bfca" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">line two                                                                                                                </text><text x="15.00" y="786.26" fill="#b9bfca" text-decoration="underline" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">line three</text></svg>