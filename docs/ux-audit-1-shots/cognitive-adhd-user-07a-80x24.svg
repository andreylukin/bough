ll</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> commands and bash scripts</text><text x="355.00" y="240.26" fill="#d0d0d0" font-weight="bold" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Git &amp; Pull Requests:</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Open pull requests on repositories</text><text x="355.00" y="282.26" fill="#707680" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / pull</text><text x="355.00" y="303.26" fill="#7aa2f7" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s50 tool/result  {"attached":[],"call":"to</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s49 tool/call  {"args":{"command":"cat &gt; /</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s9 thought/text  {"step_index":0,"text":" </text><text x="15.00" y="513.26" fill="#565f89" textLength="800.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">unknown command `tmp`                                                           </text><text x="25.00" y="534.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>