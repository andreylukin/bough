<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="435.00" y="563.00" width="10.00" height="21.00" fill="#2d3f60"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="220.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle**Common workflows</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `Explain in detail ho…</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> I can help with:**</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The fil…</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Analyzing code and making changes</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Creating and managing PRs</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="310.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Running tests and diagnostics</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="410.00" lengthAdjust="spacingAndGlyphs" xml