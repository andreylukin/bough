<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="415.00" y="206.00" width="10.00" height="21.00" fill="#2d3f60"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#7aa2f7" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● </text><text x="35.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol</text><text x="285.00" y="51.26" fill="#7aa2f7" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">running</text><text x="355.00" y="51.26" fill="#d0d0d0" textLength="220.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## What is Git Rebase?</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `helluse bash to run:…</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">when `c…</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="840.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Git rebase is a fundamental Git operation that rewrites commit history. At its core,</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="840.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">it takes a sequence of commits and replays them on top of a new base commit. This is</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="810.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">different from merging, which creates a new "merge commit" that ties together two</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">diverging branches. Rebase, on the other hand, creates a linear history by moving your</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">entire branch to start from a different point.</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## The Basic Concept</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Imagine you're working on a feature branch that was created from the main branch three</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="800.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">commits ago. Meanwhile, your teammates have added five new commits to main. Your</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">feature branch is now "behind" the main branch. With rebase, you can move your feature</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="850.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">branch so it starts from the tip of main, and all your commits are replayed on top of</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">it in order.</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="820.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The fundamental operation is: find the common ancestor between your branch and the</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="750.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">target branch, save all your commits since that point, and then replay them</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="470.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sequentially on top of the target branch's tip.</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="430.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## How Rebase Actually Works Under the Hood</text><text x="355.00" y="513.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">When</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>