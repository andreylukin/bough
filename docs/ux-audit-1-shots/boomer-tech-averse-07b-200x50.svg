<svg xmlns="http://www.w3.org/2000/svg" width="2030" height="1102" viewBox="0 0 2030 1102" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="2030" height="1102" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="215.00" y="563.00" width="10.00" height="21.00" fill="#2d3f60"/><rect x="15.00" y="1067.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle</text><text x="355.00" y="51.26" fill="#65737e" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Start interactive rebase of last 3 commits</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `Explain in detail ho…</text><text x="355.00" y="72.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="72.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="72.26" fill="#bf616a" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> -i</text><text x="485.00" y="72.26" fill="#c0c5ce" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> HEAD</text><text x="535.00" y="72.26" fill="#bf616a" textLength="10.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">~</text><text x="545.00" y="72.26" fill="#c0c5ce" textLength="10.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The key…</text><text x="355.00" y="114.26" fill="#65737e" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Continue after resolving conflicts</text><text x="355.00" y="135.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="135.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="135.26" fill="#bf616a" textLength="110.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> --continue</text><text x="355.00" y="177.26" fill="#65737e" textLength="430.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Abort rebase and return to original state</text><text x="355.00" y="198.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="198.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="198.26" fill="#bf616a" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> --abort</text><text x="355.00" y="240.26" fill="#65737e" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Skip current commit during rebase</text><text x="355.00" y="261.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="261.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="261.26" fill="#bf616a" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> --skip</text><text x="355.00" y="303.26" fill="#65737e" textLength="330.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Rebase current branch onto main</text><text x="355.00" y="324.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="324.26" fill="#c0c5ce" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase main</text><text x="355.00" y="366.26" fill="#65737e" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Rebase and autosquash</text><text x="355.00" y="387.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="387.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="387.26" fill="#bf616a" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> -i --autosquash</text><text x="615.00" y="387.26" fill="#c0c5ce" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> main</text><text x="355.00" y="429.26" fill="#65737e" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Rebase with --onto</text><text x="355.00" y="450.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="450.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="450.26" fill="#bf616a" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> --onto</text><text x="525.00" y="450.26" fill="#c0c5ce" textLength="290.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> &lt;newbase&gt; &lt;oldbase&gt; &lt;branch&gt;</text><text x="355.00" y="492.26" fill="#65737e" textLength="290.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Rebase all unpushed commits</text><text x="355.00" y="513.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="513.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="513.26" fill="#bf616a" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> -i</text><text x="485.00" y="513.26" fill="#c0c5ce" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> @{u}</text><text x="355.00" y="555.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">---</text><text x="355.00" y="597.26" fill="#d0d0d0" textLength="110.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">### Summary</text><text x="355.00" y="639.26" fill="#d0d0d0" textLength="340.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Git rebase is a powerful tool for:</text><text x="355.00" y="660.26" fill="#d0d0d0" textLength="340.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Creating clean, linear histories</text><text x="355.00" y="681.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Cleaning up commits before merging</text><text x="355.00" y="702.26" fill="#d0d0d0" textLength="520.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Updating your branch with latest changes from main</text><text x="355.00" y="723.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Avoiding unnecessary merge commits</text><text x="355.00" y="765.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The key is understanding that rebase </text><text x="725.00" y="765.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">rewrites history</text><text x="885.00" y="765.26" fill="#d0d0d0" textLength="1040.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> and should only be used on commits that haven't been shared yet. When used appropriately, it keeps your</text><text x="355.00" y="786.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">repository's history clear and easy to follow.</text><text x="355.00" y="807.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="828.26" fill="#707680" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / worker</text><text x="355.00" y="849.26" fill="#7aa2f7" textLength="1660.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s42 request/header  {"as_of":41,"budget":96000,"call":{"effort":null,"max_tokens":8192,"meta":{},"model":"claude-haiku-4-5-20251001","tool_choice_none":false},"co</text><text x="355.00" y="870.26" fill="#d0d0d0" textLength="1660.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s31 request/header  {"as_of":30,"budget":96000,"call":{"effort":null,"max_tokens":8192,"meta":{},"model":"claude-haiku-4-5-20251001","tool_choice_none":false},"co</text><text x="355.00" y="891.26" fill="#d0d0d0" textLength="1660.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s22 request/header  {"as_of":21,"budget":96000,"call":{"effort":null,"max_tokens":8192,"meta":{},"model":"claude-haiku-4-5-20251001","tool_choice_none":false},"co</text><text x="355.00" y="912.26" fill="#d0d0d0" textLength="1660.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s16 about/line  {"intent":"to work on?** Just describe the task, and I'll get started!","of_wake":"01a04029-1cf2-7532-8d0a-c9db936950d2","state":"read mail `what </text><text x="355.00" y="933.26" fill="#d0d0d0" textLength="1660.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s11 thought/text  {"step_index":0,"text":"\n\n### 👥  **Collaboration**\n- **Ask questions** when I need a decision from you (my spawner)\n- **Spawn worker agents*</text><text x="355.00" y="954.26" fill="#d0d0d0" textLength="1660.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s8 thought/text  {"step_index":0,"text":" **sol**, a task worker. Here's what I can do:\n\n## **Core Capabilities**\n\n### 📝  **Code &amp; File Management**\n- **Read</text><text x="355.00" y="975.26" fill="#d0d0d0" textLength="1660.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s6 request/header  {"as_of":5,"budget":96000,"call":{"effort":null,"max_tokens":8192,"meta":{},"model":"claude-haiku-4-5-20251001","tool_choice_none":false},"comp</text><text x="15.00" y="1059.26" fill="#565f89" textLength="2000.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">unknown command `tmp`                                                                                                                                                                                   </text><text x="25.00" y="1080.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>