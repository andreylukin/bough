<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#7aa2f7" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● </text><text x="35.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol</text><text x="285.00" y="51.26" fill="#7aa2f7" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">running</text><text x="355.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Code &amp; File Management:</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Read, write, and edit files in the task tree</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="410.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Search files with regex patterns using </text><text x="765.00" y="93.26" fill="#7aa2f7" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">grep</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Find files matching glob patterns</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Run shell commands and scripts</text><text x="355.00" y="177.26" fill="#d0d0d0" font-weight="bold" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Git &amp; Pull Requests:</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Open pull requests to repositories</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Push commits to PRs I've authored</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Manage branches and version control</text><text x="355.00" y="282.26" fill="#d0d0d0" font-weight="bold" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Issue &amp; Project Management:</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="600.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Interact with Linear tickets (change status, add comments)</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="370.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Handle bot review threads on GitHub</text><text x="355.00" y="366.26" fill="#d0d0d0" font-weight="bold" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Task Automation:</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="490.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Spawn worker agents for self-contained subtasks</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="390.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Ask for decisions I can't make myself</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="400.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Execute complex workflows autonomously</text><text x="355.00" y="471.26" fill="#d0d0d0" font-weight="bold" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Workflow:</text><text x="355.00" y="492.26" fill="#d0d0d0" textLength="390.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- I work within a task tree environment</text><text x="355.00" y="513.26" fill="#d0d0d0" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- I can handle multi</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>