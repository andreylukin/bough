lengthAdjust="spacingAndGlyphs" xml:space="preserve">2</text><text x="395.00" y="135.26" fill="#d0d0d0" textLength="530.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - The only even prime number and the smallest prime.</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2. </text><text x="385.00" y="156.26" fill="#d0d0d0" font-weight="bold" textLength="10.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3</text><text x="395.00" y="156.26" fill="#d0d0d0" textLength="330.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - The smallest odd prime number.</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3. </text><text x="385.00" y="177.26" fill="#d0d0d0" font-weight="bold" textLength="10.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">5</text><text x="395.00" y="177.26" fill="#d0d0d0" textLength="340.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - The first prime that ends in 5.</text><text x="355.00" y="198.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">4. </text><text x="385.00" y="198.26" fill="#d0d0d0" font-weight="bold" textLength="10.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">7</text><text x="395.00" y="198.26" fill="#d0d0d0" textLength="400.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - A lucky prime with a mystical appeal.</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">5. </text><text x="385.00" y="219.26" fill="#d0d0d0" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">11</text><text x="405.00" y="219.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - The first two-digit prime number.</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">6. </text><text x="385.00" y="240.26" fill="#d0d0d0" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">13</text><text x="405.00" y="240.26" fill="#d0d0d0" textLength="660.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - An unlucky number in some cultures, but a perfectly good prime.</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">7. </text><text x="385.00" y="261.26" fill="#d0d0d0" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">17</text><text x="405.00" y="261.26" fill="#d0d0d0" textLength="610.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - A prime that appears frequently in mathematics and nature.</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">8. </text><text x="385.00" y="282.26" fill="#d0d0d0" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">19</text><text x="405.00" y="282.26" fill="#d0d0d0" textLength="610.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - Sophie Germain prime (2×19+1=39, though not prime itself).</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">9. </text><text x="385.00" y="303.26" fill="#d0d0d0" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">23</text><text x="405.00" y="303.26" fill="#d0d0d0" textLength="500.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - A prime used in cryptography and coding theory.</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">10. </text><text x="395.00" y="324.26" fill="#d0d0d0" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">29</text><text x="415.00" y="324.26" fill="#d0d0d0" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - A prime twin (related to 31).</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">11. </text><text x="395.00" y="345.26" fill="#d0d0d0" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">31</text><text x="415.00" y="345.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - Mersenne prime of the form 2^5-1.</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">12. </text><text x="395.00" y="366.26" fill="#d0d0d0" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">37</text><text x="415.00" y="366.26" fill="#d0d0d0" textLength="520.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - A prime with interesting divisibility properties.</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">13. </text><text x="395.00" y="387.26" fill="#d0d0d0" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">41</text><text x="415.00" y="387.26" fill="#d0d0d0" textLength="580.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - A prime that appears in various mathematical sequences.</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">14. </text><text x="395.00" y="408.26" fill="#d0d0d0" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">43</text><text x="415.00" y="408.26" fill="#d0d0d0" textLength="630.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - An emirp (reads as prime backwards: 34 is not prime though).</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">15. </text><text x="395.00" y="429.26" fill="#d0d0d0" font-weight="bold" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">47</text><text x="415.00" y="429.26" fill="#d0d0d0" textLength="600.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - A prime notable for its appearance in various algorithms.</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Done! 😊 </text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `list the first 15 prime numbers with a one-line note each`; I'll list; the </text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="786.26" fill="#b9bfca" text-decoration="underline" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/ag</text></svg>