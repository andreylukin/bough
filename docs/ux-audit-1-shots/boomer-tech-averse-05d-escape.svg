<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="215.00" y="563.00" width="10.00" height="21.00" fill="#2d3f60"/><rect x="45.00" y="773.00" width="10.00" height="21.00" fill="#b9bfca"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle---</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `Explain in detail ho…</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The key…</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">### Common Rebase Commands Reference</text><text x="355.00" y="135.26" fill="#65737e" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Start interactive rebase of last 3 commits</text><text x="355.00" y="156.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="156.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="156.26" fill="#bf616a" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> -i</text><text x="485.00" y="156.26" fill="#c0c5ce" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> HEAD</text><text x="535.00" y="156.26" fill="#bf616a" textLength="10.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">~</text><text x="545.00" y="156.26" fill="#c0c5ce" textLength="10.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3</text><text x="355.00" y="198.26" fill="#65737e" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Continue after resolving conflicts</text><text x="355.00" y="219.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="219.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="219.26" fill="#bf616a" textLength="110.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> --continue</text><text x="355.00" y="261.26" fill="#65737e" textLength="430.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Abort rebase and return to original state</text><text x="355.00" y="282.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="282.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="282.26" fill="#bf616a" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> --abort</text><text x="355.00" y="324.26" fill="#65737e" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Skip current commit during rebase</text><text x="355.00" y="345.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="345.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="345.26" fill="#bf616a" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> --skip</text><text x="355.00" y="387.26" fill="#65737e" textLength="330.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Rebase current branch onto main</text><text x="355.00" y="408.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="408.26" fill="#c0c5ce" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase main</text><text x="355.00" y="450.26" fill="#65737e" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Rebase and autosquash</text><text x="355.00" y="471.26" fill="#8fa1b3" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git</text><text x="385.00" y="471.26" fill="#c0c5ce" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> rebase</text><text x="455.00" y="471.26" fill="#bf616a" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> -i --autosquash</text><text x="615.00" y="471.26" fill="#c0c5ce" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> main</text><text x="355.00" y="513.26" fill="#65737e" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Rebase with --onto</text><text x="355.00" y="534.26" fill="#707680" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / worker</text><text x="355.00" y="555.26" fill="#7aa2f7" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s42 request/header  {"as_of":41,"budget":96000,"call":{"effort":null,"max_tokens":</text><text x="355.00" y="576.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s31 request/header  {"as_of":30,"budget":96000,"call":{"effort":null,"max_tokens":</text><text x="355.00" y="597.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol s22 request/header  {"as_of":21,"budget":96000,"call":{"effort":null,"max_tokens":</text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="15.00" y="786.26" fill="#b9bfca" text-decoration="underline" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">abc</text></svg>