ndGlyphs" xml:space="preserve">cat</text><text x="1155.00" y="450.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> is</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">run on it!</text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `helluse bash to run: pwd &amp;&amp; ls -la &amp;&amp; cat notes.txt`; I'll run; that bash c</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                   