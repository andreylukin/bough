<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="395.00" y="521.00" width="10.00" height="21.00" fill="#2d3f60"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle4. </text><text x="385.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Practical Use Cases</text><text x="575.00" y="51.26" fill="#d0d0d0" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - Real-world scenarios:</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `explain in great det…</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="300.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Cleaning up messy commits</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">This sh…</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="300.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Updating feature branches</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="280.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Splitting large commits</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="300.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   - Removing unwanted commits</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">5. </text><text x="385.00" y="177.26" fill="#d0d0d0" font-weight="bold" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Rebase vs Merge</text><text x="535.00" y="177.26" fill="#d0d0d0" textLength="530.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - Detailed comparison table showing when to use each</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">6. </text><text x="385.00" y="219.26" fill="#d0d0d0" font-weight="bold" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Advanced Techniques</text><text x="575.00" y="219.26" fill="#d0d0d0" textLength="530.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - Autosquash, exec hooks, and rerere (reuse recorded</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="110.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">resolution)</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">7. </text><text x="385.00" y="282.26" fill="#d0d0d0" font-weight="bold" textLength="250.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Best Practices &amp; Warnings</text><text x="635.00" y="282.26" fill="#d0d0d0" textLength="450.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> - The golden rule, common pitfalls, and team</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">communication guidelines</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="280.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The explanation is saved to </text><text x="635.00" y="345.26" fill="#7aa2f7" textLength="250.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git_rebase_explanation.md</text><text x="885.00" y="345.26" fill="#d0d0d0" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> and includes:</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Clear visual diagrams of before/after rebase</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="340.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Code examples for every scenario</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Command syntax and flags</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Important warnings about shared repositories</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">This should give you a thorough understanding of git rebase and interactive rebase! ✅ </text><text x="355.00" y="492.26" fill="#707680" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake end · completed </text><text x="355.00" y="513.26" fill="#9ece6a" textLength="860.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `explain in great detail how git rebase works, including interactive rebase,</text><text x="355.00" y="534.26" fill="#707680" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / _</text><text x="15.00" y="618.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/agents          the roster: status, trajectory, unconsumed mail                                                        </text><text x="15.00" y="639.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/drift [agent]   per-agent stability signals from the ledger                                                            </text><text x="15.00" y="660.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/focus &lt;agent&gt;   show one agent in the main pane                                                                        </text><text x="15.00" y="681.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help            the commands and key hints this surface has                                                            </text><text x="15.00" y="702.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/oldfeed         what the old-feed bridge last swept                                                                    </text><text x="15.00" y="723.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prime [text]    command memory and note evidence from the old bough db                                                 </text><text x="15.00" y="744.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/quit            tear the tree down and leave                                                                           </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/reconsolidate [agent] [--plan] [--since &lt;seq&gt;] distil, surface contradictions and expire stale evidence                </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>