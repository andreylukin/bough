<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle</text><text x="355.00" y="51.26" fill="#707680" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake </text><text x="355.00" y="72.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">what can you do here?</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'm</text><text x="365.00" y="135.26" fill="#d0d0d0" font-weight="bold" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol</text><text x="395.00" y="135.26" fill="#d0d0d0" textLength="620.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, an AI agent working in this task tree. Here's what I can do:</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Core Capabilities</text><text x="355.00" y="219.26" fill="#d0d0d0" font-weight="bold" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Code &amp; Files</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="240.26" fill="#7aa2f7" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read_file</text><text x="465.00" y="240.26" fill="#d0d0d0" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Read files in</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> the task tree</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="282.26" fill="#7aa2f7" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">write_file</text><text x="475.00" y="282.26" fill="#d0d0d0" textLength="250.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Create or modify files</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="303.26" fill="#7aa2f7" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">edit_file</text><text x="465.00" y="303.26" fill="#d0d0d0" textLength="400.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Make targeted edits to existing files</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="324.26" fill="#7aa2f7" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bash</text><text x="415.00" y="324.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Run shell commands and see output</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="345.26" fill="#7aa2f7" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">glob</text><text x="415.00" y="345.26" fill="#d0d0d0" textLength="310.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — List files matching patterns</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="366.26" fill="#7aa2f7" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">grep</text><text x="415.00" y="366.26" fill="#d0d0d0" textLength="330.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Search files for text/patterns</text><text x="355.00" y="408.26" fill="#d0d0d0" font-weight="bold" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">GitHub &amp; PRs</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- `open_pr</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="220.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">` — Open pull requests</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="471.26" fill="#7aa2f7" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">push_to_pr</text><text x="475.00" y="471.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Push commits to PRs I've authored</text><text x="355.00" y="492.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="492.26" fill="#7aa2f7" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bot_thread_op</text><text x="505.00" y="492.26" fill="#d0d0d0" textLength="280.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Manage bot review threads</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>