<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle</text><text x="355.00" y="51.26" fill="#707680" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake </text><text x="355.00" y="72.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">what can you do here?</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Hello</text><text x="355.00" y="135.26" fill="#d0d0d0" textLength="60.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">! I'm </text><text x="415.00" y="135.26" fill="#d0d0d0" font-weight="bold" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol</text><text x="445.00" y="135.26" fill="#d0d0d0" textLength="490.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, a task-focused assistant. Here's what I can do:</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Core Capabilities</text><text x="355.00" y="219.26" fill="#d0d0d0" font-weight="bold" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Code &amp; File Management:</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="410.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Read, write, and edit files in the task</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> tree</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="580.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Search files with grep and find files with glob patterns</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="410.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Run shell commands and scripts via bash</text><text x="355.00" y="345.26" fill="#d0d0d0" font-weight="bold" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Git &amp; Pull Requests:</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Open pull requests on repositories</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Push commits to PRs I've authored</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Work with code changes and version control</text><text x="355.00" y="471.26" fill="#d0d0d0" font-weight="bold" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Project Management:</text><text x="355.00" y="492.26" fill="#d0d0d0" textLength="460.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Update Linear ticket status and add comments</text><text x="355.00" y="513.26" fill="#d0d0d0" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- Manage bot review threads</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>