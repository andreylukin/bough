<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="715.00" y="290.00" width="10.00" height="21.00" fill="#2d3f60"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle</text><text x="355.00" y="51.26" fill="#707680" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── wake </text><text x="355.00" y="72.26" fill="#7aa2f7" font-weight="bold" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">andrey:</text><text x="355.00" y="93.26" fill="#d0d0d0" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">what can you do here?</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'm</text><text x="365.00" y="135.26" fill="#d0d0d0" font-weight="bold" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sol</text><text x="395.00" y="135.26" fill="#d0d0d0" textLength="380.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, a task worker. Here's what I can do:</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="30.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## </text><text x="385.00" y="177.26" fill="#d0d0d0" font-weight="bold" textLength="170.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Core Capabilities</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">### 📝  </text><text x="425.00" y="219.26" fill="#d0d0d0" font-weight="bold" textLength="220.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Code &amp; File Management</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="240.26" fill="#d0d0d0" font-weight="bold" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Read, write, and edit files</text><text x="645.00" y="240.26" fill="#d0d0d0" textLength="170.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> in the task tree</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="261.26" fill="#d0d0d0" font-weight="bold" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Search files</text><text x="495.00" y="261.26" fill="#d0d0d0" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> with</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> regex patterns</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="303.26" fill="#d0d0d0" font-weight="bold" textLength="100.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">List files</text><text x="475.00" y="303.26" fill="#d0d0d0" textLength="230.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> matching glob patterns</text><text x="355.00" y="324.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="324.26" fill="#d0d0d0" font-weight="bold" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Run shell commands</text><text x="555.00" y="324.26" fill="#d0d0d0" textLength="390.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> to execute code, tests, or build tasks</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">### 🔄  </text><text x="425.00" y="366.26" fill="#d0d0d0" font-weight="bold" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Git &amp; Pull Requests</text><text x="355.00" y="387.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="387.26" fill="#d0d0d0" font-weight="bold" textLength="180.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Open pull requests</text><text x="555.00" y="387.26" fill="#d0d0d0" textLength="160.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> on repositories</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="408.26" fill="#d0d0d0" font-weight="bold" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Push commits</text><text x="495.00" y="408.26" fill="#d0d0d0" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> to PRs I've authored</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- **Work</text><text x="355.00" y="450.26" fill="#d0d0d0" textLength="400.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> with branches** and manage code changes</text><text x="355.00" y="492.26" fill="#d0d0d0" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">### 🐛  </text><text x="425.00" y="492.26" fill="#d0d0d0" font-weight="bold" textLength="260.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Issue &amp; Project Management</text><text x="355.00" y="513.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="513.26" fill="#d0d0d0" font-weight="bold" textLength="360.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Comment on and update Linear tickets</text><text x="735.00" y="513.26" fill="#d0d0d0" textLength="300.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> (change status, add comments)</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>