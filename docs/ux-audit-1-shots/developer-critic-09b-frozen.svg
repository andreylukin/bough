<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="808" viewBox="0 0 1230 808" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17px"><rect width="1230" height="808" rx="8" fill="#282d35"/><circle cx="20.0" cy="19.0" r="7.0" fill="#ff5f56"/><circle cx="40.0" cy="19.0" r="7.0" fill="#ffbd2e"/><circle cx="60.0" cy="19.0" r="7.0" fill="#27c93f"/><rect x="515.00" y="542.00" width="10.00" height="21.00" fill="#2d3f60"/><rect x="15.00" y="773.00" width="10.00" height="21.00" fill="#6f7783"/><text x="15.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="50.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ sol</text><text x="315.00" y="51.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">idle</text><text x="355.00" y="51.26" fill="#d0d0d0" font-weight="bold" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Simpler Collaboration</text><text x="565.00" y="51.26" fill="#d0d0d0" textLength="630.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: When working on feature branches, rebasing keeps your commits</text><text x="35.00" y="72.26" fill="#9ece6a" textLength="320.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read mail `ok`; I see; you've a…</text><text x="355.00" y="72.26" fill="#d0d0d0" textLength="510.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">organized and prevents unnecessary "merge commits."</text><text x="35.00" y="93.26" fill="#707680" font-style="italic" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">intent (self-declared): </text><text x="275.00" y="93.26" fill="#bb9af7" textLength="80.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Is ther…</text><text x="355.00" y="114.26" fill="#d0d0d0" textLength="210.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Interactive Rebase</text><text x="355.00" y="156.26" fill="#d0d0d0" textLength="200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Interactive rebase (</text><text x="555.00" y="156.26" fill="#7aa2f7" textLength="130.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">git rebase -i</text><text x="685.00" y="156.26" fill="#d0d0d0" textLength="440.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">) is where rebase becomes truly powerful. It</text><text x="355.00" y="177.26" fill="#d0d0d0" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> allows you to:</text><text x="355.00" y="219.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="219.26" fill="#d0d0d0" font-weight="bold" textLength="150.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Reorder commits</text><text x="525.00" y="219.26" fill="#d0d0d0" textLength="480.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Change the order in which commits are replayed</text><text x="355.00" y="240.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="240.26" fill="#d0d0d0" font-weight="bold" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Squash commits</text><text x="515.00" y="240.26" fill="#d0d0d0" textLength="350.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Combine multiple commits into one</text><text x="355.00" y="261.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="261.26" fill="#d0d0d0" font-weight="bold" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Reword commits</text><text x="515.00" y="261.26" fill="#d0d0d0" textLength="240.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Change commit messages</text><text x="355.00" y="282.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="282.26" fill="#d0d0d0" font-weight="bold" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Edit commits</text><text x="495.00" y="282.26" fill="#d0d0d0" textLength="540.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Pause on specific commits to make additional changes</text><text x="355.00" y="303.26" fill="#d0d0d0" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">- </text><text x="375.00" y="303.26" fill="#d0d0d0" font-weight="bold" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Drop commits</text><text x="495.00" y="303.26" fill="#d0d0d0" textLength="250.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: Remove commits entirely</text><text x="355.00" y="345.26" fill="#d0d0d0" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">When you run `git rebase -i</text><text x="355.00" y="366.26" fill="#d0d0d0" textLength="70.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> HEAD~5</text><text x="425.00" y="366.26" fill="#7aa2f7" textLength="670.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, Git opens an editor showing the last 5 commits with options like </text><text x="1095.00" y="366.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">pick</text><text x="1135.00" y="366.26" fill="#7aa2f7" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, </text><text x="1155.00" y="366.26" fill="#d0d0d0" textLength="60.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">squash</text><text x="355.00" y="387.26" fill="#7aa2f7" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, </text><text x="375.00" y="387.26" fill="#d0d0d0" textLength="60.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">reword</text><text x="435.00" y="387.26" fill="#7aa2f7" textLength="20.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, </text><text x="455.00" y="387.26" fill="#d0d0d0" textLength="40.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">edit</text><text x="495.00" y="387.26" fill="#7aa2f7" textLength="60.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, and </text><text x="555.00" y="387.26" fill="#d0d0d0" textLength="600.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">drop`. You can modify these instructions, save, and Git will</text><text x="355.00" y="408.26" fill="#d0d0d0" textLength="120.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">execute them</text><text x="355.00" y="429.26" fill="#d0d0d0" textLength="140.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> sequentially.</text><text x="355.00" y="471.26" fill="#d0d0d0" textLength="190.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Rebase vs. Merge</text><text x="355.00" y="513.26" fill="#d0d0d0" textLength="850.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The key difference is in history presentation. A merge preserves the complete history</text><text x="355.00" y="534.26" fill="#707680" textLength="90.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search / </text><text x="15.00" y="765.26" fill="#565f89" textLength="1200.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">cancelled                                                                                                               </text><text x="25.00" y="786.26" fill="#6f7783" textLength="270.00" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, or / for a command</text></svg>