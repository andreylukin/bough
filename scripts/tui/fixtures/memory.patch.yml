# 10-memory.sh's patch: a replay transcript long enough for a whole GOVERNANCE pass.
#
# The suite's shared `llm-replay.patch.yml` carries a handful of rounds — enough for a
# conversation, and nowhere near enough for a seal pass that maps over every episode window of a
# seeded day. `strict: true` is kept on purpose: an unmatched request must FAIL the script rather
# than quietly return nothing, which is how a summarizer that called the model more often than
# anyone expected would show up here.
#
# A patch layer replaces an entry's `config` map wholesale, so the whole `llm-replay` config is
# restated. This layer is applied AFTER the shared one and wins.
entries:
  llm.anthropic:
    plugin: llm-replay
    config:
      strict: true
      models: "*"
      rounds:
        - chunks:
            - { type: text, text: "RECAP-0: the day was spent reading files and writing notes" }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "RECAP-1: the day was spent reading files and writing notes" }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "RECAP-2: the day was spent reading files and writing notes" }
            - { type: end, stop: end_turn }
