# The transcript V4/V9 (`19-interrupt.sh`, `24-honesty.sh`) boot with: a round that takes SECONDS
# to finish. Everything those scripts assert is about a turn that is still RUNNING — `esc to
# interrupt` named in the chrome, the spinner and the elapsed clock next to the answer, and Esc
# landing as an interrupt with a visible marker. Against the shared fixture, which completes in
# under two seconds, each of those bullets raced the end of the turn and passed or failed on
# timing rather than on behaviour.
entries:
  llm.anthropic:
    plugin: llm-replay
    config:
      strict: true
      models: "*"
      rounds:
        - chunks:
            - { type: text, text: "starting a long answer" }
            - { type: text, text: " that keeps going", delay_ms: 4000 }
            - { type: text, text: " and going", delay_ms: 4000 }
            - { type: text, text: " and going", delay_ms: 4000 }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "starting a long answer" }
            - { type: text, text: " that keeps going", delay_ms: 4000 }
            - { type: text, text: " and going", delay_ms: 4000 }
            - { type: text, text: " and going", delay_ms: 4000 }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "starting a long answer" }
            - { type: text, text: " that keeps going", delay_ms: 4000 }
            - { type: text, text: " and going", delay_ms: 4000 }
            - { type: text, text: " and going", delay_ms: 4000 }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "starting a long answer" }
            - { type: text, text: " that keeps going", delay_ms: 4000 }
            - { type: end, stop: end_turn }
