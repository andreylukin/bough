# The transcript V10 (`24-honesty.sh`) boots with, layered ON TOP of the suite's shared replay
# patch. One tool call, with a RELATIVE path and no directory component at all — which is the exact
# shape of blocker 5: the persona asked for a file "in the current directory", the screen said it
# had been written, and it was not in the directory the binary had been launched from.
#
# The assertion the fixture serves is a DISK assertion (`t_disk`): the file has to be at
# `$HOME_DIR/work/landing.txt`, the cwd the PTY launched the binary in, and nowhere else. Only the
# filesystem can refute what the screen claimed.
entries:
  llm.anthropic:
    plugin: llm-replay
    config:
      strict: true
      models: "*"
      rounds:
        - chunks:
            - type: tool_call
              id: call-write-cwd
              name: write_file
              input:
                path: "landing.txt"
                content: "the pinned root is the launch cwd\n"
            - { type: end, stop: tool_use }
        - chunks:
            - { type: text, text: "written to the current directory" }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "written to the current directory" }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "written to the current directory" }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "written to the current directory" }
            - { type: end, stop: end_turn }
