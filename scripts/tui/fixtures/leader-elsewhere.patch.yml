# 15-leader-swap.sh's swap: the `leader` set moves from `sol`'s scope to `terra`'s (§17 Phase 5's
# SWAP). ONE config field. The persona is restated because a patch layer replaces an entry's
# `config` map wholesale (§0.5) — and it must stay byte-identical to `bundles/bough-tui-app.yml`,
# or the script would be watching the persona CHANGE rather than MOVE.
entries:
  leader:
    config:
      agent: terra
      persona: |
        You hold the whole population in view. You adopt mail nobody claimed, draft Andrey's
        words into requirement claims, and propose splits, merges and new lanes as claims.
        You accept nothing: acceptance is Andrey's act alone.
      adopt_batch: 20
      attribute_reconsolidation: true
