# The transcript V6 (`21-stream.sh`) boots with, layered ON TOP of the suite's shared replay patch.
#
# Two things make it a fixture rather than a longer `llm-replay.patch.yml` round:
#
# 1. The answer is delivered in MANY chunks whose boundaries fall MID-WORD and MID-MARKDOWN — in
#    the middle of `implementa|tion`, between a heading's `##` and its text, and inside a fenced
#    code block. Phase ux1's rule is that the renderer accumulates and wraps ON PAINT, so a chunk
#    boundary can never become a line break and a half-arrived `**` can never render as literal
#    asterisks (M10, M19). A fixture whose chunks split at word boundaries would pass that
#    assertion without ever exercising it.
# 2. It carries one of every block kind the phase's `md::blocks` parses: a heading, bold, an inline
#    code span, a fenced block, a nested list and a table.
entries:
  llm.anthropic:
    plugin: llm-replay
    config:
      strict: true
      models: "*"
      rounds:
        - chunks:
            - { type: text, text: "## What the renderer" }
            - { type: text, text: " promises\n\nThe **accumul" }
            - { type: text, text: "ated** document is what gets wrapp" }
            - { type: text, text: "ed, never the chunk. That is why a long paragraph of ordinary prose can arrive in as many pieces as the network feels like sending and still come out as one reflowable paragraph with no mid-word break anywhere in it, at any terminal width.\n\n- first item, whose text is long enough that it has to wrap and therefore has to keep a hanging indent under its own bullet rather than sliding back to column zero\n  - a nested item\n- second item\n\nInline code looks like `measure" }
            - { type: text, text: "_cols` and a fence looks like:\n\n```rust\nfn wrap(doc: &str, width: u16)" }
            - { type: text, text: " -> Vec<Line> {\n    md::document(doc, width)\n}\n```\n\n| field | shown |\n|---|---|\n| model | yes |\n| cost | yes |\n" }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "## What the renderer promises\n\nThe **accumulated** document is what gets wrapped, never the chunk. That is why a long paragraph of ordinary prose can arrive in as many pieces as the network feels like sending and still come out as one reflowable paragraph with no mid-word break anywhere in it, at any terminal width.\n\n- first item, whose text is long enough that it has to wrap and therefore has to keep a hanging indent under its own bullet rather than sliding back to column zero\n  - a nested item\n- second item\n\nInline code looks like `measure_cols` and a fence looks like:\n\n```rust\nfn wrap(doc: &str, width: u16) -> Vec<Line> {\n    md::document(doc, width)\n}\n```\n\n| field | shown |\n|---|---|\n| model | yes |\n| cost | yes |\n" }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "## What the renderer promises\n\nThe **accumulated** document is what gets wrapped, never the chunk.\n" }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "## What the renderer promises\n\nThe **accumulated** document is what gets wrapped, never the chunk.\n" }
            - { type: end, stop: end_turn }
