# V7's TUI half: the model calls a DISCOVERED MCP tool, so the focus pane has to render an MCP
# tool call like any other. The tool name is the one `tool-mcp` registers for `28-mcp-tool.sh`'s
# hermetic stdio server (`mcp__` + the server row's `echofix` + the server's own `echo`); a name
# the registry did not produce would render as a failure and prove nothing.
#
# Round 1 stops on `tool_use` so the loop actually executes the call against the python fixture;
# round 2 closes the turn. The later rounds are spares — the script submits more than one prompt.
entries:
  llm.anthropic:
    plugin: llm-replay
    config:
      strict: false
      models: "*"
      rounds:
        - chunks:
            - type: tool_call
              id: call-mcp-1
              name: mcp__echofix__echo
              input: { text: "through the mcp seam" }
            - { type: end, stop: tool_use }
        - chunks:
            - { type: text, text: "the mcp tool ran" }
            - { type: end, stop: end_turn }
        - chunks:
            - { type: text, text: "the mcp tool ran" }
            - { type: end, stop: end_turn }
