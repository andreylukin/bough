# `make test` runs nextest: every test in its own process (which is what makes the folded
# tests/main.rs targets safe — env vars and process globals never leak between tests), all test
# binaries' tests scheduled across every core at once, and no fail-fast so one red test does not
# hide the others.
[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }

# `crates/bough`'s integration tests each boot the WHOLE tree (many spawn the binary and wait for
# it). Eighteen of those at once starve each other past their own 30 s boot deadlines on a loaded
# machine — a flake with no product cause. Cap them; everything else still runs wide open.
[test-groups]
boots = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(bough) & kind(test)'
test-group = 'boots'
# These boot the whole tree, and several SPAWN the binary and poll it. `crash_reconcile.rs` gives
# itself a 240 s budget on purpose (its own comment: "a deadline that fires under load is a flake,
# not a gate"), which the 180 s default kill cut short — nextest terminated the case before its own
# deadline could report what it was waiting for. The two budgets agree now: the harness gives the
# case room to reach its own deadline and say so.
slow-timeout = { period = "60s", terminate-after = 6 }

# `tools-operator`'s timing canaries assert CONCURRENCY and TEARDOWN with wall-clock bounds
# (three parallel 1 s sleeps under 2.2 s, and so on). Under a saturated full-workspace run this
# machine's process-spawn latency alone stretches three "parallel" sleeps past any bound that
# still excludes the sequential case (observed: 4.1-6.5 s wall for 3x1 s legs, all three retries
# red) — a flake with no product cause, green standalone every time. `threads-required` is the
# `boots` move in its strong form: nextest reserves the whole scheduler while a canary runs, so
# the wall clock it measures is its own. The retry stays for the residue (another PROCESS can
# still load the machine); a real regression fails every quiet try.
[[profile.default.overrides]]
filter = 'package(bough-plugin-tools-operator) & test(/the_legs_really_do_run_at_the_same_time|disposal_kills_every_live_job|a_leg_that_outruns_the_timeout/)'
threads-required = "num-cpus"
retries = 2
