# bundles/bough-base.yml — REQUIREMENTS §0.5. Phase 0: the verification fixture only.
#
# Two rows, not the literal one of §17: a consumer row with no provider cannot boot, because an
# enabled row that never activates is a boot failure (§0.2, Decision D14).
- id: greeting.provider
  plugin: greeting-echo
  config: { suffix: "" }
- id: hello.greeter
  plugin: hello
  config:
    who: world
    log_level: info

# Phase 1 (§3, §5): the ledger and the projection seam. `ledger-memory` and `projection-probe` are
# in the binary's catalog but in NO bundle — the swap patch names the one, the tests' own
# `$BOUGH_HOME` mounts the other.
- id: ledger
  plugin: ledger-sqlite
  config:
    path: !!expr 'bough_path("ledger.db")'
    busy_timeout_ms: 5000
- id: projection
  plugin: projection-assembler
  config:
    budget_tokens: 160000
    headroom: 0.6
    tail_steps: 60
    tail_floor_steps: 10
    mail_newest_n: 5
    max_tiers: 3
    file_view_dir: !!expr 'bough_path("views")'

# Phase 2 (§17 Phase 2): everything between a message and a model call and back. Row ORDER carries
# no load semantics (§0.2) — the reading order below is the seam order of §2.12, Definition before
# Provider before Consumer, so the file reads as the phase's dependency story.
#
# `agent-loop-scripted` and `llm-replay` are in the binary's catalog and in NO bundle: the swap
# patches name them, exactly as `ledger-memory` is handled.
- id: llm
  plugin: llm
- id: llm.anthropic
  plugin: llm-anthropic
  config:
    models: "*"
    api_key_env: ANTHROPIC_API_KEY
    request_timeout_ms: 120000
- id: llm.retry
  plugin: llm-retry
  config:
    max_attempts: 4
    min_delay_ms: 250
    max_delay_ms: 8000
    jitter: true
    retry_on: [transport, rate_limit, overloaded]
- id: tools
  plugin: tools
  config:
    default_deadline_ms: 120000
    max_parallel: 8
- id: tools.baseline
  plugin: tools-baseline
  config:
    # DEVIATION from plan §2.12's `!!expr 'cwd()'`: the expr language (§0.5) has no `cwd`
    # function, and a relative root is canonicalised against the process cwd anyway — which is
    # the same value, without inventing a function for one row.
    root: "."
    bash_timeout_ms: 120000
    max_output_bytes: 20000
    max_read_bytes: 400000
    deny_globs: []
- id: agents
  plugin: agents

- id: agent.loop
  plugin: agent-loop
  config:
    drain_debounce_ms: 120000
    grace_deadline_ms: 20000
    default_max_tokens: 8192
    prompt_ver: "p2.1"
    text_flush_ms: 400
    repair_on_boot: true
    status_drain_ms: 500
# BOTH models are claude-haiku-4-5-20251001 for this build: Andrey's choice for the testing
# period. Swapping either is a one-line patch, which is the whole point of them being config.
- id: model.policy
  plugin: model-policy
  config:
    sol: claude-haiku-4-5-20251001
    terra: claude-haiku-4-5-20251001
- id: about.line
  plugin: about-line
  config:
    max_state_chars: 400
    max_intent_chars: 200
- id: workers
  plugin: workers
  config:
    max_in_flight: 8
    max_depth: 3
    per_wake_spawn_cap: 4
- id: worker.spawn
  plugin: worker-spawn
  config:
    ask_mode: block
    max_steps: 40
- id: tool.spawn_worker
  plugin: tool-spawn_worker
- id: tool.ask
  plugin: tool-ask
- id: actions
  plugin: actions
- id: tool.actions
  plugin: tool-actions
# Phase 4 (§8, §17 Phase 4): memory governance, non-optional — §8 puts these three rows in
# `bough-base`. `rollups-none` is in the catalog and in NO bundle (the `ledger-memory` /
# `projection-probe` / `tui-probe` precedent); the swap patch names it.
- id: rollups
  plugin: rollups-summarizer
  config:
    prompt_ver: "r4.1"
    gap_minutes: 45
    max_window_steps: 10
    min_window_steps: 2
    fanout: 10
    max_tier: 3
    seal_lag_steps: 20
    max_calls_per_pass: 8
    max_notable_refs: 12
    max_evidence_refs: 24
    max_block_chars: 1200
    map_max_tokens: 1024
    reduce_max_tokens: 1536
- id: reconsolidation
  plugin: reconsolidation
  config:
    batch_steps: 400
    stale_after_days: 90
    expirable_kinds: ["mail/delivered", "tool/result"]
    max_contradiction_pairs: 24
    max_calls_per_pass: 6
    distill_max_tokens: 2048
    # The judge prompt's version, stamped on every `recon/request`. Must resolve in the binary's
    # prompt catalog or the row refuses to boot.
    judge_prompt_ver: recon-1
- id: drift.watch
  plugin: drift-watch
  config:
    window_steps: 500
    min_samples: 20
    thought_len_cv_flag: 1.2
    tool_entropy_flag: 0.35
    # How many raw steps a `/reset` cites, and how long the rebuilt state half may be. The second
    # is the same quantity the `about-line` row carries as `max_state_chars`: patch both together.
    max_evidence_cites: 24
    max_state_chars: 400
# Phase 5 (§17 Phase 5): routing, dormancy, claims and graph ops are NOT terminal features, so
# they live here and not in `bough-tui-app` — a headless tree routes mail, sleeps a lane and
# splits a trajectory exactly as the TUI one does. The `leader` set is the exception and lives in
# `bough-tui-app`: it is a per-agent scope mount, and which agent holds it is Andrey's choice.
#
# `dormancy` is the row that owns the `agent/wake-request` admission point (P5-D1); with it
# absent the waterfall's default is `Admit::Open` and the tree behaves exactly as Phase 4's did.
- id: mail
  plugin: mail-router
  config:
    unsorted_traj: "unsorted"
    unsorted_limit: 200
    # NOT a dormancy switch: §5 says mail QUEUES for a dormant agent, so delivery happens and the
    # WAKE is what dormancy suppresses.
    deliver_to_dormant: true
- id: dormancy
  plugin: dormancy
  config:
    reload_at_activation: true
- id: graph
  plugin: graph-ops
  config:
    max_children: 2
    digest_on_fork: false
    question_on_ambiguity: true
- id: claims
  plugin: claims
  config:
    open_limit: 50
- id: lane.scope
  plugin: lane-scope
  config:
    default_persona: null
    lanes: []
- id: worker.fork
  plugin: worker-fork
  config:
    max_steps: 24
- id: tool.fork
  plugin: tool-fork
