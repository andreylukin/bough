# bundles/bough-base.yml — REQUIREMENTS §0.5. Phase 0: the verification fixture only.
#
# Two rows, not the literal one of §17: a consumer row with no provider cannot boot, because an
# enabled row that never activates is a boot failure (§0.2, Decision D14).
- id: greeting.provider
  plugin: greeting-echo
  config: { suffix: "" }
- id: hello.greeter
  plugin: hello
  config:
    who: world
    log_level: info

# Phase 1 (§3, §5): the ledger and the projection seam. `ledger-memory` and `projection-probe` are
# in the binary's catalog but in NO bundle — the swap patch names the one, the tests' own
# `$BOUGH_HOME` mounts the other.
- id: ledger
  plugin: ledger-sqlite
  config:
    path: !!expr 'bough_path("ledger.db")'
    busy_timeout_ms: 5000
- id: projection
  plugin: projection-assembler
  config:
    budget_tokens: 160000
    headroom: 0.6
    tail_steps: 60
    tail_floor_steps: 10
    mail_newest_n: 5
    max_tiers: 3
    file_view_dir: !!expr 'bough_path("views")'

# Phase 2 (§17 Phase 2): everything between a message and a model call and back. Row ORDER carries
# no load semantics (§0.2) — the reading order below is the seam order of §2.12, Definition before
# Provider before Consumer, so the file reads as the phase's dependency story.
#
# `agent-loop-scripted` and `llm-replay` are in the binary's catalog and in NO bundle: the swap
# patches name them, exactly as `ledger-memory` is handled.
- id: llm
  plugin: llm
- id: llm.anthropic
  plugin: llm-anthropic
  config:
    models: "*"
    api_key_env: ANTHROPIC_API_KEY
    request_timeout_ms: 120000
- id: llm.retry
  plugin: llm-retry
  config:
    max_attempts: 4
    min_delay_ms: 250
    max_delay_ms: 8000
    jitter: true
    retry_on: [transport, rate_limit, overloaded]
- id: tools
  plugin: tools
  config:
    default_deadline_ms: 120000
    max_parallel: 8
- id: tools.baseline
  plugin: tools-baseline
  config:
    # DEVIATION from plan §2.12's `!!expr 'cwd()'`: the expr language (§0.5) has no `cwd`
    # function, and a relative root is canonicalised against the process cwd anyway — which is
    # the same value, without inventing a function for one row.
    root: "."
    bash_timeout_ms: 120000
    max_output_bytes: 20000
    max_read_bytes: 400000
    deny_globs: []
- id: agents
  plugin: agents
- id: agent.loop
  plugin: agent-loop
  config:
    drain_debounce_ms: 120000
    grace_deadline_ms: 20000
    default_max_tokens: 8192
    prompt_ver: "p2.1"
    text_flush_ms: 400
    repair_on_boot: true
    status_drain_ms: 500
# BOTH models are claude-haiku-4-5-20251001 for this build: Andrey's choice for the testing
# period. Swapping either is a one-line patch, which is the whole point of them being config.
- id: model.policy
  plugin: model-policy
  config:
    sol: claude-haiku-4-5-20251001
    terra: claude-haiku-4-5-20251001
- id: about.line
  plugin: about-line
  config:
    max_state_chars: 400
    max_intent_chars: 200
- id: workers
  plugin: workers
  config:
    max_in_flight: 8
    max_depth: 3
    per_wake_spawn_cap: 4
- id: worker.spawn
  plugin: worker-spawn
  config:
    ask_mode: block
    max_steps: 40
- id: tool.spawn_worker
  plugin: tool-spawn_worker
- id: tool.ask
  plugin: tool-ask
- id: actions
  plugin: actions
- id: tool.actions
  plugin: tool-actions

# ---- Phase 6 (track B): context, the write boundary, the runtime-code hosts ----
# The reading order is the seam order: Definition, Provider, Consumer.

# §9: scheduling is a seam. `schedule-manual` is in the catalog and in NO bundle.
- id: schedule
  plugin: schedule
- id: schedule.cron
  plugin: schedule-cron
  config: { state_db: !!expr 'bough_path("schedule.db")', job_timeout_ms: 300000 }

# §7: the boundary block, one source, every agent's projection.
- id: boundary
  plugin: boundary-instructions
- id: drafts
  plugin: drafts
  config: { retain: 500 }
- id: tool.drafts
  plugin: tool-drafts

# §7: the four kinds get their Providers. `actions` (Phase 2) refuses everything until they mount.
- id: actions.github
  plugin: actions-github
  config:
    gh_bin: gh
    known_bots: ["dependabot[bot]", "github-actions[bot]", "renovate[bot]", "codecov[bot]"]
    timeout_ms: 60000
- id: actions.linear
  plugin: actions-linear
  config:
    endpoint: "https://api.linear.app/graphql"
    api_key: !!expr 'env_or("LINEAR_API_KEY", "")'
    timeout_ms: 30000
- id: actions.reconcile
  plugin: actions-reconcile
  config: { at_boot: true, surface_to: sol }

# §6: collectors, each ONE row on ctx.schedule.
- id: collect.github
  plugin: collector-github
  config:
    cadence: { every_ms: 300000 }
    gh_bin: gh
    # EMPTY BY DEFAULT, and the row says so: every sweep reports a `repos` entry in `disabled`
    # and warns, rather than reporting success over nothing. Name repositories in the patch layer
    # to turn this collector on.
    repos: []
    prs: true
    review_requests: true
    mentions: true
    checks: false
    deliver_to: [sol]
    wake_classes: [review_request, mention]
    known_bots: ["dependabot[bot]", "github-actions[bot]", "renovate[bot]"]
    state_db: !!expr 'bough_path("collect-github.db")'
    batch: 50
    timeout_ms: 30000
- id: collect.linear
  plugin: collector-linear
  config:
    cadence: { every_ms: 600000 }
    endpoint: "https://api.linear.app/graphql"
    api_key: !!expr 'env_or("LINEAR_API_KEY", "")'
    # EMPTY BY DEFAULT, like `collect.github`'s `repos`: with neither set the row reports itself
    # off every sweep instead of sweeping the whole Linear workspace into `deliver_to`.
    teams: []
    projects: []
    deliver_to: [sol]
    wake_classes: [assigned, mention]
    state_db: !!expr 'bough_path("collect-linear.db")'
    batch: 50
    timeout_ms: 30000

# §6: the mcp seam.
- id: mcp
  plugin: mcp
- id: mcp.rmcp
  plugin: mcp-rmcp
  config: { servers: [], connect_timeout_ms: 15000, call_timeout_ms: 120000 }
- id: tool.mcp
  plugin: tool-mcp
  config: { prefix: "mcp__", max_result_bytes: 20000 }

# §9: the runtime-code hosts.
- id: wards
  plugin: wards-rhai
  config:
    # `bough_path`, NOT `home_path`: these dirs must follow `$BOUGH_HOME`, or every subprocess
    # test that isolates only `$BOUGH_HOME` scans and watches the developer's real `~/.bough`.
    dir: !!expr 'bough_path("wards")'
    glob: "*.rhai"
    watch: true
    debounce_ms: 400
    max_ops: 200000
    max_depth: 32
    max_string_bytes: 65536
    max_array_size: 4096
    eval_timeout_ms: 2000
    # The bound on the INDIRECT firing loop: a ward whose actions make an agent write a step the
    # ward triggers on feeds itself through that agent forever. Every individual firing is well
    # behaved, so only a rate over time can see it.
    max_firings_per_minute: 60
    limits: { max_actions: 16, max_spawns: 2, max_text_bytes: 8192 }
- id: hooks
  plugin: hooks-exec
  config:
    points: []
    max_output_bytes: 65536
    max_failures: 3
    limits: { max_actions: 16, max_spawns: 2, max_text_bytes: 8192 }
- id: mcp.subprocess
  plugin: mcp-subprocess
  config:
    processes: []
    limits: { max_actions: 16, max_spawns: 2, max_text_bytes: 8192 }
- id: skills
  plugin: skills
  config:
    # `bough_path`, NOT `home_path` — see the `wards` row.
    dir: !!expr 'bough_path("skills")'
    glob: "*.md"
    watch: true
    debounce_ms: 400
    max_bytes: 65536
    max_injected: 3
    scan_steps: 40

# §13: the sleep listener, and the one thing that consumes it. `power-test` is in the catalog and
# in NO bundle: the SWAP patch names it.
- id: power
  plugin: power
- id: power.sleep
  plugin: sleep-listener
  config: { enabled: true, min_sleep_ms: 60000, source: auto }
- id: catch-up.on-wake
  plugin: catch-up-on-wake
  config: { min_sleep_ms: 60000, kinds: [resident] }

# §8/§5: the two system passes as schedule rows.
- id: schedule.catch-up
  plugin: schedule-catch-up
  config: { cadence: { every_ms: 1800000 }, catch_up: true, kinds: [resident] }
- id: schedule.reconsolidate
  plugin: schedule-reconsolidate
  config: { cadence: { cron: "0 0 4 * * *" }, catch_up: true, command: "reconsolidate", agent: sol }
