# bundles/bough-headless.yml — the headless surface (§17 Phase 2).
#
# ONE row. An empty `task` means the row mounts, activates and does nothing, so `--profile
# headless` is usable on its own; `bough exec "<task>"` overlays one synthetic patch layer that
# writes the task here (§0.1 item 2: the subcommand is composition, not behaviour).
- id: exec
  plugin: exec
  config:
    task: ""
    agent: sol
    traj: lane/sol
    print: text
    exit_when_idle: true

# §17 Phase 6: the two rows the Phase-6 subcommands overlay. Both are INERT as written — an empty
# `server`/`file` mounts, activates and does nothing — so `--profile headless` stays usable on its
# own and `bough mcp call` / `bough wards test` have a row to write (§0.1 item 2).
- id: mcp.call
  plugin: mcp-call
  config: { server: "", tool: "", args: "", print: text, exit_when_done: true }
- id: wards.test
  plugin: ward-test
  config: { file: "", since: "", print: text, exit_when_done: true }
