# bundles/bough-tui-app.yml — the terminal surface (§11, §17 Phase 3), stacked on `bough-base`.
#
# Reading order is the seam order of the phase plan: the human-command Definition, the shell that
# owns the terminal, the three panes that register into its slots, then the two rows that are NOT
# terminal features at all — §5's catch-up at launch and §14's throwaway old-feed bridge, both of
# which work headless and live here only because this is the profile that boots them.
#
# `tui-probe`/`tui-never`, `llm-replay` and `agent-loop-scripted` are in the binary's catalog and
# in NO bundle (the `projection-probe` precedent): the tests' and `scripts/tui/`'s own `--patch`
# mounts them.
- id: tui
  plugin: tui-shell
  config:
    backend: auto
    size: [120, 40]
    frame_ms: 16
    tick_ms: 250
    theme: dark
    mouse: true
    osc52: true
    clipboard: true
    composer_max_lines: 6
    search_pane: tui.search
    page_lines: 10
    wheel_lines: 3
    # `/help` lists every registered command; Phase 5's seven pushed the list past eight rows.
    # The band is clamped to the rows above the composer anyway, and an overflow now names how
    # many lines it dropped, so this is a ceiling rather than a silent knife.
    notice_max_lines: 40
    # phase ux1 §2.13. `transcript_pane` is what makes PageUp/PageDown/Home/End work from EVERY
    # focus (B2): the shell routes them here without asking who has the keyboard.
    transcript_pane: tui.focus
    # 0 = NO prose measure: text wraps at the pane's full width (Andrey, 2026-08-31 — "make the
    # setup stretch out fully"). Set a number (the old 90) to get a readable-measure margin back.
    measure_cols: 0
    gutter: 1
    exit_arm_ms: 3000
    paste_burst_ms: 20
    history_cap: 200
    notice_ms: 6000
    flash_ms: 900
    # The kitty keyboard protocol (Shift+Enter as a newline on terminals that speak it). `false`
    # keeps legacy key reporting.
    keyboard_enhancement: true

# §11 "The resident": the attach listener. A bare `bough` on another terminal connects here and
# becomes a thin client of THIS process; one client at a time, a later attach detaches the
# earlier. The socket default is the one path the launcher's client also derives — a patched
# socket is for tests and swaps, not a second way in.
- id: tui.attach
  plugin: tui-attach
  config:
    socket: !!expr 'bough_path("tui.sock")'
    handshake_ms: 10000

- id: tui.strip
  plugin: tui-strip
  config:
    width: 34
    show_about: true
    # The TUI brief (D4, round 5): each about half wraps to up to TWO lines under the name — six
    # lanes at three each was most of a 40-row frame.
    about_lines: 2
    # phase ux1 §2.5 (M13): the rail was 34 columns at 80 and at 200. Below `collapse_cols` it
    # takes ZERO columns and the conversation gets the terminal; above it, it is clamped.
    collapse_cols: 100
    min_width: 22
    max_width: 40
    # The blank column between rail and transcript is `tui.gutter` above: ONE column, ONE knob.

# phase ux1 §2.5, §2.13: the status line. A row of its own — not a field of `tui.strip` — because
# this phase's SWAP gate disables it by patch while the TUI runs and asserts the layout reflows
# (`scripts/tui/25-swap-status.sh`). A pane that is a field of another row cannot be disabled by a
# patch, and a swap test that cannot fail proves nothing.
- id: tui.status
  plugin: tui-status
  config:
    cwd_max: 40
    spinner: "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"
    spinner_ms: 80
    # `esc to interrupt` is NOT here: it is `Field::StopKey`, which exists only while a turn is
    # running (M14). A static hint that reads the same idle and running teaches nothing and pins
    # nothing.
    hints: ["? = help", "^f = search", "tab = panes"]

# §11: the terminal tab names the focused lane, so a wall of tabs reads the way the rail does. A
# row of its own: disabling it by patch writes `idle` and stops the attach-replay, so no tab is
# ever left holding a stale lane name.
- id: tui.title
  plugin: tui-title
  config:
    format: "{lane} · bough"
    idle: bough

- id: tui.focus
  plugin: tui-focus
  config:
    max_rows: 2000
    max_tool_lines: 200
    page_lines: 20
    expand_new_tools: false
    show_reasoning: true
    # The context view (Andrey, 2026-08-28): the pane shows the model's next context, section by
    # section — digest and pins standing at the top, tier summaries, the recent steps, mail —
    # rebuilt this many ms after a ledger step. `false` is the plain transcript.
    context: true
    context_refresh_ms: 150

- id: tui.search
  plugin: tui-search
  config: { height: 12, limit: 50, debounce_ms: 150, snippet_radius: 40, window: 400 }

# §11 "The panel": the tabbed surface over the running composition (config · connectors ·
# model). Mounted by default because CLOSED IT COSTS ZERO ROWS (it reports zero Aux rows until
# `^t` or `/config` opens it) — the constraint that kept the digging panes out of this bundle
# does not bind it. Toggles write `$BOUGH_HOME/bough.ui.patch.yml` (§0.5, the `ui` layer).
- id: tui.panel
  plugin: tui-panel
  config:
    height: 18
    collapse_rows: 14
    min_rows: 6
    max_rows: 28
    refresh_ms: 1000

- id: residents
  plugin: residents
  config:
    # Phase 5: the roster BREATHES. `trunk` and `roots` are the two lanes Andrey starts with; a
    # third is born by the leader's `create_lane`, not by editing this list.
    # `trunk` answers Andrey (the leader mounts here); `roots` is unattended work. Renamed from
    # sol/terra 2026-08-31 — those collided with a vendor's model codenames.
    bootstrap: [trunk, roots]
    traj_prefix: "lane/"
    resume_all: true
    catch_up: true

- id: old-feed
  # §17 Phase 6: the collectors replace it. The row stays for one week as the documented revert
  # path, then goes.
  disabled: true
  plugin: old-feed-adapter
  config:
    jungler_db: !!expr 'home_path(".jungler/jungler.db")'
    bough_db:   !!expr 'home_path(".bough/bough.db")'
    state_db:   !!expr 'bough_path("old-feed.db")'
    poll_ms: 30000
    batch: 200
    deliver_to: trunk
    priming_limit: 40
    tier1: true

# Phase 5 (§2, §17 Phase 5): the leader is an ORDINARY agent row with a plugin set mounted in its
# scope. One `disabled: true` on `leader` takes the whole set down, and one `leader.config.agent`
# edit moves it to another lane — which is this phase's SWAP gate
# (`crates/bough/tests/leader_swap.rs`, `scripts/tui/15-leader-swap.sh`).
#
# DEVIATION from the phase plan's `leader.set` GROUP row: the composer REFUSES a plugin-less row
# (`ComposeError::MissingPlugin`, `config/compose.rs`) — Decision D18's "pure group row" is a
# comment in `config/entry.rs` that the composer never implemented, and Phase 5 touches no kernel.
# Nesting `tool.leader` INSIDE the `leader` row gives the group its one property that mattered:
# one `disabled: true` on the parent takes both rows down.
- id: leader
  plugin: leader
  config:
    agent: trunk
    persona: |
      You hold the whole population in view. You adopt mail nobody claimed and keep the
      timeline. Lanes are yours, both ways: open one with create_lane the moment a stream of
      work deserves its own (as many as the work needs), and fold finished or long-quiet ones
      back with merge_lanes — the Lanes section you see every wake is your roster, and unremarked
      clutter in it is your failure mode. Andrey can /undo a creation; trajectories are never
      lost. Standing instructions are pins only Andrey sets.
    adopt_batch: 20
    attribute_reconsolidation: true
- id: tool.leader
  plugin: tool-leader
  config: {}
# §11/§7: the drafts pane. Everything outward-facing that is not one of the four action kinds is a
# DRAFT, and this is where Andrey reads them.
# `tui.drafts` is no longer mounted (the TUI brief, D6): a draft is a card in the transcript,
# where the agent wrote it, with `copy` and `open` — never a send. The pane stayed one row tall
# saying "nothing written yet" on every fresh session; the card appears only when there is one.
# Phase c (§11 "Digging", §8): the three digging panes — `tui-preview`, `tui-timeline`,
# `tui-drift` — are in the CATALOG and in no bundle, the `tui-probe` precedent. They are mounted by
# a patch (`scripts/tui/27-29`, and by hand when digging).
#
# WHY they are not on by default: `Slot::Aux` splits ONE column band between its panes, so three
# more always-present panes squeezed the focus pane down to nothing — `scripts/tui/01-boot-and-turn`
# caught it. Turning them on by default needs an Aux policy where a pane costs its band only while
# it is open, which is a `tui-shell` change and not this track's to make
# (`docs/track-c-merge-notes.md`).
